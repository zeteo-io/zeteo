# The one spec for Zeteo: `npm run openapi:lint` / `npm run openapi:build`.
extends:
  - recommended

apis:
  zeteo:
    root: openapi/openapi.yaml
    output: openapi/bundled-openapi.yaml

rules:
  # Localhost server URLs are intended.
  no-server-example.com: off
  # The licence is Apache-2.0 by name and URL, which the strict rule does not take.
  info-license-strict: off
  # Every operation declares security; public ones (health) opt out
  # explicitly with `security: []`.
  security-defined: error
  # Health is public and takes no input, so it has no client error to describe.
  operation-4xx-response: off
