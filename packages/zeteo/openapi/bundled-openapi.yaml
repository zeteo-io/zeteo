openapi: 3.1.0
info:
  title: Zeteo API
  version: 0.1.0
  description: |
    Zeteo is a query service for apps built on tereo. An administrator registers databases as
    sources; this spec covers the source administration API. Every path in this spec is the full
    path on the service: the API is versioned under `/v1`, and `GET /health` stays at the root.

    ## Authentication

    Requests carry a tereo access token as `Authorization: Bearer <token>`. Zeteo verifies it with
    tereo's SDK.

    ## Permissions

    Reading sources, tables and relations needs `zeteo.sources.read`; registering, changing,
    archiving, testing and refreshing a source, describing a table and declaring or removing a
    relation need `zeteo.sources.write`, which includes read. Without the permission the answer is
    `403 forbidden`, before the body is validated or any source is looked up.

    ## Sources

    A source's `settings` depend on its `type` and are write-only in part: the response carries
    the settings the adapter marks safe (`password` and `ca` are never returned). See
    `docs/sources.md` for the settings of each type, the login check and its override, and the
    network rules.

    ## Catalogue

    A refresh reads a source's tables, columns and foreign keys into the catalogue. Ids of tables,
    columns and relations are stable across refreshes, which never delete a row, change a
    description or touch a declared relation: what disappears from the source is marked with
    `missing_since`. See `docs/catalog.md`.

    ## Pagination

    Lists take `limit` (default 50, at most 100) and an opaque `cursor`, and answer
    `{ data, next_cursor }`, where `next_cursor` is `null` on the last page.

    ## Errors

    An error is `{ "error": "<code>", "error_description": "<text>", ...details }`. A validation
    failure is `400 invalid_request` with `issues`, a list of `{ path, message }`. The text of a
    database's own error never appears in a response.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:4201
    description: Local development server (each app deploys its own Zeteo; substitute its host)
security:
  - BearerAuth: []
tags:
  - name: Sources
    description: Databases registered with Zeteo
  - name: Catalogue
    description: A source's tables, columns and relations, read from the source by a refresh
  - name: Platform
    description: Health
paths:
  /health:
    get:
      tags:
        - Platform
      summary: Health check
      description: |
        Whether Postgres and Redis answer. Public: it names no version and takes no token.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A dependency does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/sources:
    get:
      tags:
        - Sources
      summary: List sources
      description: |
        Lists sources in creation order (`created_at`, then `id`). Archived sources are left out
        unless `include_archived=true`. A source whose stored settings cannot be decrypted is
        listed with `settings: null`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without).
      operationId: listSources
      parameters:
        - name: include_archived
          in: query
          required: false
          description: Also list archived sources
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Sources
      summary: Register a source
      description: |
        Registers a database. Before anything is stored, Zeteo validates `settings` against the
        type's schema, checks the host against the deploy's network rules, connects with the login
        and inspects its rights. A login that holds rights a read-only login would not is refused
        with `422 writable_login` (the body lists the finding codes) unless `allow_writable_login`
        is true, in which case the source is stored with `writable_login_allowed: true` and the audit
        entry records the finding codes. Nothing is stored when any step fails. An audit entry
        `zeteo.source.created` is written with the slug and type, never the settings.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `409 slug_taken`, `422 host_not_allowed`, `422 writable_login`,
        `422 source_type_unavailable`, `502 source_unreachable`.
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The destination or login was refused - `host_not_allowed`, `writable_login` (with `findings`) or `source_type_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`, the source could not be reached or refused the login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}:
    get:
      tags:
        - Sources
      summary: Get a source
      description: |
        Returns one source, archived or not. `settings` is redacted, and null when the stored
        settings cannot be decrypted.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without).
      operationId: getSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Sources
      summary: Change a source
      description: |
        Changes any of the create fields except `slug` and `type`. A request without `settings`
        never contacts the source. With `settings`, the new object replaces the old one whole and
        goes through the same checks as a create (the login check included; send
        `allow_writable_login: true` again to keep an override); the source's open connections are
        closed so the next use connects with the new settings. An audit entry
        `zeteo.source.updated` lists the names of the fields changed, never their values.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived`, `422 host_not_allowed`,
        `422 writable_login`, `502 source_unreachable`.
      operationId: updateSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The destination or login was refused - `host_not_allowed` or `writable_login` (with `findings`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/archive:
    post:
      tags:
        - Sources
      summary: Archive a source
      description: |
        Archives the source and closes its connections. Sources are never deleted, and an archived
        source takes no further change. An audit entry `zeteo.source.archived` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived` (already archived).
      operationId: archiveSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/test:
    post:
      tags:
        - Sources
      summary: Test a source's login
      description: |
        Connects with the stored settings on a fresh connection, re-checks the host against the
        network rules and runs the login check. Returns the findings (empty for a read-only login);
        it changes nothing, whatever it finds.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived`, `422 host_not_allowed`,
        `502 source_unreachable`.
      operationId: testSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: The login check's findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSourceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          description: The host is not permitted - `host_not_allowed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/refresh:
    post:
      tags:
        - Catalogue
      summary: Refresh a source's catalogue
      description: |
        Reads the source's tables, views, columns and foreign keys and brings the catalogue up to
        date. New things are added; things no longer in the source get `missing_since` (and lose it
        if they return); a column whose type changed is updated in place. A refresh never deletes a
        row, changes an id or a description, or touches a declared relation. It sets the source's
        `status` to `active` and `last_refreshed_at`. If the source cannot be read the status
        becomes `unreachable`, the catalogue is left as it was and the answer is
        `502 source_unreachable`. An audit entry `zeteo.source.refreshed` carries the summary.
        See `docs/catalog.md`.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived`, `422 host_not_allowed`,
        `502 source_unreachable`.
      operationId: refreshSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: What the refresh changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSummary'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          description: The host is not permitted - `host_not_allowed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/tables:
    get:
      tags:
        - Catalogue
      summary: List a source's tables
      description: |
        Lists tables and views in `schema_name`, `name` order. Tables a refresh no longer finds
        (`missing_since` set) are left out unless `include_missing=true`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without).
      operationId: listTables
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - name: include_missing
          in: query
          required: false
          description: Also list tables a refresh no longer finds
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/tables/{tableId}:
    get:
      tags:
        - Catalogue
      summary: Get a table
      description: |
        A table with its columns (in position order) and the relations that start at it, including
        declared ones and ones a refresh marked missing.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without).

        **Errors:** `404 not_found` for an unknown table or one of another source.
      operationId: getTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Catalogue
      summary: Describe a table and its columns
      description: |
        Sets the table's description and the descriptions of named columns. A description is at
        most 2000 characters; `null` clears it. A refresh never changes a description. An audit
        entry `zeteo.source.updated` records the table and what changed.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `400 invalid_request` (a description too long, a column the table does not
        have, an empty body), `404 not_found`, `409 source_archived`.
      operationId: patchTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTableRequest'
      responses:
        '200':
          description: The table after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/relations:
    get:
      tags:
        - Catalogue
      summary: List a source's relations
      description: |
        Lists discovered and declared relations in creation order, including ones a refresh marked
        missing (`missing_since`).

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without).
      operationId: listRelations
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of relations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRelationsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Catalogue
      summary: Declare a relation
      description: |
        Adds a relation the database does not enforce with a foreign key. Both tables must belong to
        this source; the column lists must have the same length, name present columns, and pair
        columns of the same normalised type that is not `other` or `json`. The name is unique on
        the from table, whether the other relation is discovered or declared. An audit entry
        `zeteo.relation.declared` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found` (the source), `409 relation_name_taken`, `409 source_archived`,
        `422 invalid_relation`.
      operationId: declareRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareRelationRequest'
      responses:
        '201':
          description: The declared relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The relation is not valid - `invalid_relation`; the description says which check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/relations/{relationId}:
    delete:
      tags:
        - Catalogue
      summary: Remove a declared relation
      description: |
        Removes a declared relation. A discovered relation comes from a foreign key and cannot be
        removed. An audit entry `zeteo.relation.removed` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found` (also a relation of another source), `409 relation_discovered`,
        `409 source_archived`.
      operationId: deleteRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/RelationIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A tereo access token. Zeteo verifies it with tereo's SDK and takes the caller's user id and
        permissions from it.

        Routes ask for `zeteo.sources.read` (the reads) or `zeteo.sources.write` (every change, and
        the login test). Permissions are tereo's dotted, hierarchical form: `write` covers `read`.
  parameters:
    CursorParam:
      name: cursor
      in: query
      description: |
        Opaque cursor for keyset pagination: the `next_cursor` of the previous page. Omit it on the
        first request. A malformed cursor is `400 invalid_request`.
      required: false
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TableIdParam:
      name: tableId
      in: path
      required: true
      description: The table's id, in the source named by the path. A table of another source is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    RelationIdParam:
      name: relationId
      in: path
      required: true
      description: The relation's id, in the source named by the path. A relation of another source is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    SourceIdParam:
      name: sourceId
      in: path
      required: true
      description: The source's id. A value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
  responses:
    BadRequestResponse:
      description: Bad request - `invalid_request`, with `issues`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedResponse:
      description: Unauthorized - the access token is missing, invalid or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenResponse:
      description: Forbidden - the token lacks the permission the route needs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundResponse:
      description: Not found - no source has this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictResponse:
      description: Conflict - `slug_taken`, `source_archived` (the source is archived and takes no change), or `version_conflict` (a concurrent write; re-read and retry)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeResponse:
      description: Payload too large - `payload_too_large`, the body is over the route's size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerErrorResponse:
      description: Server error - `server_error`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableResponse:
      description: |
        Service unavailable - `temporarily_unavailable`: the database was too busy (a transaction or a
        lock wait ran out of time, or no connection was free). Nothing was changed; retry, after
        `Retry-After` when it is given.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContentResponse:
      description: Done; no content
  schemas:
    Error:
      type: object
      description: Every error body
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          description: A stable, machine-readable code
        error_description:
          type: string
          description: A human-readable explanation
        issues:
          type: array
          description: On `invalid_request`, the failed checks
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: string
                description: The field, dotted (`settings.port`); empty for the whole value
              message:
                type: string
        findings:
          type: array
          description: On `writable_login`, the codes of what the login check found
          items:
            type: string
    HealthStatus:
      type: object
      required:
        - status
        - postgres
        - redis
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        postgres:
          type: string
          enum:
            - ok
            - fail
        redis:
          type: string
          enum:
            - ok
            - fail
    SourceType:
      type: string
      enum:
        - postgres
        - azure-sql
      description: |
        The kind of database. `azure-sql` is reserved: creating one answers `422 source_type_unavailable`.
    PostgresSettings:
      type: object
      description: |
        The settings of a `postgres` source. Unknown keys are refused. A source's settings are
        replaced whole by an update. `password` and `ca` are stored encrypted and never returned.
      required:
        - host
        - database
        - user
        - password
      additionalProperties: false
      properties:
        host:
          type: string
          description: A hostname or IP address the deploy's network rules permit
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        database:
          type: string
          minLength: 1
        user:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
        tls:
          type: string
          enum:
            - verify
            - require
            - 'off'
          default: verify
          description: '`verify` checks the server certificate (against `ca` when given); `require` encrypts without checking it'
        ca:
          type: string
          writeOnly: true
          description: PEM certificate authority to verify the server against
    LoginFinding:
      type: object
      description: A right the source's login holds that a read-only login would not
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - superuser
            - can_create_roles
            - can_create_databases
            - bypasses_row_security
            - owns_objects
            - can_write_tables
            - can_create_in_schema
            - write_role_member
            - replication
            - reads_server_files
        detail:
          type: string
    Source:
      type: object
      description: A registered database. `settings` is the redacted form; it is null when the stored settings cannot be decrypted.
      required:
        - id
        - slug
        - name
        - type
        - settings
        - schemas
        - timeout_ms
        - row_cap
        - export_enabled
        - export_row_cap
        - writable_login_allowed
        - status
        - last_refreshed_at
        - created_at
        - archived_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/SourceType'
        settings:
          type:
            - object
            - 'null'
          description: The type's settings without `password` and `ca`
          additionalProperties: true
        schemas:
          type: array
          description: The database schemas Zeteo exposes
          items:
            type: string
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 120000
        row_cap:
          type: integer
          minimum: 1
          maximum: 50000
        export_enabled:
          type: boolean
        export_row_cap:
          type: integer
          minimum: 0
          maximum: 1000000
        writable_login_allowed:
          type: boolean
          description: True when the login check found something and an administrator allowed it
        status:
          type: string
          enum:
            - active
            - unreachable
        last_refreshed_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
    ListSourcesResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        next_cursor:
          type:
            - string
            - 'null'
          description: The cursor of the next page, `null` on the last
    CreateSourceRequest:
      type: object
      required:
        - slug
        - name
        - type
        - settings
        - schemas
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
          description: Unique, lower case letters, digits and hyphens, starting with a letter
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/SourceType'
        settings:
          description: The type's settings; for `postgres`, see PostgresSettings
          $ref: '#/components/schemas/PostgresSettings'
        schemas:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 63
            description: At most 63 bytes, no control characters, no leading or trailing whitespace
        allow_writable_login:
          type: boolean
          description: Accept a login the check found rights on; ignored when it found none
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 120000
          default: 30000
        row_cap:
          type: integer
          minimum: 1
          maximum: 50000
          default: 50000
        export_enabled:
          type: boolean
          default: false
        export_row_cap:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
    UpdateSourceRequest:
      type: object
      description: |
        Any of the create fields except `slug` and `type`, at least one. `settings` replaces the whole
        settings object and runs the same checks as a create; `allow_writable_login` is accepted only
        together with `settings`.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        settings:
          $ref: '#/components/schemas/PostgresSettings'
        schemas:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 63
            description: At most 63 bytes, no control characters, no leading or trailing whitespace
        allow_writable_login:
          type: boolean
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 120000
        row_cap:
          type: integer
          minimum: 1
          maximum: 50000
        export_enabled:
          type: boolean
        export_row_cap:
          type: integer
          minimum: 0
          maximum: 1000000
    TestSourceResponse:
      type: object
      required:
        - ok
        - findings
      properties:
        ok:
          type: boolean
          const: true
        findings:
          type: array
          items:
            $ref: '#/components/schemas/LoginFinding'
    ColumnType:
      type: string
      enum:
        - text
        - number
        - boolean
        - date
        - timestamp
        - json
        - other
      description: The normalised type; `native_type` keeps the database's own name
    Table:
      type: object
      description: A table or view of a source
      required:
        - id
        - source_id
        - schema_name
        - name
        - kind
        - description
        - last_seen_at
        - missing_since
      properties:
        id:
          type: string
          format: uuid
          description: Stable across refreshes
        source_id:
          type: string
          format: uuid
        schema_name:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - table
            - view
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        last_seen_at:
          type: string
          format: date-time
        missing_since:
          type:
            - string
            - 'null'
          format: date-time
          description: Set when a refresh no longer finds the table; cleared when it returns
    Column:
      type: object
      required:
        - id
        - name
        - type
        - native_type
        - nullable
        - position
        - is_primary_key
        - description
        - missing_since
      properties:
        id:
          type: string
          format: uuid
          description: Stable across refreshes
        name:
          type: string
        type:
          $ref: '#/components/schemas/ColumnType'
        native_type:
          type: string
          examples:
            - integer
            - character varying(20)
        nullable:
          type: boolean
        position:
          type: integer
          minimum: 1
        is_primary_key:
          type: boolean
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        missing_since:
          type:
            - string
            - 'null'
          format: date-time
    Relation:
      type: object
      description: A join from one table to another, in the direction `from` to `to`
      required:
        - id
        - name
        - from_table_id
        - from_columns
        - to_table_id
        - to_columns
        - to_many
        - origin
        - missing_since
      properties:
        id:
          type: string
          format: uuid
          description: Stable across refreshes
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
          description: Unique on the from table. A discovered relation takes its name from the database's identifiers, which may not follow this pattern.
        from_table_id:
          type: string
          format: uuid
        from_columns:
          type: array
          minItems: 1
          items:
            type: string
        to_table_id:
          type: string
          format: uuid
        to_columns:
          type: array
          minItems: 1
          description: Pairs with `from_columns` by position
          items:
            type: string
        to_many:
          type: boolean
        origin:
          type: string
          enum:
            - discovered
            - declared
          description: '`discovered` relations come from foreign keys and a refresh keeps them current; `declared` ones are added by an administrator and a refresh never touches them'
        missing_since:
          type:
            - string
            - 'null'
          format: date-time
          description: Set when a refresh no longer finds the foreign key; always null for a declared relation
    TableDetail:
      description: A table with its columns and the relations that start at it
      allOf:
        - $ref: '#/components/schemas/Table'
        - type: object
          required:
            - columns
            - relations
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/Column'
            relations:
              type: array
              items:
                $ref: '#/components/schemas/Relation'
    ListTablesResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Table'
        next_cursor:
          type:
            - string
            - 'null'
          description: The cursor of the next page, `null` on the last
    ListRelationsResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        next_cursor:
          type:
            - string
            - 'null'
          description: The cursor of the next page, `null` on the last
    PatchTableRequest:
      type: object
      description: At least one field. What the body leaves out is not changed; `null` clears a description.
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        columns:
          type: array
          minItems: 1
          maxItems: 1000
          description: Column descriptions by column name; a name the table does not have is `400 invalid_request`
          items:
            type: object
            required:
              - name
              - description
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 128
              description:
                type:
                  - string
                  - 'null'
                maxLength: 2000
    DeclareRelationRequest:
      type: object
      required:
        - name
        - from_table_id
        - from_columns
        - to_table_id
        - to_columns
        - to_many
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
        from_table_id:
          type: string
          format: uuid
        from_columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
        to_table_id:
          type: string
          format: uuid
        to_columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
        to_many:
          type: boolean
    RefreshSummary:
      type: object
      description: What a refresh changed. `missing` counts things newly marked missing in this refresh.
      required:
        - tables
        - columns
        - relations
      properties:
        tables:
          type: object
          required:
            - added
            - missing
            - restored
          properties:
            added:
              type: integer
              minimum: 0
            missing:
              type: integer
              minimum: 0
            restored:
              type: integer
              minimum: 0
        columns:
          type: object
          required:
            - added
            - changed
            - missing
            - restored
          properties:
            added:
              type: integer
              minimum: 0
            changed:
              type: integer
              minimum: 0
              description: Columns whose type, native type, nullability or primary-key flag changed
            missing:
              type: integer
              minimum: 0
            restored:
              type: integer
              minimum: 0
        relations:
          type: object
          required:
            - added
            - missing
            - restored
          properties:
            added:
              type: integer
              minimum: 0
            missing:
              type: integer
              minimum: 0
            restored:
              type: integer
              minimum: 0
x-tagGroups:
  - name: Sources
    tags:
      - Sources
      - Catalogue
  - name: Platform
    tags:
      - Platform
