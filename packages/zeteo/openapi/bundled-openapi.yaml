      description: |
        Adds a panel to the caller's own dashboard (at most 50). An own panel's saved query must be one
        the caller may see (their own, shared with them, or marked `available_for_dashboards` in their
        signed-in organization; anything else is `404 not_found`) and that is available for dashboards,
