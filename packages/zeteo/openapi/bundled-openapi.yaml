        the caller may run and that is available for dashboards; the chart and time column are checked as
        for a dashboard's panel (`400 invalid_panel` with `problems`; `403 saved_query_not_accessible`
        for a saved query the caller may not run). The name is unique among the caller's saved panels,
        whatever the case. A `zeteo.saved_panel.created` audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: createSavedPanel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavedPanelRequest'
      responses:
        '201':
          description: The saved panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPanel'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/SavedQueryNotAccessibleResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has a saved panel of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-panels/{savedPanelId}:
    get:
      tags:
        - Dashboards
      summary: Get a saved panel
      description: |
        For its owner, a user it is shared with (directly or through a group) and a holder of
