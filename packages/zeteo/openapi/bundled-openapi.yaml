      description: |
        A panel of the caller's own dashboard. Give at least one of `title`, the place (`x`, `y`, `w`,
        `h`) and, for an own panel, `saved_query_id`, `chart` and `time_column`; a linked panel has no
        settings of its own, so changing those is `400 invalid_panel` (change the saved panel, or detach
        the panel). A new saved query, chart or time column is checked as `POST .../panels` checks them
        (`400 invalid_panel` with `problems`; `403 saved_query_not_accessible` for a saved query the
        caller may not run); a title or place changes without asking whether the caller can run it. A
