            example:
              metric:
                name: cost_per_dollar
                description: Ad spend per dollar of revenue.
                formula:
                  div:
                    - measure: spend
                    - measure: revenue
              bucket: month
              range:
                gte:
                  relative:
                    unit: year
                    offset: 0
                    startOf: true
      responses:
        '200':
          description: The rows, as `POST /v1/query` answers them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          description: |
