      responses:
        '200':
          description: The saved panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPanel'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/SavedQueryNotAccessibleResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has a saved panel of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Dashboards
      summary: Delete a saved panel
      description: |
        Its owner, or a holder of `zeteo.dashboards.write`; anyone else gets `404 not_found`. A panel
        that linked it shows `saved_panel_deleted`. A `zeteo.saved_panel.deleted` audit entry is
        written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: deleteSavedPanel
      parameters:
        - $ref: '#/components/parameters/SavedPanelIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-panels/{savedPanelId}/copy:
    post:
      tags:
        - Dashboards
      summary: Copy a saved panel
      description: |
        Makes the caller's own copy of a saved panel they can see and run: the same description, saved
        query, chart and time column. One they can see but not run is refused as a dashboard refuses it
        (`403 saved_query_not_accessible`, or `400 invalid_panel` when what the owner built is broken). A
        `zeteo.saved_panel.copied` audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: copySavedPanel
      parameters:
        - $ref: '#/components/parameters/SavedPanelIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopySavedPanelRequest'
      responses:
        '201':
          description: The copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPanel'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/SavedQueryNotAccessibleResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has a saved panel of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-panels/{savedPanelId}/preview:
    post:
      tags:
        - Dashboards
      summary: Preview a saved panel
      description: |
        Runs the saved panel's saved query as the caller, as `POST /v1/query` runs one, with its `time_range`
        applied to the saved panel's time column when it has one (none runs it unfiltered), and `limit`
        at most 5000. The run is recorded against the saved query. Decided as a panel is: a saved panel
        the caller cannot run is `403 saved_query_not_accessible`, whatever the cause, and one whose
        owners broke it is `400 invalid_panel`. The errors of the query itself (`429`, `502`, `504`
        and the rest of `POST /v1/query`) are as there.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: previewSavedPanel
      parameters:
        - $ref: '#/components/parameters/SavedPanelIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewSavedPanelRequest'
      responses:
        '200':
          description: The rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/SavedQueryNotAccessibleResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `source_archived`, the source was archived while the query ran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The stored query cannot be run - the codes of `POST /v1/query`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '429':
          description: Too many queries - `too_many_queries` or `source_busy`; retry after `Retry-After`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `query_failed` or `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
        '504':
          description: Gateway timeout - `query_timeout`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/saved-panels/{savedPanelId}/shares:
    get:
      tags:
        - Dashboards
      summary: List who a saved panel is shared with
      description: |
        For its owner, or a holder of `zeteo.dashboards.read`. Anyone else gets `404 not_found`.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: listSavedPanelShares
      parameters:
        - $ref: '#/components/parameters/SavedPanelIdParam'
      responses:
        '200':
          description: The shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSharesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Dashboards
      summary: Replace who a saved panel is shared with
      description: |
        Makes the shares exactly `principals` (at most 100, each once, not the owner): for its owner, or a
        holder of `zeteo.dashboards.write` (a holder of `zeteo.dashboards.read` alone gets `403 forbidden`;
        anyone else, `404 not_found`). A group being added must be global or of the caller's signed-in
        organization (`400 invalid_share`). A user is never limited by organization. Recipients' access to
        what the saved panel is built on is not checked: each panel is decided as its viewer looks, so sharing
        never widens anyone's access. A `zeteo.saved_panel.shared` audit entry is written when anything changed.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: replaceSavedPanelShares
      parameters:
        - $ref: '#/components/parameters/SavedPanelIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSharesRequest'
      responses:
        '200':
          description: The shares as they now stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSharesResponse'
        '400':
          description: Bad request - `invalid_request`, with `issues`, or `invalid_share` (the owner among the principals, or a group of another organization or one tereo does not have)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the shares changed while saving; load them again and retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-panels/{savedPanelId}/transfer:
    post:
      tags:
        - Dashboards
      summary: Transfer a saved panel to another user
      description: |
        Makes `user_id` the owner: for its owner, or a holder of `zeteo.dashboards.write` (a holder of
        `zeteo.dashboards.read` alone gets `403 forbidden`; anyone else, `404 not_found`). With
        `keep_access` (the default) the previous owner keeps a direct share. The new owner may not already
        have a saved panel of that name (`409 conflict`) and may not be a service account (`400
        invalid_transfer`, as when the user already owns it or tereo has no such user). A
        `zeteo.saved_panel.transferred` audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: transferSavedPanel
      parameters:
        - $ref: '#/components/parameters/SavedPanelIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnerRequest'
      responses:
        '200':
          description: The saved panel as the caller now sees it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPanel'
        '400':
          description: Bad request - `invalid_request`, with `issues`, or `invalid_transfer` (the user already owns it, tereo has no such user, or the user is a service account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has a saved panel of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A tereo access token. Zeteo verifies it with tereo's SDK and takes the caller's user id and
        permissions from it.

        Routes ask for `zeteo.sources.read` (the reads) or `zeteo.sources.write` (every change, and
        the login test). Permissions are tereo's dotted, hierarchical form: `write` covers `read`.
  parameters:
    CursorParam:
      name: cursor
      in: query
      description: |
        Opaque cursor for keyset pagination: the `next_cursor` of the previous page. Omit it on the
        first request. A malformed cursor is `400 invalid_request`.
      required: false
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TableIdParam:
      name: tableId
      in: path
      required: true
      description: The table's id, in the source named by the path. A table of another source is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    RelationIdParam:
      name: relationId
      in: path
      required: true
      description: The relation's id, in the source named by the path. A relation of another source is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    GrantIdParam:
      name: grantId
      in: path
      required: true
      description: The grant's id. A value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    PrincipalLimitIdParam:
      name: principalLimitId
      in: path
      required: true
      description: The limits row's id. A value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    SavedQueryIdParam:
      name: savedQueryId
      in: path
      required: true
      description: The saved query's id. One the caller may not see is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    DashboardIdParam:
      name: dashboardId
      in: path
      required: true
      description: The dashboard's id. One the caller may not see is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    PanelIdParam:
      name: panelId
      in: path
      required: true
      description: The panel's id, on the dashboard named by the path. A panel of another dashboard is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    SavedPanelIdParam:
      name: savedPanelId
      in: path
      required: true
      description: The saved panel's id. One the caller may not see is `404 not_found`; a value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    SourceIdParam:
      name: sourceId
      in: path
      required: true
      description: The source's id. A value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
  responses:
    BadRequestResponse:
      description: Bad request - `invalid_request`, with `issues`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedResponse:
      description: Unauthorized - the access token is missing, invalid or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenResponse:
      description: Forbidden - the token lacks the permission the route needs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundResponse:
      description: Not found - nothing has this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictResponse:
      description: Conflict - `slug_taken`, `grant_exists`, `source_archived` (the source is archived and takes no change), `conflict` (a concurrent create of the same thing), or `version_conflict` (a concurrent write; re-read and retry)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeResponse:
      description: Payload too large - `payload_too_large`, the body is over the route's size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerErrorResponse:
      description: Server error - `server_error`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableResponse:
      description: |
        Service unavailable - `temporarily_unavailable`: the database was too busy (a transaction or a
        lock wait ran out of time, or no connection was free). Nothing was changed; retry, after
        `Retry-After` when it is given.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContentResponse:
      description: Done; no content
    SavedQueryNotAccessibleResponse:
      description: |
        Forbidden - `saved_query_not_accessible`: "You need expanded permissions to run this saved
        query. Ask an admin to extend your access." One answer, with no details, for every cause (a
        table or column not granted, a relation not visible, the source archived or not granted, a
        column gone missing), so none can be told apart. The body never holds the query, the source
        or anything the planner said. `forbidden` is the other 403: the token lacks the permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidPanelResponse:
      description: |
        Bad request - `invalid_request`, with `issues`, or `invalid_panel`: a panel whose settings do
        not fit the saved query, the saved panel or the chart, or a panel change that is not allowed.
        `problems` names each setting at fault and why, never a column or anything of the catalogue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidPanelError'
  schemas:
    Error:
      type: object
      description: Every error body
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          description: A stable, machine-readable code
        error_description:
          type: string
          description: A human-readable explanation
        request_id:
          type: string
          description: The request's id, as in its `X-Request-ID` response header; the server's log lines for the request carry it too
        retry_after:
          type: integer
          description: On a `429`, the seconds to wait, as in the `Retry-After` header
        issues:
          type: array
          description: On `invalid_request`, the failed checks
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: string
                description: The field, dotted (`settings.port`); empty for the whole value
              message:
                type: string
        findings:
          type: array
          description: On `writable_login`, what the login check found; at most 20
          maxItems: 20
          items:
            $ref: '#/components/schemas/LoginFinding'
        truncated:
          type: boolean
          const: true
          description: On `writable_login`, present when the check found more than the 20 listed
    HealthStatus:
      type: object
      required:
        - status
        - postgres
        - redis
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        postgres:
          type: string
          enum:
            - ok
            - fail
        redis:
          type: string
          enum:
            - ok
            - fail
    Me:
      type: object
      required:
        - id
        - type
        - name
        - email
        - permissions
      properties:
        id:
          type: string
          format: uuid
          description: The caller's user id (a service account's own user id)
        type:
          type: string
          enum:
            - user
            - service
        name:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
        permissions:
          type: array
          description: Held permissions starting with `zeteo.` (and a bare `admin`, if held), sorted, not expanded along their ladders
          items:
            type: string
    SourceType:
      type: string
      enum:
        - postgres
        - azure-sql
        - upload
      description: The kind of source. `upload` is an upload source (an upload source), whose data Zeteo stores from uploaded files.
    PostgresSettings:
      type: object
      description: |
        The settings of a `postgres` source. Unknown keys are refused. A source's settings are
        replaced whole by an update. `password` and `ca` are stored encrypted and never returned.
      required:
        - host
        - database
        - user
        - password
      additionalProperties: false
      properties:
        host:
          type: string
          description: A hostname or IP address the deploy's network rules permit
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        database:
          type: string
          minLength: 1
        user:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
        tls:
          type: string
          enum:
            - verify
            - require
            - 'off'
          default: verify
          description: '`verify` checks the server certificate (against `ca` when given); `require` encrypts without checking it'
        ca:
          type: string
          writeOnly: true
          description: PEM certificate authority to verify the server against
    AzureSqlSettings:
      type: object
      description: |
        The settings of an `azure-sql` source (Azure SQL Database or SQL Server, SQL authentication).
        Unknown keys are refused. A source's settings are replaced whole by an update. `password` is
        stored encrypted and never returned. The connection is always encrypted.
      required:
        - host
        - database
        - user
        - password
      additionalProperties: false
      properties:
        host:
          type: string
          maxLength: 253
          description: A hostname or IP address the deploy's network rules permit; no instance name
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 1433
        database:
          type: string
          minLength: 1
          maxLength: 128
        user:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        tls:
          type: string
          enum:
            - verify
            - trust-server-certificate
          default: verify
          description: '`verify` checks the server certificate against `host`; `trust-server-certificate` encrypts without checking it'
    LoginFinding:
      type: object
      description: A right the source's login holds that a read-only login would not
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - superuser
            - can_create_roles
            - can_create_databases
            - bypasses_row_security
            - owns_objects
            - can_write_tables
            - can_create_in_schema
            - write_role_member
            - replication
            - reads_server_files
        detail:
          type: string
    Source:
      type: object
      description: A registered database or an upload source. `settings` is the redacted form; it is null for an upload source and when the stored settings cannot be decrypted.
      required:
        - id
        - slug
        - name
        - description
        - type
        - settings
        - schemas
        - timeout_ms
        - row_cap
        - max_joins
        - export_enabled
        - export_row_cap
        - query_concurrency
        - export_concurrency
        - writable_login_allowed
        - owner_id
        - status
        - last_refreshed_at
        - size_bytes
        - size_measured_at
        - share_count
        - created_at
        - archived_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 500
          description: What the source holds; empty when none was given
        type:
          $ref: '#/components/schemas/SourceType'
        settings:
          type:
            - object
            - 'null'
          description: The type's settings without `password` and `ca`
          additionalProperties: true
        schemas:
          type: array
          description: The database schemas Zeteo exposes
          items:
            type: string
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 120000
        row_cap:
          type: integer
          minimum: 1
          maximum: 50000
        max_joins:
          type: integer
          minimum: 1
          maximum: 8
          description: The most joins one query on this source may use
        export_enabled:
          type: boolean
        export_row_cap:
          type: integer
          minimum: 0
          maximum: 1000000
        query_concurrency:
          type: integer
          minimum: 1
          maximum: 50
          description: The queries the source runs at once across every replica; one more is `429 source_busy`
        export_concurrency:
          type: integer
          minimum: 1
          maximum: 10
          description: The exports the source runs at once across every replica; one more is `429 source_busy`
        writable_login_allowed:
          type: boolean
          description: True when the login check found something and an administrator allowed it
        owner_id:
          type:
            - string
            - 'null'
          format: uuid
          description: An upload source's owner; null for a database source
        status:
          type: string
          enum:
            - active
            - unreachable
        last_refreshed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: A database source's last catalogue refresh; an upload source's last load of any of its tables (null before one).
        size_bytes:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            A database source: bytes on disk of the tables (and, on Postgres, materialized views) in
            `schemas`, indexes included, measured by the last catalogue refresh, never on read; null
            until a refresh has measured it (on Azure SQL the login needs `VIEW DATABASE STATE`); a
            later refresh that cannot read it keeps the last measurement. An upload source: the bytes it stores now, counted against its
            owner's quota (0 once deleted).
        size_measured_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When a database source's `size_bytes` was measured; null when it is null, and always for an upload source
        share_count:
          type: integer
          minimum: 0
          description: How many people and groups its tables are granted to (distinct principals of its grants; an upload source's owner grants not counted)
        created_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
    ListSourcesResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        next_cursor:
          type:
            - string
            - 'null'
          description: The cursor of the next page, `null` on the last
    CreateSourceRequest:
      type: object
      required:
        - slug
        - name
        - type
        - settings
        - schemas
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
          description: Unique, lower case letters, digits and hyphens, starting with a letter
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 500
          description: What the source holds, for the people and the AI that query it; trimmed
        type:
          type: string
          enum:
            - postgres
            - azure-sql
          description: The kind of database
        settings:
          description: The type's settings, PostgresSettings or AzureSqlSettings
          anyOf:
            - $ref: '#/components/schemas/PostgresSettings'
            - $ref: '#/components/schemas/AzureSqlSettings'
        schemas:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 63
            description: At most 63 bytes, no control characters, no leading or trailing whitespace
        allow_writable_login:
          type: boolean
          description: Accept a login the check found rights on; ignored when it found none
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 120000
          default: 30000
        row_cap:
          type: integer
          minimum: 1
          maximum: 50000
          default: 50000
        max_joins:
          type: integer
          minimum: 1
          maximum: 8
          default: 4
          description: The most joins one query on this source may use
        export_enabled:
          type: boolean
          default: false
        export_row_cap:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        query_concurrency:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: The queries the source runs at once across every replica; one more is `429 source_busy`
        export_concurrency:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: The exports the source runs at once across every replica; one more is `429 source_busy`
    UpdateSourceRequest:
      type: object
      description: |
        Any of the create fields except `slug` and `type`, at least one. `settings` replaces the whole
        settings object and runs the same checks as a create; `allow_writable_login` is accepted only
        together with `settings`.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 500
          description: Trimmed; an empty one clears it
        settings:
          description: The source type's settings, PostgresSettings or AzureSqlSettings
          anyOf:
            - $ref: '#/components/schemas/PostgresSettings'
            - $ref: '#/components/schemas/AzureSqlSettings'
        schemas:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 63
            description: At most 63 bytes, no control characters, no leading or trailing whitespace
        allow_writable_login:
          type: boolean
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 120000
        row_cap:
          type: integer
          minimum: 1
          maximum: 50000
        max_joins:
          type: integer
          minimum: 1
          maximum: 8
          description: The most joins one query on this source may use
        export_enabled:
          type: boolean
        export_row_cap:
          type: integer
          minimum: 0
          maximum: 1000000
        query_concurrency:
          type: integer
          minimum: 1
          maximum: 50
          description: Applies to the queries that start after the change; a change of the pool's size closes the source's pool once the calls on it end
        export_concurrency:
          type: integer
          minimum: 1
          maximum: 10
          description: As `query_concurrency`, for exports
    TestSourceResponse:
      type: object
      required:
        - ok
        - findings
      properties:
        ok:
          type: boolean
          const: true
        findings:
          type: array
          description: What the login check found; at most 20
          maxItems: 20
          items:
            $ref: '#/components/schemas/LoginFinding'
        truncated:
          type: boolean
          const: true
          description: Present when the check found more than the 20 listed
    ColumnType:
      type: string
      enum:
        - text
        - number
        - boolean
        - date
        - timestamp
        - json
        - other
      description: The normalised type; `native_type` keeps the database's own name
    Table:
      type: object
      description: A table or view of a source
      required:
        - id
        - source_id
        - schema_name
        - name
        - kind
        - description
        - last_seen_at
        - missing_since
        - row_count
        - last_loaded_at
      properties:
        id:
          type: string
          format: uuid
          description: Stable across refreshes
        source_id:
          type: string
          format: uuid
        schema_name:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - table
            - view
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        last_seen_at:
          type: string
          format: date-time
        missing_since:
          type:
            - string
            - 'null'
          format: date-time
          description: Set when a refresh no longer finds the table (on an upload source, when it is removed or the source deleted); cleared when it returns
        row_count:
          type:
            - integer
            - 'null'
          minimum: 0
          description: An upload source's table, the rows loaded. A database source's, an estimate from the database's statistics at the last refresh (Postgres `pg_class.reltuples`, or the live-row count for a table never analyzed, a partitioned table the sum of its partitions'; SQL Server `sys.partitions`), not a count; null for a view, a table the database has no estimate for, or when the refresh could not read them
        last_loaded_at:
          type:
            - string
            - 'null'
          format: date-time
          description: An upload source's table, when it was last loaded; null for a database source's
    Column:
      type: object
      required:
        - id
        - name
        - type
        - native_type
        - nullable
        - position
        - is_primary_key
        - description
        - original_name
        - missing_since
      properties:
        id:
          type: string
          format: uuid
          description: Stable across refreshes
        name:
          type: string
        type:
          $ref: '#/components/schemas/ColumnType'
        native_type:
          type: string
          description: |
            The type as the database writes it. On Postgres an enum is marked `<name> (enum)` and a
            domain `<name> (domain over <base type>)`, the base marked `(enum)` too when it is one
            (`sales.price (domain over money)`); on Azure SQL the type as SQL Server writes it
            (`nvarchar(100)`, `decimal(12,2)`).
          examples:
            - integer
            - character varying(20)
            - sales.order_status (enum)
            - sales.price (domain over money)
        nullable:
          type: boolean
        position:
          type: integer
          minimum: 1
        is_primary_key:
          type: boolean
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        original_name:
          type:
            - string
            - 'null'
          description: An upload source's column, its header as written in the file (also its first description); null for a database source's
        missing_since:
          type:
            - string
            - 'null'
          format: date-time
    Relation:
      type: object
      description: A join from one table to another, in the direction `from` to `to`
      required:
        - id
        - name
        - from_table_id
        - from_columns
        - to_table_id
        - to_columns
        - to_many
        - origin
        - missing_since
      properties:
        id:
          type: string
          format: uuid
          description: Stable across refreshes
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
          description: Unique on the from table. A discovered relation takes its name from the database's identifiers, which may not follow this pattern.
        from_table_id:
          type: string
          format: uuid
        from_columns:
          type: array
          minItems: 1
          items:
            type: string
        to_table_id:
          type: string
          format: uuid
        to_columns:
          type: array
          minItems: 1
          description: Pairs with `from_columns` by position
          items:
            type: string
        to_many:
          type: boolean
        origin:
          type: string
          enum:
            - discovered
            - declared
          description: '`discovered` relations come from foreign keys and a refresh keeps them current; `declared` ones are added by an administrator and a refresh never touches them'
        missing_since:
          type:
            - string
            - 'null'
          format: date-time
          description: Set when a refresh no longer finds the foreign key; always null for a declared relation
    TableDetail:
      description: A table with its columns and the relations that start at it
      allOf:
        - $ref: '#/components/schemas/Table'
        - type: object
          required:
            - columns
            - relations
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/Column'
            relations:
              type: array
              items:
                $ref: '#/components/schemas/Relation'
    ListTablesResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Table'
        next_cursor:
          type:
            - string
            - 'null'
          description: The cursor of the next page, `null` on the last
    ListRelationsResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        next_cursor:
          type:
            - string
            - 'null'
          description: The cursor of the next page, `null` on the last
    PatchTableRequest:
      type: object
      description: At least one field. What the body leaves out is not changed; `null` clears a description.
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        columns:
          type: array
          minItems: 1
          maxItems: 1000
          description: Column descriptions by column name; a name the table does not have is `400 invalid_request`
          items:
            type: object
            required:
              - name
              - description
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 128
              description:
                type:
                  - string
                  - 'null'
                maxLength: 2000
    DeclareRelationRequest:
      type: object
      required:
        - name
        - from_table_id
        - from_columns
        - to_table_id
        - to_columns
        - to_many
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
        from_table_id:
          type: string
          format: uuid
        from_columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
        to_table_id:
          type: string
          format: uuid
        to_columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
        to_many:
          type: boolean
    RefreshSummary:
      type: object
      description: What a refresh changed. `missing` counts things newly marked missing in this refresh.
      required:
        - tables
        - columns
        - relations
      properties:
        tables:
          type: object
          required:
            - added
            - missing
            - restored
          properties:
            added:
              type: integer
              minimum: 0
            missing:
              type: integer
              minimum: 0
            restored:
              type: integer
              minimum: 0
        columns:
          type: object
          required:
            - added
            - changed
            - missing
            - restored
          properties:
            added:
              type: integer
              minimum: 0
            changed:
              type: integer
              minimum: 0
              description: Columns whose type, native type, nullability or primary-key flag changed
            missing:
              type: integer
              minimum: 0
            restored:
              type: integer
              minimum: 0
        relations:
          type: object
          required:
            - added
            - missing
            - restored
          properties:
            added:
              type: integer
              minimum: 0
            missing:
              type: integer
              minimum: 0
            restored:
              type: integer
              minimum: 0
    PrincipalType:
      type: string
      enum:
        - user
        - group
    PrincipalStatus:
      type: string
      enum:
        - active
        - orphaned
        - unknown
      description: |
        Whether the principal still exists in tereo, looked up when the grant or limits row is shown.
        A user or group is `active`, or `orphaned` when tereo has no such user or group; an orphaned
        row is inert. An archived group is `active`, though its row reaches no one. A lookup that fails
        is shown as `unknown`.
    Grant:
      type: object
      description: What one user or group may query of one table
      required:
        - id
        - principal_type
        - principal_id
        - principal_status
        - source
        - table
        - all_columns
        - columns
        - owner_grant
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        principal_id:
          type: string
          format: uuid
          description: The user's or group's tereo id
        principal_status:
          $ref: '#/components/schemas/PrincipalStatus'
        source:
          type: object
          required:
            - id
            - slug
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
        table:
          type: object
          required:
            - id
            - schema_name
            - name
            - missing
          properties:
            id:
              type: string
              format: uuid
            schema_name:
              type: string
            name:
              type: string
            missing:
              type: boolean
              description: The last refresh no longer found the table; the grant is kept
        all_columns:
          type: boolean
          description: When true the grant covers every column of the table, including ones added later, and `columns` is empty
        columns:
          type: array
          description: When `all_columns` is false, the granted columns in table order; columns added to the table later are not included
          items:
            type: object
            required:
              - id
              - name
              - missing
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              missing:
                type: boolean
                description: The last refresh no longer found the column; the grant is kept
        owner_grant:
          type: boolean
          description: The owner's grant on a table of their upload source. It is an ordinary all-columns user grant that cannot be removed or narrowed (`409 owner_grant_locked`); transfer the upload source instead
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListGrantsResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        next_cursor:
          type:
            - string
            - 'null'
    CreateGrantRequest:
      description: A grant of every column, or of a list of columns
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - principal_type
            - principal_id
            - table_id
            - all_columns
          properties:
            principal_type:
              $ref: '#/components/schemas/PrincipalType'
            principal_id:
              type: string
              format: uuid
            table_id:
              type: string
              format: uuid
            all_columns:
              type: boolean
              const: true
        - type: object
          additionalProperties: false
          required:
            - principal_type
            - principal_id
            - table_id
            - all_columns
            - column_ids
          properties:
            principal_type:
              $ref: '#/components/schemas/PrincipalType'
            principal_id:
              type: string
              format: uuid
            table_id:
              type: string
              format: uuid
            all_columns:
              type: boolean
              const: false
            column_ids:
              $ref: '#/components/schemas/GrantColumnIds'
    ReplaceGrantRequest:
      description: The grant's new columns, replacing the old ones whole
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - all_columns
          properties:
            all_columns:
              type: boolean
              const: true
        - type: object
          additionalProperties: false
          required:
            - all_columns
            - column_ids
          properties:
            all_columns:
              type: boolean
              const: false
            column_ids:
              $ref: '#/components/schemas/GrantColumnIds'
    PrincipalLimit:
      type: object
      description: A user's or group's own concurrency limits, in place of the environment's defaults
      required:
        - id
        - principal_type
        - principal_id
        - principal_status
        - query_concurrency
        - export_concurrency
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        principal_id:
          type: string
          format: uuid
          description: The user's or group's tereo id
        principal_status:
          $ref: '#/components/schemas/PrincipalStatus'
        query_concurrency:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100
          description: Queries the principal may run at once; null when this row does not set it
        export_concurrency:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 10
          description: Exports the principal may run at once; null when this row does not set it
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListPrincipalLimitsResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PrincipalLimit'
        next_cursor:
          type:
            - string
            - 'null'
    CreatePrincipalLimitRequest:
      type: object
      description: At least one of the two limits
      additionalProperties: false
      required:
        - principal_type
        - principal_id
      anyOf:
        - required:
            - query_concurrency
        - required:
            - export_concurrency
      properties:
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        principal_id:
          type: string
          format: uuid
        query_concurrency:
          type: integer
          minimum: 1
          maximum: 100
        export_concurrency:
          type: integer
          minimum: 1
          maximum: 10
    UpdatePrincipalLimitRequest:
      type: object
      description: Either limit or both; `null` clears one. A change that would leave neither set is `400 invalid_request`.
      additionalProperties: false
      minProperties: 1
      properties:
        query_concurrency:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100
        export_concurrency:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 10
    DirectoryPrincipalStatus:
      type: string
      enum:
        - active
        - inactive
        - orphaned
      description: |
        `active` or `inactive` (a deactivated user, an archived group) as tereo has it, or `orphaned`
        when tereo has no such user or group.
    DirectoryPrincipal:
      type: object
      description: A user or group of tereo, by name. A group has no `email` key.
      required:
        - type
        - id
        - name
        - status
      properties:
        type:
          $ref: '#/components/schemas/PrincipalType'
        id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
          description: Null when the principal is orphaned
        email:
          type:
            - string
            - 'null'
          description: Users only; null when the user is orphaned. Absent on a group.
        status:
          $ref: '#/components/schemas/DirectoryPrincipalStatus'
    ListDirectoryPrincipalsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPrincipal'
    ListAllDirectoryPrincipalsResponse:
      type: object
      required:
        - data
        - truncated
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPrincipal'
        truncated:
          type: boolean
          description: True when tereo had more than 5000 users, or more than 5000 groups, and some are left out
    LookupPrincipalsRequest:
      type: object
      required:
        - principals
      additionalProperties: false
      properties:
        principals:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - type
              - id
            additionalProperties: false
            properties:
              type:
                $ref: '#/components/schemas/PrincipalType'
              id:
                type: string
                format: uuid
    Query:
      type: object
      additionalProperties: false
      required:
        - source
        - from
        - select
      description: A query in the SQL query language; see `docs/querying.md`
      properties:
        source:
          type: string
          minLength: 1
          description: The source's slug
        from:
          type: string
          description: A table or view, by its bare name when that is unique among the source's schemas, else `schema.table`
        join:
          type: array
          maxItems: 8
          description: Relations to join, by name, at most the source's `max_joins`; one reached through another is written `order_lines.products`
          items:
            oneOf:
              - $ref: '#/components/schemas/Path'
              - type: object
                additionalProperties: false
                required:
                  - relation
                properties:
                  relation:
                    $ref: '#/components/schemas/Path'
                  type:
                    type: string
                    enum:
                      - inner
                      - left
                    default: inner
        select:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SelectItem'
        distinct:
          type: boolean
        where:
          $ref: '#/components/schemas/Filter'
        groupBy:
          type: array
          maxItems: 50
          description: Select items, by output name or column path; a query with an aggregate groups by every other item
          items:
            type: string
        having:
          $ref: '#/components/schemas/Filter'
        orderBy:
          type: array
          maxItems: 50
          description: |
            Each entry one `{ "<name>": "asc" | "desc" }`, naming a select item or (in an ungrouped,
            non-distinct query) a column. Nulls sort last ascending and first descending. Without
            `orderBy` the rows are ordered by every select item ascending, so paging is stable.
          items:
            type: object
            minProperties: 1
            maxProperties: 1
            additionalProperties:
              type: string
              enum:
                - asc
                - desc
        limit:
          type: integer
          minimum: 1
          description: Rows wanted; default 1,000. A value above the maximum (50,000, or the source's row cap when lower) is lowered to it, not refused
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
    QueryResult:
      type: object
      required:
        - columns
        - rows
        - truncated
        - warnings
        - run_id
      properties:
        columns:
          type: array
          description: The result's columns, in the order of `select`
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
                description: The item's `as`, the column path, or a name made from the aggregate and column (`sum_total`, `count`)
              type:
                $ref: '#/components/schemas/ColumnType'
        rows:
          type: array
          description: |
            Each row an array of values in the order of `columns`, in their wire forms: 32-bit integers
            and floats as numbers (float `NaN` and infinities as strings); 64-bit integers and decimals
            as strings; `count` and `countDistinct` as strings, `sum` as a string over integers and
            decimals and a number over floats, `avg` as a number; dates `YYYY-MM-DD`; timestamps ISO 8601
            in UTC with milliseconds; json as JSON.
          items:
            type: array
            items: {}
        truncated:
          type: boolean
          description: Rows were left out
        truncated_by:
          type: string
          enum:
            - rows
            - bytes
          description: Present when `truncated`. `rows`, more rows existed than the limit; `bytes`, the next row would have passed the result size limit (10 MB; 1 MB through MCP)
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/QueryWarning'
        run_id:
          type: string
          format: uuid
          description: The run's id in the run log
    QueryError:
      type: object
      description: A query that is well formed but cannot be run as written
      required:
        - error
        - error_description
        - path
        - suggestions
      properties:
        error:
          type: string
          enum:
            - not_found_or_not_accessible
            - missing_in_source
            - column_not_queryable
            - invalid_operator
            - invalid_value
            - invalid_grouping
            - invalid_order
            - invalid_having
            - duplicate_output_name
            - join_parent_missing
            - too_many_joins
            - too_many_parameters
        error_description:
          type: string
        path:
          type: array
          description: Where in the query the problem is, keys and array indexes from the root
          items:
            oneOf:
              - type: string
              - type: integer
        suggestions:
          type: array
          maxItems: 3
          description: The closest names the caller can see, closest first
          items:
            type: string
        request_id:
          type: string
          description: The request's id, as in its `X-Request-ID` response header
    QueryWarning:
      type: object
      required:
        - code
        - message
        - path
      properties:
        code:
          type: string
          enum:
            - join_multiplies_rows
        message:
          type: string
        path:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
    RunOutcome:
      type: string
      enum:
        - ok
        - refused
        - failed
        - timeout
        - running
      description: |
        `refused` for a 4xx answer, `timeout` for `query_timeout`, `failed` for any other error, a
        client that went away (`client_closed`) included; `running` for an export that has started
        and not yet ended. An export whose process died is closed by the housekeeping job as
        `failed` with `interrupted`.
    Run:
      type: object
      description: One query or export, as it was recorded
      required:
        - id
        - user_id
        - source_id
        - entry_point
        - query
        - duration_ms
        - row_count
        - outcome
        - error_code
        - truncated
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        source_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Null when the query named no source the caller could see
        entry_point:
          type: string
          enum:
            - api
            - mcp
            - export
            - dashboard
          description: '`POST /v1/query` (and the saved query and saved panel runs), the MCP `query` tool, `POST /v1/export`, or a panel of `POST /v1/dashboards/{dashboardId}/run`'
        query:
          description: |
            The query as it was sent. In `GET /v1/me/runs`, `{ "withheld": true }` instead for a run of a
            saved query the caller cannot open (and for a refused saved query run).
        duration_ms:
          type: integer
        row_count:
          type:
            - integer
            - 'null'
          description: Rows returned; null unless the run succeeded. For an export that started, the rows sent to the client (null while `running`)
        outcome:
          $ref: '#/components/schemas/RunOutcome'
        error_code:
          type:
            - string
            - 'null'
          description: The error answered; `client_closed` when the client went away first; for an export, also `shutting_down` (stopped by the service shutting down) and `interrupted` (its process died)
        truncated:
          type: boolean
        created_at:
          type: string
          format: date-time
        saved_query:
          type: object
          description: The saved query the run was of; named only while the viewer owns it or it is shared with them (always in the admin list); absent otherwise
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    ListRunsResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_cursor:
          type:
            - string
            - 'null'
    DiscoveredColumn:
      type: object
      description: A column the caller may query
      required:
        - name
        - type
        - nullable
        - description
        - missing
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ColumnType'
        nullable:
          type: boolean
        description:
          type:
            - string
            - 'null'
        missing:
          type: boolean
          description: The last refresh did not find the column; a query that uses it fails with `missing_in_source`
    DiscoveredRelation:
      type: object
      description: A join the caller may use from the table it is listed under; every key column on both sides is granted
      required:
        - name
        - to
        - to_many
        - missing
      properties:
        name:
          type: string
          description: What a query's `join` names
        to:
          type: string
          description: The target table as a query writes it in `from`
        to_many:
          type: boolean
          description: One row can match several, so aggregates over the join may count a row more than once
        missing:
          type: boolean
    DiscoveredTable:
      type: object
      description: A table the caller may query
      required:
        - name
        - schema_name
        - kind
        - description
        - missing
        - last_synced_at
        - columns
        - relations
      properties:
        name:
          type: string
          description: 'As a query writes it in `from`: the bare name when no other table the caller can see in the source shares it, else `schema.table`'
        schema_name:
          type: string
        kind:
          type: string
          enum:
            - table
            - view
        description:
          type:
            - string
            - 'null'
        missing:
          type: boolean
          description: The last refresh did not find the table
        last_synced_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When an upload source''s table was last loaded: its data is as of then. Null for a database table'
        columns:
          type: array
          description: Only the granted columns, in the table's order
          items:
            $ref: '#/components/schemas/DiscoveredColumn'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredRelation'
    DiscoveredSource:
      type: object
      required:
        - slug
        - name
        - description
        - type
        - kind
        - language
        - limits
        - tables
      properties:
        slug:
          type: string
          description: What a query's `source` names
        name:
          type: string
        description:
          type: string
          description: What the source holds; empty when none was given
        type:
          $ref: '#/components/schemas/SourceType'
        kind:
          type: string
          enum:
            - database
            - upload
          description: '`upload` for an upload source, whose tables carry `last_synced_at`'
        language:
          type: object
          required:
            - id
            - schema
          properties:
            id:
              type: string
              enum:
                - sql
            schema:
              type: object
              description: The JSON Schema of the query language, which a query's body must satisfy
              additionalProperties: true
        limits:
          type: object
          description: What one query on this source may return and take
          required:
            - default_rows
            - max_rows
            - timeout_ms
            - max_joins
            - export
          properties:
            default_rows:
              type: integer
              description: Rows when the query sets no `limit`
            max_rows:
              type: integer
              description: The most a `limit` may ask for
            timeout_ms:
              type: integer
            max_joins:
              type: integer
              description: The most joins a query on this source may use
            export:
              type: object
              description: What `POST /v1/export` may take from this source; it also needs `zeteo.data.export`
              required:
                - enabled
                - max_rows
              properties:
                enabled:
                  type: boolean
                  description: The source's exports are on and its export cap is above 0
                max_rows:
                  type: integer
                  description: The source's `export_row_cap`; 0 when exports are off
        tables:
          type: array
          description: Ordered by schema, then name
          items:
            $ref: '#/components/schemas/DiscoveredTable'
    CatalogResponse:
      type: object
      required:
        - sources
      properties:
        sources:
          type: array
          description: Ordered by slug
          items:
            $ref: '#/components/schemas/DiscoveredSource'
    UploadColumnType:
      type: string
      enum:
        - text
        - number
        - boolean
        - date
        - timestamp
      description: An upload source column's type. `number` is numeric, `timestamp` is `timestamptz`. All columns are nullable.
    UploadColumnName:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,62}$
      description: Lowercase letters, digits and `_`, starting with a letter; at most 63 bytes
    StagedColumn:
      type: object
      required:
        - index
        - name
        - original_name
        - type
        - samples
      properties:
        index:
          type: integer
          minimum: 0
          description: The column's 0-based position in the file
        name:
          type: string
          description: 'The name it would get: duplicates are suffixed `_2`, `_3`, blank headers are `column_<n>`'
        original_name:
          type: string
          description: The header as written in the file
        type:
          $ref: '#/components/schemas/UploadColumnType'
        samples:
          type: array
          description: Up to 10 values seen in the column, as text
          items:
            type: string
    StagedTable:
      type: object
      description: One table found in an upload
      required:
        - key
        - name
        - kind
        - header_row
        - row_count
        - columns
        - warnings
      properties:
        key:
          type: string
          description: 'Names the table within the staging: `csv`, `sheet:<name>` or `table:<name>`'
        name:
          type: string
        kind:
          type: string
          enum:
            - csv
            - sheet
            - table
        header_row:
          type:
            - integer
            - 'null'
          description: The 0-based header row; null when the first row looks like data
        row_count:
          type: integer
          minimum: 0
          description: Data rows, the header not counted
        columns:
          type: array
          items:
            $ref: '#/components/schemas/StagedColumn'
        warnings:
          type: array
          items:
            type: string
    UploadResponse:
      type: object
      required:
        - staging_id
        - expires_at
        - tables
      properties:
        staging_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          description: One hour after the upload
        tables:
          type: array
          items:
            $ref: '#/components/schemas/StagedTable'
    ColumnCorrection:
      type: object
      additionalProperties: false
      required:
        - index
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 1600
        name:
          $ref: '#/components/schemas/UploadColumnName'
        type:
          $ref: '#/components/schemas/UploadColumnType'
    TableCorrection:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 1024
          description: A staged table's `key`
        name:
          allOf:
            - $ref: '#/components/schemas/UploadColumnName'
          description: The table's name; it cannot contain `__load_`
        header_row:
          type:
            - integer
            - 'null'
          minimum: 0
        columns:
          type: array
          maxItems: 1600
          items:
            $ref: '#/components/schemas/ColumnCorrection'
    CreateUploadSourceRequest:
      type: object
      description: An upload source, made from the caller's staging
      additionalProperties: false
      required:
        - type
        - staging_id
        - name
        - tables
      properties:
        type:
          type: string
          const: upload
        staging_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 500
          description: What the source holds, for the people and the AI that query it; trimmed
        slug:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
          description: Generated from the name when omitted
        tables:
          type: array
          minItems: 1
          maxItems: 100
          description: The staged tables to load, with any corrections
          items:
            $ref: '#/components/schemas/TableCorrection'
    AddTablesRequest:
      type: object
      additionalProperties: false
      required:
        - staging_id
        - tables
      properties:
        staging_id:
          type: string
          format: uuid
        tables:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TableCorrection'
    ReuploadTableRequest:
      type: object
      additionalProperties: false
      required:
        - staging_id
        - key
      properties:
        staging_id:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
          maxLength: 1024
        header_row:
          type:
            - integer
            - 'null'
          minimum: 0
        columns:
          type: array
          maxItems: 1600
          items:
            $ref: '#/components/schemas/ColumnCorrection'
    UpdateUploadColumnRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          $ref: '#/components/schemas/UploadColumnType'
        name:
          $ref: '#/components/schemas/UploadColumnName'
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
    TransferSourceRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The new owner, a tereo user who is not a service account
        keep_access:
          type: boolean
          default: true
          description: The previous owner keeps an ordinary all-columns grant; false drops it
    SavedQuery:
      type: object
      description: |
        A saved query as the viewer sees it. `source` and `query` are left out (never null) unless the
        viewer may run it (`accessible`); a viewer who holds `zeteo.sources.read` sees `source`
        regardless, and never `query` without access. A viewer without access never sees anything the
        planner said about why.
      required:
        - id
        - name
        - description
        - owner
        - accessible
        - created_at
        - updated_at
        - last_run_at
        - you_last_ran_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        owner:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - 'null'
              description: From tereo's directory; null when it could not be looked up
        accessible:
          type: boolean
          description: Whether the viewer may run it now, planned against what the viewer is granted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        shared_at:
          type: string
          format: date-time
          description: When it was shared with the viewer (or one of their groups); present only when it was
        available_for_dashboards:
          type: boolean
          description: Whether its owner offers it to dashboards, to everyone in the organization they are signed in to
        last_run_at:
          type:
            - string
            - 'null'
          format: date-time
          description: The last run by anyone
        you_last_ran_at:
          type:
            - string
            - 'null'
          format: date-time
          description: The viewer's own last run
        source:
          type: object
          description: Present when the viewer may run it, or holds `zeteo.sources.read`
          required:
            - id
            - slug
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
        query:
          description: The stored query (see `Query`); present only when `accessible`
          $ref: '#/components/schemas/Query'
        share_count:
          type: integer
          minimum: 0
          description: How many users and groups it is shared with; present only when the viewer may see the share list (its owner, or a holder of `zeteo.saved_queries.read`)
        used_by:
          type: object
          description: What is built on it; present only on a single read (`GET /v1/saved-queries/{savedQueryId}`), and only for its owner and a holder of `zeteo.saved_queries.read`
          required:
            - dashboards
            - saved_panels
          properties:
            dashboards:
              type: integer
              minimum: 0
              description: How many dashboards have a panel on it
            saved_panels:
              type: integer
              minimum: 0
              description: How many saved panels are on it
    ListSavedQueriesResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SavedQuery'
        next_cursor:
          type:
            - string
            - 'null'
    CreateSavedQueryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - query
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; unique per owner, whatever the case
        description:
          type: string
          maxLength: 2000
          default: ''
        query:
          description: A query as `POST /v1/query` takes it. It is planned against the caller's own grants when saved.
          $ref: '#/components/schemas/Query'
    UpdateSavedQueryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; unique per owner, whatever the case
        description:
          type: string
          maxLength: 2000
        query:
          description: Replaces the stored query; planned again against the caller's own grants
          $ref: '#/components/schemas/Query'
        available_for_dashboards:
          type: boolean
          description: Offers it to dashboards (true) or withdraws it (false). A panel built on a saved query withdrawn from dashboards shows `not_available` to others.
    CopySavedQueryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The copy's name; unique among the caller's saved queries, whatever the case
    SavedQueryPaging:
      type: object
      additionalProperties: false
      description: The paging a run or export may give in place of the stored `limit` and `offset`. No body runs the saved query as stored.
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
    SharePrincipal:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/PrincipalType'
        id:
          type: string
          format: uuid
    Share:
      type: object
      description: A user or group a saved query is shared with. A group has no `email` key.
      required:
        - type
        - id
        - name
        - shared_at
      properties:
        type:
          $ref: '#/components/schemas/PrincipalType'
        id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
          description: From tereo's directory; null when it could not be looked up
        email:
          type:
            - string
            - 'null'
          description: Users only
        shared_at:
          type: string
          format: date-time
    ListSharesResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Share'
    ReplaceSharesRequest:
      type: object
      additionalProperties: false
      required:
        - principals
      properties:
        principals:
          type: array
          maxItems: 100
          description: The whole share list; each principal once, the owner not among them
          items:
            $ref: '#/components/schemas/SharePrincipal'
    ShareWarning:
      type: object
      required:
        - type
        - id
        - accessible
      properties:
        type:
          type: string
          const: user
        id:
          type: string
          format: uuid
        accessible:
          type: boolean
          const: false
          description: The user could not run the saved query as things stand
    ReplaceSharesResponse:
      type: object
      required:
        - data
        - warnings
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Share'
        warnings:
          type: array
          description: Each user newly added who could not run the saved query, judged as if signed in to the caller's organization. Groups never appear.
          items:
            $ref: '#/components/schemas/ShareWarning'
    TransferSavedQueryRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The new owner; a service account is refused (`invalid_transfer`)
        keep_access:
          type: boolean
          default: true
          description: The previous owner keeps a direct share
    TransferSavedQueryResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SavedQuery'
        warning:
          type: object
          description: Present when the new owner could not run the saved query, judged as if signed in to the caller's organization
          required:
            - accessible
          properties:
            accessible:
              type: boolean
              const: false
    InvalidPanelError:
      description: The body of `400 invalid_panel`
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            problems:
              type: array
              description: Each setting at fault; absent when the message says all there is to say (a linked panel's own settings, a panel not linked)
              items:
                type: object
                required:
                  - setting
                  - problem
                properties:
                  setting:
                    type: string
                    description: 'The setting at fault: a chart key with the index for a list (`y.1`), or `saved_query`, `saved_panel`'
                  problem:
                    type: string
                    description: '`missing_column`, `wrong_type`, `needs_order`, or for a saved query or panel that cannot be used, its state such as `not_available`'
    TimeRangeKey:
      type: string
      description: |
        A named time range. The `last_*` ranges run from that long before now to the start of the next
        minute; `today`, `this_*` and `previous_*` are the calendar day, week (starting Monday), month,
        quarter or year, in UTC. Applied to a panel's `time_column` as `>= start` and `< end`.
      enum:
        - last_15_minutes
        - last_hour
        - last_6_hours
        - last_24_hours
        - last_7_days
        - last_30_days
        - last_90_days
        - last_6_months
        - last_year
        - last_2_years
        - today
        - this_week
        - this_month
        - this_quarter
        - this_year
        - previous_week
        - previous_month
        - previous_quarter
        - previous_year
    DashboardTheme:
      type: string
      enum:
        - light
        - dark
        - auto
    PanelKind:
      type: string
      description: '`own` carries its own saved query, chart and time column; `linked` points to a saved panel that holds them'
      enum:
        - own
        - linked
    PanelState:
      type: string
      description: |
        What the viewer can do with a panel. `ok`: it can be run. `not_accessible`: the viewer is not
        granted what the saved query reads (one answer for every cause, nothing of why).
        `saved_query_deleted`, `saved_panel_deleted`: what it was built on is gone. `not_available`: its
        saved query is no longer available for dashboards (or its saved panel is no longer shared with
        the dashboard's owner). `needs_update`: the chart no longer fits the saved query's result; the
        panel's owner must change it.
      enum:
        - ok
        - not_accessible
        - saved_query_deleted
        - saved_panel_deleted
        - not_available
        - needs_update
    ChartProblem:
      type: object
      description: One setting of a chart that does not fit the saved query's result
      required:
        - setting
        - problem
      properties:
        setting:
          type: string
          description: 'The setting at fault: its key, with the index for a list (`y.1`)'
        problem:
          type: string
          description: 'For a chart: `missing_column`, `wrong_type` or `needs_order`; for a saved query or panel that cannot be used, its state'
    StatChart:
      type: object
      additionalProperties: false
      required:
        - type
        - version
        - value
      properties:
        type:
          type: string
          const: stat
        version:
          type: integer
          const: 1
        value:
          $ref: '#/components/schemas/ChartColumn'
          description: A number column
        compare:
          type: string
          const: next_row
          description: Compare with the next row; the saved query then needs an `orderBy`
        unit:
          type: string
          maxLength: 20
        decimals:
          $ref: '#/components/schemas/ChartDecimals'
        legend:
          $ref: '#/components/schemas/ChartLegend'
    LineChart:
      type: object
      additionalProperties: false
      required:
        - type
        - version
        - x
        - 'y'
      properties:
        type:
          type: string
          const: line
        version:
          type: integer
          const: 1
        x:
          $ref: '#/components/schemas/ChartColumn'
          description: A date
          timestamp or number column: null
        'y':
          type: array
          minItems: 1
          maxItems: 10
          description: Number columns
          items:
            $ref: '#/components/schemas/ChartColumn'
        series:
          $ref: '#/components/schemas/ChartColumn'
          description: A text column
        decimals:
          $ref: '#/components/schemas/ChartDecimals'
        legend:
          $ref: '#/components/schemas/ChartLegend'
    AreaChart:
      type: object
      additionalProperties: false
      required:
        - type
        - version
        - x
        - 'y'
      properties:
        type:
          type: string
          const: area
        version:
          type: integer
          const: 1
        x:
          $ref: '#/components/schemas/ChartColumn'
          description: A date
          timestamp or number column: null
        'y':
          type: array
          minItems: 1
          maxItems: 10
          description: Number columns
          items:
            $ref: '#/components/schemas/ChartColumn'
        series:
          $ref: '#/components/schemas/ChartColumn'
          description: A text column
        stacked:
          type: boolean
        decimals:
          $ref: '#/components/schemas/ChartDecimals'
        legend:
          $ref: '#/components/schemas/ChartLegend'
    BarChart:
      type: object
      additionalProperties: false
      required:
        - type
        - version
        - x
        - 'y'
      properties:
        type:
          type: string
          const: bar
        version:
          type: integer
          const: 1
        x:
          $ref: '#/components/schemas/ChartColumn'
        'y':
          type: array
          minItems: 1
          maxItems: 10
          description: Number columns
          items:
            $ref: '#/components/schemas/ChartColumn'
        series:
          $ref: '#/components/schemas/ChartColumn'
          description: A text column
        stacked:
          type: boolean
        horizontal:
          type: boolean
        decimals:
          $ref: '#/components/schemas/ChartDecimals'
        legend:
          $ref: '#/components/schemas/ChartLegend'
    PieChart:
      type: object
      additionalProperties: false
      required:
        - type
        - version
        - label
        - value
      properties:
        type:
          type: string
          const: pie
        version:
          type: integer
          const: 1
        label:
          $ref: '#/components/schemas/ChartColumn'
          description: A text column
        value:
          $ref: '#/components/schemas/ChartColumn'
          description: A number column
        donut:
          type: boolean
        decimals:
          $ref: '#/components/schemas/ChartDecimals'
        legend:
          $ref: '#/components/schemas/ChartLegend'
    TableChart:
      type: object
      additionalProperties: false
      required:
        - type
        - version
      properties:
        type:
          type: string
          const: table
        version:
          type: integer
          const: 1
        columns:
          type: array
          minItems: 1
          maxItems: 50
          description: The columns shown, in order; all of them when left out
          items:
            $ref: '#/components/schemas/ChartColumn'
        decimals:
          $ref: '#/components/schemas/ChartDecimals'
        legend:
          $ref: '#/components/schemas/ChartLegend'
    ChartSettings:
      description: |
        A panel's chart, in Zeteo's own format (version 1). Every field that names a column names a
        result column of the saved query: a select item's `as`, else its path. Whether the columns exist
        and have the right types is checked when the chart is saved (`400 invalid_panel`, with
        `problems`), and again when it is shown (a chart that no longer fits is `needs_update`).
      oneOf:
        - $ref: '#/components/schemas/StatChart'
        - $ref: '#/components/schemas/LineChart'
        - $ref: '#/components/schemas/AreaChart'
        - $ref: '#/components/schemas/BarChart'
        - $ref: '#/components/schemas/PieChart'
        - $ref: '#/components/schemas/TableChart'
      discriminator:
        propertyName: type
        mapping:
          stat: '#/components/schemas/StatChart'
          line: '#/components/schemas/LineChart'
          area: '#/components/schemas/AreaChart'
          bar: '#/components/schemas/BarChart'
          pie: '#/components/schemas/PieChart'
          table: '#/components/schemas/TableChart'
    Panel:
      type: object
      description: |
        A panel as the viewer sees it. What it shows and what it is built on (`chart`, `time_column`,
        `saved_query_id`, `saved_panel_id`) are present only when `state` is `ok`, and left out (never
        null) otherwise. Of a saved query or saved panel it cannot run, a viewer is never told more than
        the state and `message`.
      required:
        - id
        - kind
        - x
        - 'y'
        - w
        - h
        - title
        - state
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PanelKind'
        x:
          type: integer
          minimum: 0
          maximum: 11
          description: Column on the grid of 12
        'y':
          type: integer
          minimum: 0
          description: Row
        w:
          type: integer
          minimum: 1
          maximum: 12
          description: Width in columns
        h:
          type: integer
          minimum: 1
          maximum: 24
          description: Height in rows
        title:
          type:
            - string
            - 'null'
          description: The panel's own title, else its saved panel's or saved query's name (not that of someone else's for a `not_available` panel, which is `Untitled panel`); null when none is left
        state:
          $ref: '#/components/schemas/PanelState'
        message:
          type: string
          description: What a viewer is told when the state is not `ok`
        chart:
          $ref: '#/components/schemas/ChartSettings'
        time_column:
          $ref: '#/components/schemas/PanelTimeColumn'
        saved_query_id:
          type: string
          format: uuid
        saved_panel_id:
          type: string
          format: uuid
          description: A linked panel's saved panel
        problems:
          type: array
          description: What no longer fits, for `needs_update` and only for the panel's editor
          items:
            $ref: '#/components/schemas/ChartProblem'
    DashboardSummary:
      type: object
      description: A dashboard as a list shows it, without its panels
      required:
        - id
        - name
        - description
        - owner
        - time_range
        - refresh_seconds
        - theme
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        owner:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - 'null'
              description: From tereo's directory; null when it could not be looked up
        time_range:
          description: The dashboard's default time range; null for none
          oneOf:
            - $ref: '#/components/schemas/TimeRangeKey'
            - type: 'null'
        refresh_seconds:
          type:
            - integer
            - 'null'
          description: Auto-refresh in seconds; null for none
        theme:
          $ref: '#/components/schemas/DashboardTheme'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        shared_at:
          type: string
          format: date-time
          description: When it was first shared with the viewer (or one of their groups); present only when it was
        share_count:
          type: integer
          minimum: 0
          description: How many users and groups it is shared with; present only when the viewer may see the share list (its owner, or a holder of `zeteo.dashboards.read`)
        url:
          type: string
          description: Where the admin UI shows it; present only when the admin UI is served (`UI_CLIENT_ID` and `PUBLIC_URL` are set)
    Dashboard:
      description: A dashboard with its panels, each decided for the viewer
      allOf:
        - $ref: '#/components/schemas/DashboardSummary'
        - type: object
          required:
            - panels
          properties:
            panels:
              type: array
              items:
                $ref: '#/components/schemas/Panel'
    ListDashboardsResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSummary'
        next_cursor:
          type:
            - string
            - 'null'
    OwnPanelInput:
      type: object
      additionalProperties: false
      description: A new panel with its own saved query, chart and time column. Without a place it goes in the first free one, in the chart type's default size.
      required:
        - kind
        - saved_query_id
        - chart
      properties:
        kind:
          type: string
          const: own
        saved_query_id:
          type: string
          format: uuid
        chart:
          $ref: '#/components/schemas/ChartSettings'
        time_column:
          $ref: '#/components/schemas/PanelTimeColumn'
        title:
          $ref: '#/components/schemas/PanelTitle'
        x:
          $ref: '#/components/schemas/PlaceX'
        'y':
          $ref: '#/components/schemas/PlaceY'
        w:
          $ref: '#/components/schemas/PlaceW'
        h:
          $ref: '#/components/schemas/PlaceH'
    LinkedPanelInput:
      type: object
      additionalProperties: false
      description: A new panel linked to a saved panel
      required:
        - kind
        - saved_panel_id
      properties:
        kind:
          type: string
          const: linked
        saved_panel_id:
          type: string
          format: uuid
        title:
          $ref: '#/components/schemas/PanelTitle'
        x:
          $ref: '#/components/schemas/PlaceX'
        'y':
          $ref: '#/components/schemas/PlaceY'
        w:
          $ref: '#/components/schemas/PlaceW'
        h:
          $ref: '#/components/schemas/PlaceH'
    PanelInput:
      description: A new panel, own or linked
      oneOf:
        - $ref: '#/components/schemas/OwnPanelInput'
        - $ref: '#/components/schemas/LinkedPanelInput'
      discriminator:
        propertyName: kind
        mapping:
          own: '#/components/schemas/OwnPanelInput'
          linked: '#/components/schemas/LinkedPanelInput'
    ExistingPanelInput:
      type: object
      additionalProperties: false
      description: |
        An entry of a replacement list that keeps a panel by its `id`, with its place and optionally a
        new title, saved query, chart or time column (a linked panel has none of the last three of its
        own: `400 invalid_panel`).
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: A panel of this dashboard
        title:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 100
          description: Null removes the panel's own title
        saved_query_id:
          type: string
          format: uuid
        chart:
          $ref: '#/components/schemas/ChartSettings'
        time_column:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 200
          description: Null removes the time column
        x:
          $ref: '#/components/schemas/PlaceX'
        'y':
          $ref: '#/components/schemas/PlaceY'
        w:
          $ref: '#/components/schemas/PlaceW'
        h:
          $ref: '#/components/schemas/PlaceH'
    ReplacementPanel:
      description: A panel of `PATCH`'s list by its `id`, or a new one
      oneOf:
        - $ref: '#/components/schemas/ExistingPanelInput'
        - $ref: '#/components/schemas/OwnPanelInput'
        - $ref: '#/components/schemas/LinkedPanelInput'
    CreateDashboardRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; unique per owner, whatever the case
        description:
          type: string
          maxLength: 2000
          default: ''
        time_range:
          description: The default time range; null or left out for none
          oneOf:
            - $ref: '#/components/schemas/TimeRangeKey'
            - type: 'null'
        refresh_seconds:
          type:
            - integer
            - 'null'
          minimum: 10
          maximum: 86400
          description: Auto-refresh in seconds, at least the deploy's `DASHBOARD_MIN_REFRESH_SECONDS` (default 60); null or left out for none
        theme:
          $ref: '#/components/schemas/DashboardTheme'
        panels:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PanelInput'
    UpdateDashboardRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; unique per owner, whatever the case
        description:
          type: string
          maxLength: 2000
        time_range:
          oneOf:
            - $ref: '#/components/schemas/TimeRangeKey'
            - type: 'null'
        refresh_seconds:
          type:
            - integer
            - 'null'
          minimum: 10
          maximum: 86400
          description: At least the deploy's `DASHBOARD_MIN_REFRESH_SECONDS`; null for none
        theme:
          $ref: '#/components/schemas/DashboardTheme'
        panels:
          type: array
          maxItems: 50
          description: |
            The whole panel list: a panel named by `id` is kept (and changed as given), a panel without
            one is added, and a panel of the dashboard not listed is removed. An `id` not on this
            dashboard, or named twice, is `400 invalid_panel`.
          items:
            $ref: '#/components/schemas/ReplacementPanel'
    UpdatePanelRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field. `saved_query_id`, `chart` and `time_column` are for an own panel only (`400 invalid_panel` for a linked one).
      properties:
        title:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 100
          description: Null removes the panel's own title
        saved_query_id:
          type: string
          format: uuid
        chart:
          $ref: '#/components/schemas/ChartSettings'
        time_column:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 200
          description: Null removes the time column
        x:
          $ref: '#/components/schemas/PlaceX'
        'y':
          $ref: '#/components/schemas/PlaceY'
        w:
          $ref: '#/components/schemas/PlaceW'
        h:
          $ref: '#/components/schemas/PlaceH'
    CopyDashboardRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The copy's name; unique among the caller's dashboards, whatever the case
    TransferOwnerRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The new owner; a service account is refused (`invalid_transfer`)
        keep_access:
          type: boolean
          default: true
          description: The previous owner keeps a direct share
    RunDashboardRequest:
      type: object
      additionalProperties: false
      properties:
        panels:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Run only these panels; the dashboard's others are left out, and an id not on it is ignored
          items:
            type: string
            format: uuid
        time_range:
          description: The range for this run; null for none; left out for the dashboard's own
          oneOf:
            - $ref: '#/components/schemas/TimeRangeKey'
            - type: 'null'
    PanelLine:
      type: object
      description: |
        One panel's line of a dashboard's run. Never its chart or its query. A line has `result` only
        for an `ok` panel that ran, and `error` for an `ok` panel whose run failed.
      required:
        - panel_id
        - state
      properties:
        panel_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/PanelState'
        message:
          type: string
          description: What a viewer is told when the state is not `ok`
        result:
          type: object
          required:
            - columns
            - rows
            - truncated
          properties:
            columns:
              type: array
              items:
                type: object
                required:
                  - name
                  - type
                properties:
                  name:
                    type: string
                  type:
                    $ref: '#/components/schemas/ColumnType'
            rows:
              type: array
              description: Each row an array of values in the order of `columns`, in the wire forms of `POST /v1/query`
              items:
                type: array
                items: {}
            truncated:
              type: boolean
            truncated_by:
              type: string
              enum:
                - rows
                - bytes
              description: Present when `truncated`
            notice:
              type: string
              description: 'Present when rows were left out for the row cap: what the viewer is told'
        cached_at:
          type: string
          format: date-time
          description: Present when the result came from the cache; when it was read from the source
        error:
          type: object
          description: A failure of the panel's run, as an error body of `POST /v1/query` carries it
          required:
            - error
            - error_description
          properties:
            error:
              type: string
            error_description:
              type: string
    DoneLine:
      type: object
      description: The last line of a dashboard's run; a stream without it did not end
      required:
        - done
      properties:
        done:
          type: boolean
          const: true
    SavedPanel:
      type: object
      description: |
        A saved panel as the viewer sees it: a chart on a saved query that dashboards can link. `chart`,
        `time_column` and `saved_query_id` are present only when `state` is `ok` (never null). Neither the
        saved query's name nor anything of why a viewer cannot run it is carried.
      required:
        - id
        - name
        - description
        - owner
        - state
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        owner:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - 'null'
              description: From tereo's directory; null when it could not be looked up
        state:
          $ref: '#/components/schemas/PanelState'
        message:
          type: string
        chart:
          $ref: '#/components/schemas/ChartSettings'
        time_column:
          $ref: '#/components/schemas/PanelTimeColumn'
        saved_query_id:
          type: string
          format: uuid
        problems:
          type: array
          items:
            $ref: '#/components/schemas/ChartProblem'
        used_by:
          type: object
          description: Present only for its owner and a holder of `zeteo.dashboards.read`
          required:
            - dashboards
          properties:
            dashboards:
              type: integer
              minimum: 0
              description: How many dashboards link it
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        shared_at:
          type: string
          format: date-time
          description: When it was first shared with the viewer; present only when it was
        share_count:
          type: integer
          minimum: 0
          description: Present only when the viewer may see the share list
    ListSavedPanelsResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SavedPanel'
        next_cursor:
          type:
            - string
            - 'null'
    CreateSavedPanelRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - saved_query_id
        - chart
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; unique per owner, whatever the case
        description:
          type: string
          maxLength: 2000
          default: ''
        saved_query_id:
          type: string
          format: uuid
        chart:
          $ref: '#/components/schemas/ChartSettings'
        time_column:
          $ref: '#/components/schemas/PanelTimeColumn'
    UpdateSavedPanelRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        saved_query_id:
          type: string
          format: uuid
        chart:
          $ref: '#/components/schemas/ChartSettings'
        time_column:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 200
          description: Null removes the time column
    CopySavedPanelRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The copy's name; unique among the caller's saved panels, whatever the case
    SaveAsSavedPanelRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique among the caller's saved panels, whatever the case
        description:
          type: string
          maxLength: 2000
    PreviewSavedPanelRequest:
      type: object
      additionalProperties: false
      properties:
        time_range:
          $ref: '#/components/schemas/TimeRangeKey'
    SavedQueryUse:
      type: object
      description: A dashboard or saved panel built on a saved query
      required:
        - type
        - id
        - name
        - owner
      properties:
        type:
          type: string
          enum:
            - dashboard
            - saved_panel
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - 'null'
              description: From tereo's directory; null when it could not be looked up
    ListSavedQueryUsesResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: Dashboards, then saved panels, each newest first
          items:
            $ref: '#/components/schemas/SavedQueryUse'
    RelativeDate:
      type: object
      additionalProperties: false
      required:
        - relative
      description: |
        A moment relative to now, as a comparison value of a date or timestamp column:
        `{ "relative": { "unit": "day", "offset": -30 } }` is 30 days before now, and with `startOf`
        `{ "relative": { "unit": "month", "offset": 0, "startOf": true } }` is the start of this month.
        Resolved in UTC against the minute the run starts, as the same moment for the whole run (a
        dashboard's panels share one). A week starts on Monday. Never stored as a date: a saved query
        keeps it relative.
      properties:
        relative:
          type: object
          additionalProperties: false
          required:
            - unit
            - offset
          properties:
            unit:
              type: string
              enum:
                - minute
                - hour
                - day
                - week
                - month
                - quarter
                - year
            offset:
              type: integer
              minimum: -1000
              maximum: 1000
              description: Whole units from now; negative is the past
            startOf:
              type: boolean
              description: Cut back to the start of the unit after the offset is applied
    RenameRelationRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
    GrantColumnIds:
      type: array
      minItems: 1
      maxItems: 500
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: Columns of the grant's table
    Path:
      type: string
      description: |
        `(relation.)*column`: a bare column of the `from` table, or a column of a joined table through
        its relation path (`customers.region`, `order_lines.products.category`). Segments are 1-128 characters.
    Alias:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,62}$
      description: An output name for a select item
    CalcExpr:
      description: |
        An expression: a column path, a number, a text literal `{ value }`, an aggregate, or an object
        with exactly one operation key. It nests at most 8 levels (an aggregate counts as one) and a
        query holds at most 100 operations and aggregates. Operands are numbers for `add`, `sub`,
        `mul`, `div`, `abs` and `round`; text or numbers for `concat`; text for `lower` and `upper`;
        one shared type for `coalesce`. `div` by zero gives null and keeps at least 6 decimal places;
        `round` gives exactly the places asked, half away from zero. Aggregates do not nest.
      oneOf:
        - $ref: '#/components/schemas/Path'
        - type: number
        - type: object
          additionalProperties: false
          required:
            - value
          properties:
            value:
              type: string
              maxLength: 1000
              description: A text literal; a bare string is a path
        - $ref: '#/components/schemas/CalcOperation'
    CalcOperation:
      type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      description: Exactly one of these keys
      properties:
        add:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        mul:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        sub:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CalcExpr'
        div:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CalcExpr'
        abs:
          $ref: '#/components/schemas/CalcExpr'
        round:
          description: An expression (0 places), or `[expression, places]` with places an integer 0 to 10
          oneOf:
            - $ref: '#/components/schemas/CalcExpr'
            - type: array
              minItems: 2
              maxItems: 2
              prefixItems:
                - $ref: '#/components/schemas/CalcExpr'
                - type: integer
                  minimum: 0
                  maximum: 10
        concat:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        lower:
          $ref: '#/components/schemas/CalcExpr'
        upper:
          $ref: '#/components/schemas/CalcExpr'
        coalesce:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        sum:
          $ref: '#/components/schemas/CalcExpr'
        avg:
          $ref: '#/components/schemas/CalcExpr'
        min:
          $ref: '#/components/schemas/CalcExpr'
        max:
          $ref: '#/components/schemas/CalcExpr'
        count:
          type: string
          description: A path, or `"*"`
        countDistinct:
          $ref: '#/components/schemas/Path'
    SelectItem:
      description: |
        A column path, an aggregate or date bucket with an optional `as`, or a calculation `{ calc, as }`.
        `sum`, `avg`, `min` and `max` over an expression, and `calc`, need `as`.
      oneOf:
        - $ref: '#/components/schemas/Path'
        - type: object
          additionalProperties: false
          required:
            - count
          properties:
            count:
              type: string
              description: A path, or `"*"` to count rows
            as:
              $ref: '#/components/schemas/Alias'
        - type: object
          additionalProperties: false
          required:
            - countDistinct
          properties:
            countDistinct:
              $ref: '#/components/schemas/Path'
            as:
              $ref: '#/components/schemas/Alias'
        - type: object
          additionalProperties: false
          required:
            - sum
          properties:
            sum:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - avg
          properties:
            avg:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - min
          properties:
            min:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - max
          properties:
            max:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - bucket
            - column
          properties:
            bucket:
              type: string
              enum:
                - day
                - week
                - month
                - quarter
                - year
              description: Truncated in UTC; weeks start on Monday
            column:
              $ref: '#/components/schemas/Path'
            as:
              $ref: '#/components/schemas/Alias'
        - type: object
          additionalProperties: false
          required:
            - calc
            - as
          properties:
            calc:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: |
            A calculation. Row-level when it holds no aggregate (computed per row, nameable in `where`
            and `groupBy`); group-level when every column sits inside an aggregate (nameable in `having`
            and `orderBy`). A mix of the two is refused (`invalid_grouping`).
    Filter:
      type: object
      description: |
        One of `{ "and": [filter, ...] }`, `{ "or": [filter, ...] }`, `{ "not": filter }`, or
        `{ "<path>": { "<operator>": value }, ... }`, where several paths must all hold. Operators:
        `eq`, `ne`, `gt`, `gte`, `lt`, `lte` and `between` (two values, inclusive), each of which also
        takes a `RelativeDate` in place of a value (`{ "created_at": { "gte": { "relative": { "unit": "day",
        "offset": -30 } } } }`), `in` and `notIn` (1-1,000 values), `contains` and `startsWith` (text, case-insensitive, `%` and `_` literal),
        `isNull` (true or false). Filters nest at most 5 deep. `and`, `or` and `not` are reserved:
        a column with one of those names cannot be filtered on directly. In `having`, the keys are
        the names of aggregate select items.
      additionalProperties: true
    ChartColumn:
      type: string
      minLength: 1
      maxLength: 200
      description: A result column of the saved query, by its `as` or its path
    ChartDecimals:
      type: integer
      minimum: 0
      maximum: 6
      description: Decimal places shown
    ChartLegend:
      type: string
      enum:
        - auto
        - none
    PanelTimeColumn:
      type: string
      minLength: 1
      maxLength: 200
      description: A date or timestamp column of the saved query that the dashboard's time range filters
    PanelTitle:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed
    PlaceX:
      type: integer
      minimum: 0
      maximum: 11
      description: Column on the grid of 12; goes with `y`, and `x + w` is at most 12
    PlaceY:
      type: integer
      minimum: 0
      maximum: 1000
      description: Row; goes with `x`
    PlaceW:
      type: integer
      minimum: 1
      maximum: 12
      description: Width in columns
    PlaceH:
      type: integer
      minimum: 1
      maximum: 24
      description: Height in rows
x-tagGroups:
  - name: Sources
    tags:
      - Sources
      - Uploads
      - Catalogue
  - name: Access
    tags:
      - Grants
  - name: Querying
    tags:
      - Queries
      - Saved queries
      - Dashboards
  - name: Platform
    tags:
      - Platform
