          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDirectoryPrincipalsResponse'
        '400':
