          required: false
          schema:
            type: string
            enum:
              - mine
              - shared
              - all
            default: mine
        - name: q
          in: query
          required: false
          description: Text to find, 1 to 100 characters
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: owner_id
          in: query
          required: false
          description: '`scope=all` only'
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
