        time_range:
          $ref: '#/components/schemas/TimeRangeKey'
    SavedQueryUse:
      type: object
      description: A dashboard or saved panel built on a saved query
      required:
        - type
        - id
        - name
        - owner
      properties:
        type:
          type: string
          enum:
            - dashboard
            - saved_panel
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - 'null'
              description: From tereo's directory; null when it could not be looked up
    ListSavedQueryUsesResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: Dashboards, then saved panels, each newest first
          items:
            $ref: '#/components/schemas/SavedQueryUse'
    RelativeDate:
      type: object
      additionalProperties: false
      required:
        - relative
      description: |
        A moment relative to now, as a comparison value of a date or timestamp column:
        `{ "relative": { "unit": "day", "offset": -30 } }` is 30 days before now, and with `startOf`
        `{ "relative": { "unit": "month", "offset": 0, "startOf": true } }` is the start of this month.
        Resolved against the minute the run starts, as the same moment for the whole run (a
        dashboard's panels share one), in the calendar's time zone (`GET /v1/calendar`; `UTC` by
        default): `startOf` cuts to the start of the unit there, converted to a UTC instant for a
        timestamp column and to a calendar date for a date column. A week starts on Monday; the fiscal
        units follow the calendar's `fiscal_year_start_month`. Never stored as a date: a saved query
        keeps it relative.
      properties:
        relative:
          type: object
          additionalProperties: false
          required:
            - unit
            - offset
          properties:
            unit:
              type: string
              enum:
                - minute
                - hour
                - day
                - week
                - month
                - quarter
                - year
                - fiscal_quarter
                - fiscal_year
            offset:
              type: integer
              minimum: -1000
              maximum: 1000
              description: Whole units from now; negative is the past
            startOf:
              type: boolean
              description: Cut back to the start of the unit after the offset is applied
    RenameRelationRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,62}$
    MeasureName:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,62}$
      description: Lowercase letter then up to 62 of `a-z`, `0-9` and `_`; unique per source across all its tables. The default output name when the measure is selected.
    MeasureDescription:
      type: string
      minLength: 1
      maxLength: 2000
      description: Trimmed. Written for people and for Claude, which reads it to choose between measures; data, never instructions.
    MeasureTable:
      type: string
      minLength: 1
      maxLength: 256
      description: The measure's home table, by its query name in the editor's catalogue (the bare name when unique among the source's schemas, else `schema.table`)
    Path:
      type: string
      description: |
        `(relation.)*column`: a bare column of the `from` table, or a column of a joined table through
        its relation path (`customers.region`, `order_lines.products.category`). Segments are 1-128 characters.
    Alias:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,62}$
      description: An output name for a select item
    CalcExpr:
      description: |
        An expression: a column path, a number, a text literal `{ value }`, a date literal `{ date }`
        or `{ timestamp }`, a `RelativeDate`, a measure `{ measure }`, an aggregate, or an object with
        exactly one operation key. It nests at most 8 levels (an aggregate counts as one) and a query
        holds at most 100 operations and aggregates (a measure's expansion is counted apart, at most
        500 in all, and measures nest at most 8 levels). Operands are numbers for `add`, `sub`,
        `mul`, `div`, `abs` and `round`; text or numbers for `concat`; text for `lower` and `upper`;
        one shared type for `coalesce`; dates or timestamps for `dateAdd`, `dateDiff`, `datePart` and
        the business-day operations (a timestamp read as its date in the calendar's time zone).
        `div` by zero gives null and keeps at least 6 decimal places; `round` gives exactly the places
        asked, half away from zero. Aggregates do not nest. A measure inside an aggregate is refused.
      oneOf:
        - $ref: '#/components/schemas/Path'
        - type: number
        - type: object
          additionalProperties: false
          required:
            - value
          properties:
            value:
              type: string
              maxLength: 1000
              description: A text literal; a bare string is a path
        - type: object
          additionalProperties: false
          required:
            - date
          properties:
            date:
              type: string
              format: date
              description: A date literal, `YYYY-MM-DD`
        - type: object
          additionalProperties: false
          required:
            - timestamp
          properties:
            timestamp:
              type: string
              format: date-time
              description: A timestamp literal, ISO 8601 with an offset or `Z`
        - $ref: '#/components/schemas/RelativeDate'
        - type: object
          additionalProperties: false
          required:
            - measure
          description: |
            A measure of the query's `from` table, as in a select item; group-level, so a `calc` holding
            one is group-level. A fixed measure (`fixed: true`, of any table) is one value ignoring the
            query's filters and grouping, usable anywhere an expression is, inside an aggregate too.
          properties:
            measure:
              $ref: '#/components/schemas/Alias'
        - $ref: '#/components/schemas/CalcOperation'
    Filter:
      type: object
      description: |
        One of `{ "and": [filter, ...] }`, `{ "or": [filter, ...] }`, `{ "not": filter }`, or
        `{ "<path>": { "<operator>": value }, ... }`, where several paths must all hold. Operators:
        `eq`, `ne`, `gt`, `gte`, `lt`, `lte` and `between` (two values, inclusive), each of which also
        takes a `RelativeDate` in place of a value (`{ "created_at": { "gte": { "relative": { "unit": "day",
        "offset": -30 } } } }`), `in` and `notIn` (1-1,000 values), `contains` and `startsWith` (text, case-insensitive, `%` and `_` literal),
        `isNull` (true or false), `isBusinessDay` (true or false: whether a date or timestamp column,
        a timestamp in the calendar's time zone, is a business day; in `where` and a `case`'s `if`,
        `invalid_operator` in `having`; a null date matches neither). The comparison operators above, `between` included (not `in` or
        `notIn`), also take `{ "measure": name }`, a fixed measure of any table, as a value (`{ "total":
        { "gt": { "measure": "avg_order_value" } } }`); a measure that is not fixed is `invalid_value`. Filters nest at most 5 deep. `and`, `or` and `not` are reserved:
        a column with one of those names cannot be filtered on directly. In `having`, the keys are
        the names of aggregate select items.
      additionalProperties: true
    PeriodUnit:
      type: string
      description: The period a business-day count spans; `week` is ISO, from Monday
      enum:
        - week
        - month
        - quarter
        - year
        - fiscal_quarter
        - fiscal_year
    UnitAndDate:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - $ref: '#/components/schemas/PeriodUnit'
        - $ref: '#/components/schemas/CalcExpr'
    CalcOperation:
      type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      description: Exactly one of these keys
      properties:
        add:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        mul:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        sub:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CalcExpr'
        div:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CalcExpr'
        abs:
          $ref: '#/components/schemas/CalcExpr'
        round:
          description: An expression (0 places), or `[expression, places]` with places an integer 0 to 10
          oneOf:
            - $ref: '#/components/schemas/CalcExpr'
            - type: array
              minItems: 2
              maxItems: 2
              prefixItems:
                - $ref: '#/components/schemas/CalcExpr'
                - type: integer
                  minimum: 0
                  maximum: 10
        concat:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        lower:
          $ref: '#/components/schemas/CalcExpr'
        upper:
          $ref: '#/components/schemas/CalcExpr'
        coalesce:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalcExpr'
        sum:
          $ref: '#/components/schemas/CalcExpr'
        avg:
          $ref: '#/components/schemas/CalcExpr'
        min:
          $ref: '#/components/schemas/CalcExpr'
        max:
          $ref: '#/components/schemas/CalcExpr'
        count:
          $ref: '#/components/schemas/CalcExpr'
          description: A path, `"*"`, or an expression
        countDistinct:
          $ref: '#/components/schemas/CalcExpr'
        case:
          type: object
          additionalProperties: false
          required:
            - when
          description: |
            The `then` of the first `when` whose `if` holds, else the `else` (null without one). Every
            `then` and the `else` share one type (number, text, date or timestamp; a number literal
            fits any number). Booleans are not values: conditions live only in `if`.
          properties:
            when:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required:
                  - if
                  - then
                properties:
                  if:
                    $ref: '#/components/schemas/Filter'
                    description: A filter over column paths, as in `where`
                  then:
                    $ref: '#/components/schemas/CalcExpr'
            else:
              $ref: '#/components/schemas/CalcExpr'
        dateAdd:
          description: '`[date or timestamp, amount, unit]`: the moment shifted; a month, quarter or year step clamps to the last day of the month'
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
            - $ref: '#/components/schemas/CalcExpr'
            - type: integer
              minimum: -10000
              maximum: 10000
            - type: string
              enum:
                - day
                - week
                - month
                - quarter
                - year
        dateDiff:
          description: '`[unit, start, end]`: whole units completed from start to end, truncated toward zero (negative when end is before start); `second`, `minute` and `hour` count within a day (a date counts from midnight)'
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
            - type: string
              enum:
                - second
                - minute
                - hour
                - day
                - week
                - month
                - quarter
                - year
            - $ref: '#/components/schemas/CalcExpr'
            - $ref: '#/components/schemas/CalcExpr'
        datePart:
          description: |
            `[part, date or timestamp]`: a number. `weekday` is 1 for Monday to 7 for Sunday. The
            fiscal parts follow the calendar's `fiscal_year_start_month`, a fiscal year named by the
            calendar year in which it ends. `business_day` is which business day of its month the date
            is (0 before the month's first). Every part reads a timestamp as its date in the calendar's
            time zone.
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - type: string
              enum:
                - year
                - quarter
                - month
                - day
                - weekday
                - fiscal_year
                - fiscal_quarter
                - business_day
            - $ref: '#/components/schemas/CalcExpr'
        businessDays:
          description: |
            `[start, end]`: the calendar's business days from start to end, both inclusive, 0 when end
            is before start. A business day is a working weekday that is not a holiday. Each operand,
            here and in every business-day operation, is any date or timestamp expression (a column,
            a date operation, a literal or a relative date); a timestamp is read as its date in the
            calendar's time zone (by the zone's offsets, the same on every engine), null more than 25
            years either way from the current year in a zone other than UTC. Dates are supported from
            1900-01-01 through 9998-12-31; outside that (Postgres infinities included) the result is
            null, never an error. With literal operands only, the value is computed when the query is
            planned.
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CalcExpr'
        businessDaysBetween:
          description: '`[start, end]`: the business days after start through end, a duration, negative when end is before start (Monday to Tuesday is 1)'
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CalcExpr'
        businessDaysIn:
          description: '`[unit, date]`: the business days of the period of `unit` holding the date; a week starts on Monday, fiscal units follow the calendar'
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - $ref: '#/components/schemas/PeriodUnit'
            - $ref: '#/components/schemas/CalcExpr'
        businessDaysInMonth:
          $ref: '#/components/schemas/CalcExpr'
          description: 'The business days of the date''s month: `businessDaysIn` `["month", date]`'
        businessDaysElapsed:
          description: 'A date, or `[unit, date]`: the business days from the first day of its period (its month without a unit) through the date, inclusive'
          oneOf:
            - $ref: '#/components/schemas/CalcExpr'
            - $ref: '#/components/schemas/UnitAndDate'
        businessDaysRemaining:
          description: 'A date, or `[unit, date]`: the business days after the date through the end of its period (its month without a unit)'
          oneOf:
            - $ref: '#/components/schemas/CalcExpr'
            - $ref: '#/components/schemas/UnitAndDate'
        addBusinessDays:
          description: |
            `[date, n]`: the date `n` business days after the date (before it when `n` is negative), `n`
            a number expression truncated toward zero, counted from the date itself as Excel's WORKDAY
            (Saturday + 1 is Monday, Saturday - 1 is Friday); `n = 0` gives the date when it is a
            business day, else the next one. A date; null past 9998-12-31 or for `n` beyond ±3,000,000.
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CalcExpr'
        businessDaysInPeriod:
          description: |
            In a metric's formula only (`invalid_operator` in a table query): the business days of each
            period of the metric query's `bucket`, or without one of its `range` (both bounds needed,
            else `invalid_operator`): each local day with any instant in the range, `lt`'s own day
            left out only when `lt` is at local midnight (or a date).
          type: boolean
          enum:
            - true
    MeasureFormula:
      description: |
        An expression that is group-level: every column it reads sits inside an aggregate, or comes
        from other measures (`{ "measure": name }`) of the same home table. It may use `case`, date
        arithmetic and the calendar functions, and nests at most 8 levels; the expansion, with the
        measures it uses, holds at most 500 operations and aggregates, and measures nest at most 8
        levels. Planned against the editor's own catalogue, so an editor cannot define a measure over
        columns they are not granted.
      $ref: '#/components/schemas/CalcExpr'
    MeasureWhere:
      description: |
        A filter over the home table's columns and its to-one relation paths, with literal or relative
        values. It applies to every aggregate in the formula, including those of the measures it uses
        (`sum(x)` becomes `sum(case when W then x end)`). The relation paths the formula and `where`
        read are the measure's joins; each must be a to-one path (`measure_reads_to_many`).
      $ref: '#/components/schemas/Filter'
    MeasureFixed:
      type: boolean
      default: false
      description: |
        A fixed measure is one value that ignores the query's filters and grouping (a target, the
        business days of the month): it may be a comparison value (`{ "measure": name }`) or appear
        anywhere in an expression, inside an aggregate too, and in a metric query it reads no periods.
        At most 10 fixed-measure subqueries to a query.
    MeasureDateColumn:
      type:
        - string
        - 'null'
      minLength: 1
      maxLength: 256
      description: |
        The column a metric query's `bucket` and `range` apply to: a path from the home table,
        through to-one relations, to a date or timestamp column; null for none (the measure then
        cannot be bucketed or ranged, `measure_has_no_date`). Checked against the editor's catalogue
        (`invalid_operator` for a column that is not a date, at path `["date_column"]`).
    MeasureUsedBy:
      type: object
      required:
        - saved_queries
        - panels
      description: What is built on the measure, counted by searching saved queries of the source for its name
      properties:
        saved_queries:
          type: integer
          minimum: 0
          description: Saved queries that use it; they do not block a change, and fail with `not_found_or_not_accessible` once it no longer fits
        panels:
          type: integer
          minimum: 0
          description: Dashboard panels that show one of those saved queries
    MeasureBroken:
      type: object
      required:
        - code
        - message
      description: Why a measure does not plan against its source's whole catalogue
      properties:
        code:
          type: string
          description: 'A query error code: `missing_in_source` for a column a refresh marked missing, `too_many_joins`, `measure_cycle`, ...'
        message:
          type: string
    Measure:
      type: object
      description: A measure in full
      required:
        - id
        - name
        - description
        - table
        - formula
        - where
        - fixed
        - date_column
        - created_at
        - updated_at
        - usable
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        table:
          $ref: '#/components/schemas/MeasureTable'
        formula:
          $ref: '#/components/schemas/MeasureFormula'
        where:
          oneOf:
            - $ref: '#/components/schemas/MeasureWhere'
            - type: 'null'
          description: The measure's filter; null when it has none
        fixed:
          $ref: '#/components/schemas/MeasureFixed'
        date_column:
          $ref: '#/components/schemas/MeasureDateColumn'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        usable:
          type: boolean
          description: Whether it plans against the caller's own visible catalogue, so the caller can use it in a query
        used_by:
          $ref: '#/components/schemas/MeasureUsedBy'
          description: Present for measure editors and for those who see every measure
        broken:
          oneOf:
            - $ref: '#/components/schemas/MeasureBroken'
            - type: 'null'
          description: Present for those who see every measure (`zeteo.sources.read`, or the upload source's owner); null when the measure plans cleanly
    RedactedMeasure:
      type: object
      description: A measure an editor cannot fully see, because it reads columns they are not granted. Never its formula or filter, which would name ungranted columns and filter values.
      required:
        - name
        - description
        - table
        - usable
      properties:
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        table:
          $ref: '#/components/schemas/MeasureTable'
        usable:
          type: boolean
          const: false
    ListMeasuresResponse:
      type: object
      required:
        - data
        - can_edit
        - can_manage_editors
      properties:
        can_edit:
          type: boolean
          description: |
            Whether the caller may create, change and delete the source's measures now: `zeteo.measures.write`,
            an editor of the source, and the source not archived.
        can_manage_editors:
          type: boolean
          description: |
            Whether the caller may replace the source's editor list now: `zeteo.sources.write` or the
            upload source's owner, and the source not archived.
        data:
          type: array
          description: A `Measure`, or a `RedactedMeasure` (told apart by its `id`, which a redacted one lacks)
          items:
            anyOf:
              - $ref: '#/components/schemas/Measure'
              - $ref: '#/components/schemas/RedactedMeasure'
    CreateMeasureRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - table
        - formula
      properties:
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        table:
          $ref: '#/components/schemas/MeasureTable'
        formula:
          $ref: '#/components/schemas/MeasureFormula'
        where:
          oneOf:
            - $ref: '#/components/schemas/MeasureWhere'
            - type: 'null'
        fixed:
          $ref: '#/components/schemas/MeasureFixed'
        date_column:
          $ref: '#/components/schemas/MeasureDateColumn'
    InvalidMeasureError:
      description: The body of a `400`. For a measure that does not plan its `error` is the query error code of the first problem found, and `path` names the part at fault (`["formula"]`, `["where"]`, `["table"]` or `["date_column"]`; `["formula"]` for a metric).
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            path:
              type: array
              items:
                type: string
    PreviewMeasureRequest:
      type: object
      additionalProperties: false
      required:
        - measure
      properties:
        measure:
          $ref: '#/components/schemas/CreateMeasureRequest'
          description: A draft measure, not saved. A draft of the name of a stored measure stands in its place for the run.
        bucket:
          type: object
          additionalProperties: false
          required:
            - unit
            - column
          description: Groups the value by a date bucket of a column of the home table, ordered by period; the measure's value alone, as one row, without it
          properties:
            unit:
              type: string
              enum:
                - day
                - week
                - month
                - quarter
                - year
                - fiscal_quarter
                - fiscal_year
            column:
              type: string
              minLength: 1
              maxLength: 256
    MeasureInUseError:
      description: The body of a `409`; `dependents` is present on `measure_in_use` only (`measure_name_taken` and `source_archived` carry none), measures first
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            dependents:
              type: array
              description: The measures and metrics that use this one and would break
              items:
                type: object
                required:
                  - kind
                  - name
                properties:
                  kind:
                    type: string
                    enum:
                      - measure
                      - metric
                  name:
                    type: string
    UpdateMeasureRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Any of a measure''s fields, at least one. `where: null` removes its filter and `date_column: null` its date column.'
      properties:
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        table:
          $ref: '#/components/schemas/MeasureTable'
        formula:
          $ref: '#/components/schemas/MeasureFormula'
        where:
          oneOf:
            - $ref: '#/components/schemas/MeasureWhere'
            - type: 'null'
        fixed:
          $ref: '#/components/schemas/MeasureFixed'
        date_column:
          $ref: '#/components/schemas/MeasureDateColumn'
    MetricFormula:
      description: |
        An expression whose leaves are numbers and `{ "measure": name }` (a measure of any table of
        the source, at least one), combined only by `add`, `sub`, `mul`, `div`, `abs` and `round` and
        the calendar functions over date literals (`businessDaysInMonth` and the like), and
        `{ "businessDaysInPeriod": true }` (the business days of each period). No columns,
        `case`, aggregates, text or other metrics. Planned against the editor's own catalogue.
      $ref: '#/components/schemas/CalcExpr'
    Metric:
      type: object
      description: A metric in full
      required:
        - id
        - name
        - description
        - formula
        - created_at
        - updated_at
        - usable
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        formula:
          $ref: '#/components/schemas/MetricFormula'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        usable:
          type: boolean
          description: Whether every measure it uses is in the caller's own visible catalogue, so the caller can ask for it
        used_by:
          $ref: '#/components/schemas/MeasureUsedBy'
          description: Present for measure editors and for those who see every metric
        broken:
          oneOf:
            - $ref: '#/components/schemas/MeasureBroken'
            - type: 'null'
          description: Present for those who see every metric (`zeteo.sources.read`, or the upload source's owner); null when the metric plans cleanly
    RedactedMetric:
      type: object
      description: A metric an editor cannot fully see, because a measure it uses is not theirs. Never its formula, which would name measures they cannot see.
      required:
        - name
        - description
        - usable
      properties:
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        usable:
          type: boolean
          const: false
    ListMetricsResponse:
      type: object
      required:
        - data
        - can_edit
        - can_manage_editors
      properties:
        can_edit:
          type: boolean
          description: 'Whether the caller may create, change and delete the source''s metrics now: `zeteo.measures.write`, an editor of the source, and the source not archived'
        can_manage_editors:
          type: boolean
          description: Whether the caller may replace the source's editor list now
        data:
          type: array
          description: A `Metric`, or a `RedactedMetric` (told apart by its `id`, which a redacted one lacks)
          items:
            anyOf:
              - $ref: '#/components/schemas/Metric'
              - $ref: '#/components/schemas/RedactedMetric'
    CreateMetricRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - formula
      properties:
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        formula:
          $ref: '#/components/schemas/MetricFormula'
    range:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Half-open bounds on each measure's date column, `gte`, `lt` or both; relative dates resolve in the calendar's time zone, as buckets do
      properties:
        gte:
          $ref: '#/components/schemas/RangeBound'
        lt:
          $ref: '#/components/schemas/RangeBound'
    PreviewMetricRequest:
      type: object
      additionalProperties: false
      required:
        - metric
      properties:
        metric:
          $ref: '#/components/schemas/CreateMetricRequest'
          description: A draft metric, not saved. A draft of the name of a stored metric stands in its place for the run.
        bucket:
          type: string
          enum:
            - day
            - week
            - month
            - quarter
            - year
            - fiscal_quarter
            - fiscal_year
        range:
          $ref: '#/components/schemas/range'
    UpdateMetricRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any of a metric's fields, at least one
      properties:
        name:
          $ref: '#/components/schemas/MeasureName'
        description:
          $ref: '#/components/schemas/MeasureDescription'
        formula:
          $ref: '#/components/schemas/MetricFormula'
    MeasureEditor:
      type: object
      description: A user or group that may create, change and delete the source's measures (when it also holds `zeteo.measures.write`). A group has no `email` key.
      required:
        - type
        - id
        - name
        - added_at
      properties:
        type:
          $ref: '#/components/schemas/PrincipalType'
        id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
          description: From tereo's directory; null when it could not be looked up
        email:
          type:
            - string
            - 'null'
          description: Users only
        added_at:
          type: string
          format: date-time
    ListMeasureEditorsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MeasureEditor'
    ReplaceMeasureEditorsRequest:
      type: object
      additionalProperties: false
      required:
        - principals
      properties:
        principals:
          type: array
          maxItems: 100
          description: The whole editor list; each principal once
          items:
            $ref: '#/components/schemas/SharePrincipal'
    CalendarDate:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: A calendar day, `YYYY-MM-DD`, that exists
    Holiday:
      type: object
      additionalProperties: false
      required:
        - date
        - name
      properties:
        date:
          $ref: '#/components/schemas/CalendarDate'
        name:
          type: string
          minLength: 1
          maxLength: 200
    Calendar:
      type: object
      description: |
        The one calendar of the install. Its defaults, until an admin saves one, are Monday to Friday,
        no holidays, a fiscal year starting in January and `UTC`, which behave as before the calendar
        existed.
      required:
        - working_days
        - holidays
        - fiscal_year_start_month
        - time_zone
        - updated_at
      properties:
        working_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        holidays:
          type: array
          description: Sorted by date
          items:
            $ref: '#/components/schemas/Holiday'
        fiscal_year_start_month:
          type: integer
          minimum: 1
          maximum: 12
        time_zone:
          type: string
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Null until a calendar has been saved
    CalendarInput:
      type: object
      additionalProperties: false
      required:
        - working_days
        - holidays
        - fiscal_year_start_month
        - time_zone
      properties:
        working_days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: Weekdays that work, 1 (Monday) to 7 (Sunday); at least one
          items:
            type: integer
            minimum: 1
            maximum: 7
        holidays:
          type: array
          maxItems: 5000
          description: Unique by date. A holiday on a non-working day has no effect.
          items:
            $ref: '#/components/schemas/Holiday'
        fiscal_year_start_month:
          type: integer
          minimum: 1
          maximum: 12
          description: The month a fiscal year starts in; 1 is January
        time_zone:
          type: string
          description: '`UTC`, or an IANA region name with a "/" (`Europe/Paris`, `Etc/GMT+5`). A name without one (`CET`, `EST5EDT`…) is refused: Postgres may read it as a fixed offset with no summer time.'
    row_rule:
      oneOf:
        - $ref: '#/components/schemas/RowRule'
        - type: 'null'
      description: Required when `row_access` is `rule`, refused otherwise (`null` counts as not given)
    row_rule_description:
      type:
        - string
        - 'null'
      maxLength: 200
      description: Optional, only with `rule`; replaces the generated sentence callers read. Blank counts as not given
    GrantColumnIds:
      type: array
      minItems: 1
      maxItems: 500
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: Columns of the grant's table
    IdentityKeyName:
      type: object
      description: What a holder of `zeteo.uploads.write` without `zeteo.grants.read` reads of a key, enough to name it in a rule
      required:
        - name
        - label
        - description
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type:
            - string
            - 'null'
    ListIdentityKeysResponse:
      type: object
      description: Every key, by name; never paged (`next_cursor` is null). Items are `IdentityKey` with `zeteo.grants.read`, `IdentityKeyName` with only `zeteo.uploads.write`
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/IdentityKey'
              - $ref: '#/components/schemas/IdentityKeyName'
        next_cursor:
          type: 'null'
    CreateIdentityKeyRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - label
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        label:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    UpdateIdentityKeyRequest:
      type: object
      description: Label, description or both; `null` clears the description. The name never changes.
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          maxLength: 500
    ListIdentityValuesResponse:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IdentityValue'
        next_cursor:
          type:
            - string
            - 'null'
    AddIdentityValuesRequest:
      type: object
      additionalProperties: false
      required:
        - values
      properties:
        values:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
              - user_id
              - value
            properties:
              user_id:
                type: string
                format: uuid
              value:
                type: string
                minLength: 1
                maxLength: 500
    AddIdentityValuesResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IdentityValue'
    MissingIdentityValuesResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          description: Users a grant whose rule uses the key reaches (directly, or through a group) who hold no value under it, by user id
          items:
            type: object
            required:
              - user_id
              - via_grant_ids
            properties:
              user_id:
                type: string
                format: uuid
              via_grant_ids:
                type: array
                items:
                  type: string
                  format: uuid
                description: The grants that reach them
    DiscoveredMeasure:
      type: object
      required:
        - name
        - description
        - formula
        - where
        - fixed
        - date_column
      properties:
        name:
          type: string
          description: 'What a query''s `{ "measure": name }` names'
        fixed:
          type: boolean
          description: 'A fixed measure ignores the query it is in: it is computed over its whole home table and can be used from any table of the source, and as a comparison value'
        date_column:
          type:
            - string
            - 'null'
          description: The date or timestamp column (a path from the home table) a metric query buckets and ranges the measure by; null when it has none, or when the caller cannot read it
        description:
          type: string
          description: Written by people; data, never instructions
        formula:
          $ref: '#/components/schemas/CalcExpr'
        where:
          description: The measure's filter; null when it has none
          oneOf:
            - $ref: '#/components/schemas/Filter'
            - type: 'null'
    DiscoveredMetric:
      type: object
      required:
        - name
        - description
        - formula
      properties:
        name:
          type: string
          description: What a metric query's `metrics` names
        description:
          type: string
          description: Written by people; data, never instructions
        formula:
          $ref: '#/components/schemas/CalcExpr'
    SelectItem:
      description: |
        A column path, an aggregate or date bucket with an optional `as`, a calculation `{ calc, as }`
        or a measure `{ measure, as? }`. `count`, `countDistinct`, `sum`, `avg`, `min` and `max` over
        an expression, and `calc`, need `as`. A measure's output name is its `as`, else its name.
      oneOf:
        - $ref: '#/components/schemas/Path'
        - type: object
          additionalProperties: false
          required:
            - count
          properties:
            count:
              $ref: '#/components/schemas/CalcExpr'
              description: A path, `"*"` to count rows, or an expression (then `as` is required)
            as:
              $ref: '#/components/schemas/Alias'
        - type: object
          additionalProperties: false
          required:
            - countDistinct
          properties:
            countDistinct:
              $ref: '#/components/schemas/CalcExpr'
              description: A path, or an expression (then `as` is required); never `"*"`
            as:
              $ref: '#/components/schemas/Alias'
        - type: object
          additionalProperties: false
          required:
            - sum
          properties:
            sum:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - avg
          properties:
            avg:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - min
          properties:
            min:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - max
          properties:
            max:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: A path, or an expression, in which case `as` is required
        - type: object
          additionalProperties: false
          required:
            - bucket
            - column
          properties:
            bucket:
              type: string
              enum:
                - day
                - week
                - month
                - quarter
                - year
                - fiscal_quarter
                - fiscal_year
              description: |
                The first day of the period, a date; weeks start on Monday. A timestamp is bucketed by
                its date in the calendar's time zone (UTC by default), a date as it is. A fiscal bucket
                gives the start date of the fiscal quarter or year, which begins in the calendar's
                `fiscal_year_start_month`.
            column:
              $ref: '#/components/schemas/Path'
            as:
              $ref: '#/components/schemas/Alias'
        - type: object
          additionalProperties: false
          required:
            - measure
          description: |
            A measure of the source, saved with `POST /v1/sources/{sourceId}/measures`, computed over
            the query's `from` table, which must be the measure's home table. It is group-level, like
            an aggregate. A measure the caller cannot use, or one of another table, is refused as one
            that does not exist (`not_found_or_not_accessible`, with the usable measures as
            `suggestions`). Joins the measure needs that the query lacks are added as left joins and
            count toward `max_joins`. A query that joins a to-many relation cannot use a measure
            (`measure_needs_single_rows`).
          properties:
            measure:
              $ref: '#/components/schemas/Alias'
            as:
              $ref: '#/components/schemas/Alias'
        - type: object
          additionalProperties: false
          required:
            - calc
            - as
          properties:
            calc:
              $ref: '#/components/schemas/CalcExpr'
            as:
              $ref: '#/components/schemas/Alias'
          description: |
            A calculation. Row-level when it holds no aggregate (computed per row, nameable in `where`
            and `groupBy`); group-level when every column sits inside an aggregate (nameable in `having`
            and `orderBy`). A mix of the two is refused (`invalid_grouping`).
    ChartColumn:
      type: string
      minLength: 1
      maxLength: 200
      description: A result column of the saved query, by its `as` or its path
    ChartDecimals:
      type: integer
      minimum: 0
      maximum: 6
      description: Decimal places shown
    ChartLegend:
      type: string
      enum:
        - auto
        - none
    GaugeChart:
      type: object
      additionalProperties: false
      required:
        - type
        - version
        - value
        - max
      description: |
        A progress gauge read from the first row of the result: `value` is the progress, `max` the end
        of the scale and `target` a marker on it (a budget pacing gauge: `value` the spend to date,
        `target` the budget pace, `max` the monthly budget). Typically fed by measures.
      properties:
        type:
          type: string
          const: gauge
        version:
          type: integer
          const: 1
        value:
          $ref: '#/components/schemas/ChartColumn'
          description: A number column
        max:
          $ref: '#/components/schemas/ChartColumn'
          description: A number column
          the end of the scale: null
        target:
          $ref: '#/components/schemas/ChartColumn'
          description: A number column
          drawn as a marker: null
        min:
          description: The start of the scale, a number column or a number; 0 when left out
          oneOf:
            - $ref: '#/components/schemas/ChartColumn'
            - type: number
        unit:
          type: string
          maxLength: 20
        decimals:
          $ref: '#/components/schemas/ChartDecimals'
        legend:
          $ref: '#/components/schemas/ChartLegend'
    PanelTimeColumn:
      type: string
      minLength: 1
      maxLength: 200
      description: |
        A date or timestamp column of the saved query that the dashboard's time range filters; or
        `range`, for a saved query that is a metric query (it has `metrics`): the dashboard's range then
        replaces the query's own `range`. A metric query takes no other time column; on a table query
        `range` is an ordinary column path.
    PanelTitle:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed
    PlaceX:
      type: integer
      minimum: 0
      maximum: 11
      description: Column on the grid of 12; goes with `y`, and `x + w` is at most 12
    PlaceY:
      type: integer
      minimum: 0
      maximum: 1000
      description: Row; goes with `x`
    PlaceW:
      type: integer
      minimum: 1
      maximum: 12
      description: Width in columns
    PlaceH:
      type: integer
      minimum: 1
      maximum: 24
      description: Height in rows
x-tagGroups:
  - name: Sources
    tags:
      - Sources
      - Uploads
      - Connections
      - Catalogue
      - Measures
      - Metrics
      - Calendar
  - name: Access
    tags:
      - Grants
  - name: Querying
    tags:
      - Queries
      - Saved queries
      - Dashboards
  - name: Platform
    tags:
      - Platform
