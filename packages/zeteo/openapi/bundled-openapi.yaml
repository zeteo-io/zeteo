          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `measure_in_use` (with `dependents`), `measure_name_taken` or `source_archived`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureInUseError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Measures
      summary: Delete a measure
      description: |
        Deletes a measure the caller can see in full, refused with `409 measure_in_use` (naming the
        measures in `dependents`) while other measures use it. Saved queries that use it do not block
