        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards/{dashboardId}/panels:
    post:
      tags:
        - Dashboards
      summary: Add a panel
      description: |
        Adds a panel to the caller's own dashboard (at most 50). An own panel's saved query must be one
        the caller may see (their own, shared with them, or marked `available_for_dashboards` in their
        signed-in organization; anything else is `404 not_found`) and that is available for dashboards,
        its chart must fit the saved query's result, and its time column must be a date or timestamp
        column of that result; what does not fit is `400 invalid_panel` with `problems`. A saved query the
        caller may not run is `403 saved_query_not_accessible`. A linked panel's saved panel must be the
        caller's or shared with them (else `404 not_found`), with its saved query reaching both the
        caller and the saved panel's owner (else `400 invalid_panel`). Without a place the panel goes in
        the first free one, in the chart type's default size. A `zeteo.dashboard.updated` audit entry is
        written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: addDashboardPanel
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelInput'
      responses:
        '201':
          description: The panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Panel'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/SavedQueryNotAccessibleResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards/{dashboardId}/panels/{panelId}:
    patch:
      tags:
        - Dashboards
      summary: Change a panel
      description: |
        A panel of the caller's own dashboard. Give at least one of `title`, the place (`x`, `y`, `w`,
        `h`) and, for an own panel, `saved_query_id`, `chart` and `time_column`; a linked panel has no
        settings of its own, so changing those is `400 invalid_panel` (change the saved panel, or detach
        the panel). A new saved query, chart or time column is checked as `POST .../panels` checks them
        (`400 invalid_panel` with `problems`; `403 saved_query_not_accessible` for a saved query the
        caller may not run); a title or place changes without asking whether the caller can run it. A
        `zeteo.dashboard.updated` audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: updateDashboardPanel
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
        - $ref: '#/components/parameters/PanelIdParam'
