      description: |
        Newest first. `scope=mine` (the default) lists the caller's own, `scope=shared` those shared with
        them or one of their groups, and `scope=all` every saved panel (a holder of
        `zeteo.dashboards.read`; `403 forbidden` otherwise). `owner_id` applies to `scope=all` only (`400
        invalid_request` otherwise). `q` matches names, case-insensitively. One the caller cannot run is
        listed with its `state` and no chart.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
