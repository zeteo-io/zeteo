    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:4201
    description: Local development server (each app deploys its own Zeteo; substitute its host)
security:
  - BearerAuth: []
tags:
  - name: Sources
    description: Databases registered with Zeteo
  - name: Uploads
    description: CSV and xlsx files staged for upload sources, which their owners manage and grant
  - name: Connections
    description: The connection to Google that Google Sheets sources read through
  - name: Catalogue
    description: A source's tables, columns and relations, read from the source by a refresh
  - name: Measures
    description: Named, described calculations over a source's table that queries use by name, and the editors who manage them
  - name: Metrics
    description: Named, described formulas over a source's measures, combined per period by metric queries
  - name: Calendar
    description: The install's working days, holidays, fiscal year and time zone, which business-day functions, fiscal periods and relative dates follow
  - name: Grants
    description: Which users and groups may query which tables and columns, and how much at once
  - name: Queries
    description: Running and exporting queries over granted tables and columns, and the record of every run
  - name: Saved queries
    description: Queries saved by name, shared with users and groups, and run by whoever may
  - name: Dashboards
    description: Dashboards of panels over saved queries, saved panels that dashboards link, and running a dashboard
  - name: Platform
    description: Health and the signed-in caller
paths:
  /health:
    get:
      tags:
        - Platform
      summary: Health check
      description: |
        Whether Postgres and Redis answer. Public: it names no version and takes no token.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A dependency does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/me:
    get:
      tags:
        - Platform
      summary: Who is signed in, and which zeteo permissions they hold
      description: |
        Describes the caller for the admin UI. `permissions` lists the caller's permissions that start
        with `zeteo.`, sorted, exactly as held: a permission is not expanded along its ladder, so a
        holder of `zeteo.grants.write` is not shown `zeteo.grants.read`, and the UI applies the ladder
        itself (`write` includes `read`, `archive` includes `write`, `delete` includes `archive`,
        `admin` includes all on its base). A bare `admin` permission covers every zeteo permission
        and is listed too when held, verbatim. `name` and `email` come from tereo's directory and
        are `null` when it cannot be reached or does not know the user; the answer is still `200`.

        **Required permissions:** none beyond a valid token.
      operationId: getMe
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
  /v1/sources:
    get:
      tags:
        - Sources
      summary: List sources
      description: |
        Lists sources in creation order (`created_at`, then `id`), database and upload sources
        alike. Archived sources (and deleted upload sources) are left out unless
        `include_archived=true`. A source whose stored settings cannot be decrypted is listed with
        `settings: null`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes. With
        `owner_id=me`, a caller holding `zeteo.uploads.write` and `zeteo.data.read` instead,
        who sees only their own upload sources. `403 forbidden` otherwise.
      operationId: listSources
      parameters:
        - name: include_archived
          in: query
          required: false
          description: Also list archived sources
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          required: false
          description: Only sources of this type
          schema:
            $ref: '#/components/schemas/SourceType'
        - name: owner_id
          in: query
          required: false
          description: Only the upload sources of this owner; `me` for the caller
          schema:
            type: string
            pattern: ^(me|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
          examples:
            me:
              value: me
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Sources
      summary: Register a database or create an upload source
      description: |
        **A database** (`type` `postgres` or `azure-sql`): before anything is stored, Zeteo validates `settings` against the
        type's schema, checks the host against the deploy's network rules, connects with the login
        and inspects its rights. A login that holds rights a read-only login would not is refused
        with `422 writable_login` (the body lists the findings) unless `allow_writable_login`
        is true, in which case the source is stored with `writable_login_allowed: true` and the audit
        entry records the finding codes. Nothing is stored when any step fails. An audit entry
        `zeteo.source.created` is written with the slug, the type and the settings without
        `password` and `ca`. Needs `zeteo.sources.write`. Errors: `409 slug_taken`,
        `422 host_not_allowed`, `422 writable_login`, `502 source_unreachable`.

        **An upload source** (`type: upload`): loads the chosen tables of the caller's staging (see
        `POST /v1/uploads`) into a new upload source owned by the caller, who gets an owner grant (an
        ordinary `all_columns` user grant flagged `owner_grant`) on each table. Column types are the
        inferred ones unless corrected; forcing a type the values do not fit is `422 cast_failed`
        (naming the column and the first rows, 1-based rows of the file with its header counted).
        The new data counts against the owner's `UPLOAD_QUOTA_BYTES` (`409 quota_exceeded`,
        checked under a per-owner lock). Nothing is left on any failure, and the staging is used up
        on success. A `zeteo.source.created` audit entry (metadata `type: upload`) is written (never any cell data).
        Needs `zeteo.uploads.write` and `zeteo.data.read`. Errors: `404
        uploads_not_configured` (`UPLOADS_READER_URL` unset), `404 staging_not_found`
        (expired, missing or someone else's), `409 name_taken` (the slug is in use; a slug made from
        the name gets a suffix instead), `409 quota_exceeded`, `422 cast_failed`, `503
        upload_source_busy`.

        **From a spreadsheet:** the staging may be one of a Google spreadsheet (`POST
        /v1/uploads/links`); its tabs become tables synced every `sync_interval_minutes` (15 to
        1440, default 60) and claim the spreadsheet: one an unarchived source already reads is
        `409 sheet_in_use` (it says nothing of whose). A source may mix tables from files and
        spreadsheets, so the type is `upload` either way; the response carries `sync` once it has
        Sheets tables. Further errors: `404 google_not_configured`, `422 sheet_not_accessible`,
        `502 google_unavailable`, `502 google_sign_in_failed`.

        **Required permissions:** `zeteo.sources.write` or `zeteo.uploads.write` to reach the
        route, then as above for the body's `type` (`403 forbidden` without).
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateSourceRequest'
                - $ref: '#/components/schemas/CreateUploadSourceRequest'
      responses:
        '201':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `uploads_not_configured`, `staging_not_found` (an upload source) or `google_not_configured` (a spreadsheet staging)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `slug_taken` (a database), `name_taken` or `quota_exceeded` (an upload source), `sheet_in_use` (a spreadsheet staging)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Refused - `host_not_allowed` or `writable_login` (with `findings`) for a database, `cast_failed` or `sheet_not_accessible` for an upload source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`, the source could not be reached or refused the login; `google_unavailable` or `google_sign_in_failed` for a spreadsheet staging
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}:
    get:
      tags:
        - Sources
      summary: Get a source
      description: |
        Returns one source, archived or not. `settings` is redacted, and null when the stored
        settings cannot be decrypted.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
      operationId: getSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Sources
      summary: Change a source
      description: |
        Changes any of the create fields except `slug` and `type`. A request with neither
        `settings` nor `schemas` never contacts the source. With `settings`, the new object replaces
        the old one whole and goes through the same checks as a create (the login check included;
        send `allow_writable_login: true` again to keep an override); the source's open connections
        are closed so the next use connects with the new settings. After a change to `settings` or
        `schemas` is committed, the catalogue is refreshed; if that refresh fails, the change stands,
        `status` is `unreachable` and the answer is still `200`. An audit entry
        `zeteo.source.updated` lists the names of the fields changed and, when `settings` changed,
        the new settings without `password` and `ca`.

        On an upload source only `name`, `description` and the limit fields apply
        (`409 not_a_database_source` for `settings` or `schemas`). Its owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`) may rename it or change its description,
        which writes `zeteo.source.updated` (as does an admin's change of those alone); its limits
        need `zeteo.sources.write`.

        On an upload source `sync_interval_minutes` (15 to 1440) sets the minutes between syncs of
        its Google Sheets tables; its owner may send it with `name` and `description`, and an admin
        also with the limit fields, recorded as one change. On a database source it is
        `422 not_synced`.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner may send `name`, `description` and `sync_interval_minutes` alone; anyone else gets the same 403.

        **Errors:** `404 not_found`, `409 source_archived`, `409 not_a_database_source`,
        `422 host_not_allowed`, `422 writable_login`, `422 not_synced`, `502 source_unreachable`.
      operationId: updateSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The destination or login was refused - `host_not_allowed` or `writable_login` (with `findings`), or `not_synced` (`sync_interval_minutes` on a source that does not sync)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Sources
      summary: Delete an upload source
      description: |
        Archives the upload source and drops its stored data (waiting for queries reading it, up to
        the swap's lock wait: `503 upload_source_busy` past it). Catalogue rows stay, marked missing.
        Grants stay too, and the owner grants lose their `owner_grant` flag, so an admin with
        `zeteo.grants.write` may remove them. A `zeteo.source.deleted` audit entry is written.
        A database source is archived instead (`POST /v1/sources/{sourceId}/archive`).

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: deleteSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, or `source_archived` (already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/archive:
    post:
      tags:
        - Sources
      summary: Archive a source
      description: |
        Archives the source and closes its connections. Sources are never deleted, and an archived
        source takes no further change. An audit entry `zeteo.source.archived` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived` (already archived),
        `409 not_a_database_source` (an upload source is deleted, not archived:
        `DELETE /v1/sources/{sourceId}`).
      operationId: archiveSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/test:
    post:
      tags:
        - Sources
      summary: Test a source's login
      description: |
        Connects with the stored settings on a fresh connection, re-checks the host against the
        network rules and runs the login check. Returns the findings (empty for a read-only login);
        it changes nothing, whatever it finds.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived`, `409 not_a_database_source`
        (an upload source has no login to test), `422 host_not_allowed`,
        `502 source_unreachable`.
      operationId: testSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: The login check's findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSourceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          description: The host is not permitted - `host_not_allowed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/transfer:
    post:
      tags:
        - Sources
      summary: Transfer an upload source to another user
      description: |
        Makes `user_id` the owner, who is checked as a saved-query transfer target is (a known
        tereo user, not a service account, not the owner; `400 invalid_transfer`). The owner grants
        move to them (a grant they had becomes the owner grant), and the previous owner keeps an
        ordinary `all_columns` grant unless `keep_access` is false. The new owner's quota must fit
        the source (`409 quota_exceeded`). A `zeteo.source.transferred` audit entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: transferSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSourceRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Bad request - `invalid_request`, or `invalid_transfer`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived` (the upload source is deleted), or `quota_exceeded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/refresh:
    post:
      tags:
        - Catalogue
      summary: Refresh a source's catalogue
      description: |
        Reads the source's tables, views, columns and foreign keys and brings the catalogue up to
        date. New things are added; things no longer in the source get `missing_since` (and lose it
        if they return); a column whose type changed is updated in place. A refresh never deletes a
        row, changes an id or a description, or touches a declared relation. It sets the source's
        `status` to `active` and `last_refreshed_at`. If the source cannot be read the status
        becomes `unreachable`, the catalogue is left as it was and the answer is
        `502 source_unreachable`. An audit entry `zeteo.source.refreshed` carries the summary.
        See `docs/catalog.md`.

        **An upload source** is synced instead (Sync now): each of its Google Sheets tables that is
        not removed is read again and reloaded on its own. When at least one table synced (or there
        is nothing to load, such as a tab that is gone) the answer is `200` with a `SyncSummary`,
        which carries an `error` for each table that did not sync (the others still did): its `code`
        is the cause, such as `sheet_not_accessible`, `google_unavailable`,
        `google_sign_in_failed`, `cast_failed`, `empty_file`, `quota_exceeded` or `sync_failed`.
        When **every** table failed, the request fails with the **first** table's error instead
        (its status and code as listed under Errors), and no summary is returned. A table's failure
        is also recorded as its `sync_error`, and the source's `sync.failing` lists it. The request
        also fails when no sync can start: `409 nothing_to_sync` (the source has no Google Sheets
        table, live or missing), `429 sync_too_soon` (a second Sync now within a minute, with
        `Retry-After`; `nothing_to_sync` is answered before that window is taken) or
        `503 upload_source_busy` (the window is freed again).

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). An upload source's
        owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too.

        **Errors:** `404 not_found`, `404 uploads_not_configured` (an upload source), `409 source_archived`,
        `409 nothing_to_sync`, `429 sync_too_soon`, `503 upload_source_busy`; on an upload source, when
        every table failed, the first table's error: `422 sheet_not_accessible`, `422 cast_failed`,
        `422 empty_file` or an upload limit (`422 too_many_rows`, `422 too_many_columns`),
        `409 quota_exceeded`, `502 google_unavailable`, `502 google_sign_in_failed`,
        `404 google_not_configured`; on a database source `422 host_not_allowed` and
        `502 source_unreachable`.
      operationId: refreshSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: What the refresh changed (`RefreshSummary`), or for an upload source what the sync did (`SyncSummary`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefreshSummary'
                  - $ref: '#/components/schemas/SyncSummary'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `source_archived`; on an upload source `nothing_to_sync` (no Google Sheets table to sync) or `quota_exceeded` (every table failed, the first one's error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The host is not permitted - `host_not_allowed` (a database source); on an upload source, when every table failed, the first table's error (`sheet_not_accessible`, `cast_failed`, `empty_file`, `too_many_rows`, `too_many_columns`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - `sync_too_soon` (an upload source synced less than a minute ago), with `retry_after` and the `Retry-After` header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable` (a database source); on an upload source, when every table failed, `google_unavailable` or `google_sign_in_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/tables:
    get:
      tags:
        - Catalogue
      summary: List a source's tables
      description: |
        Lists tables and views in `schema_name`, `name` order. Tables a refresh no longer finds
        (`missing_since` set) are left out unless `include_missing=true`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
      operationId: listTables
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - name: include_missing
          in: query
          required: false
          description: Also list tables a refresh no longer finds
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Catalogue
      summary: Add tables to an upload source
      description: |
        Loads the chosen tables of the caller's staging into the upload source, each with an owner
        grant to the source's owner (also when an admin adds it). A table name the source already
        has is `409 name_taken`; the new data counts against the owner's quota (`409
        quota_exceeded`). The staging is used up on success. A `zeteo.source.tables_added` audit
        entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.

        **Files and spreadsheets mix:** the staging may be a file's or a spreadsheet's (`POST
        /v1/uploads/links` with this `source_id`); a spreadsheet's tabs become Sheets tables that
        sync with the source. A spreadsheet another unarchived source reads is `409 sheet_in_use`
        (it says nothing of whose; the source's own claim is fine), and a tab the source already
        has as a table is `409 tab_already_added`.
      operationId: addTables
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTablesRequest'
      responses:
        '201':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, `staging_not_found` (expired, missing or someone else's), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived`, `name_taken`, `quota_exceeded`, `sheet_in_use` or `tab_already_added` (a spreadsheet staging)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `cast_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/tables/{tableId}:
    get:
      tags:
        - Catalogue
      summary: Get a table
      description: |
        A table with its columns (in position order) and the relations that start at it, including
        declared ones and ones a refresh marked missing. A merged table of an upload source also
        carries `merged`: its members, its columns and the columns it does not carry. An upload
        source's table carries its `origin` and, for its owner and `zeteo.sources.read`, the
        `sync_error` of a Google Sheets table that failed to sync.

        **Upload-source owners:** the owner of an upload source is admitted here for its own tables
        and relations without `zeteo.sources.write`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `404 not_found` for an unknown table or one of another source.
      operationId: getTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Catalogue
      summary: Describe a table and its columns
      description: |
        Sets the table's description and the descriptions of named columns. A description is at
        most 2000 characters; `null` clears it. A refresh never changes a description. An audit
        entry `zeteo.source.updated` records the table and what changed.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `400 invalid_request` (a description too long, a column the table does not
        have, an empty body), `404 not_found`, `409 source_archived`.
      operationId: patchTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTableRequest'
      responses:
        '200':
          description: The table after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Catalogue
      summary: Load an upload source's table again
      description: |
        Replaces the table's data from a staged table. Columns are matched by normalized name:
        matched columns keep their id, grants and (unless the request sets one) type; new ones are
        added; absent ones get `missing_since` (one back again loses it). The swap is one
        transaction, so a reader sees the old data or the new, never an empty or partial table. A
        `zeteo.source.table_reuploaded` audit entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.

        **Only a file's table** is loaded again this way: a table that syncs from Google Sheets, a
        merged table, or a file's table given a staging of a spreadsheet is `409 not_a_file_upload`
        (a Sheets table follows its spreadsheet: use Sync now, `POST /v1/sources/{sourceId}/refresh`).
        A merged table is redefined with `PUT /v1/sources/{sourceId}/tables/{tableId}/merged`.
      operationId: reuploadTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReuploadTableRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source, or table in it), `staging_not_found` (expired, missing or someone else's), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived`, `quota_exceeded`, or `not_a_file_upload` (the table is not a file's, or the staging is a spreadsheet's)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `cast_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Catalogue
      summary: Remove a table from an upload source
      description: |
        Drops the table's data; its catalogue row and its columns stay, marked missing, and grants
        keep their references. A `zeteo.source.table_removed` audit entry is written.

        A Google Sheets table is removed the same way, also when a sync marked it missing (its tab
        was deleted): it is then marked removed, so a sync never brings it back, its tab can be added
        again as a new table, and the source's claim on the spreadsheet is released once no table
        uses it. A merged table is removed too (its view is dropped). A table that a live merged
        table of the source reads is `409 table_in_merged_table` (`merged_table` names it): edit or
        remove the merged table first.

        The table's measures are deleted with it, as are the metrics that use any of them; each is
        recorded as a `zeteo.measure.deleted` or `zeteo.metric.deleted` entry whose metadata names
        the table (`removed_with_table`), and the `table_removed` entry lists them
        (`measures_removed`, `metrics_removed`). A measure of another table that uses one of them (a
        fixed measure is usable from any table), directly or through others, would be left broken:
        the removal is then refused with `409 measure_in_use`, `dependents` naming those measures
        and the metrics using them, and nothing changes. Delete or change them first.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: deleteTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source, or table in it), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived`, `table_in_merged_table` (a live merged table reads it; `merged_table` names it), or `measure_in_use` (a measure of another table uses one of this table's; `dependents` names them)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/merged-tables:
    post:
      tags:
        - Catalogue
      summary: Create a merged table in an upload source
      description: |
        Creates a merged table from tables of the source.

        A merged table is a view of an upload source that stacks two or more of its other tables
        (its members; tables that are not merged themselves, whether from files or spreadsheets). A
        row of it is a row of one member, with `label_column` holding that member's `label`; the
        other columns are the members' columns matched by name (`from_name`), each included one
        under the name `name` and typed from its members (`text` where they disagree), a member
        without it giving null. It is a table like any other: it is granted, queried and joined, its
        `row_count` is the members' rows, and its view is made again whenever a member changes.
        The owner of the source gets an owner grant on a new one. A `zeteo.source.merged_table_saved`
        audit entry records the members and the number of columns (never any cell data).

        Checks, each `400 invalid_request` naming its field in `issues`: `name` and `label_column`
        are lowercase names; at least two members, each once, with a label of 1 to 100 characters
        different from the others'; every column's `from_name` given once, the included ones with
        names that differ from each other and from `label_column`, at least one included, and a
        `from_name` that some member has.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`; a deleted one is
        `409 source_archived`; `404 uploads_not_configured` while `UPLOADS_READER_URL` is unset.
      operationId: createMergedTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergedTableRequest'
      responses:
        '201':
          description: The merged table (its `merged` definition is on `GET /v1/sources/{sourceId}/tables/{tableId}`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: Bad request - `invalid_request`, with `issues`; a member that is not a table of the source (or is a merged table) is `members.N.table_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived` or `name_taken` (a table of the source has the name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (the source's load lock could not be taken in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/merged-tables/columns:
    get:
      tags:
        - Catalogue
      summary: The columns tables would give a merged table
      description: |
        For the merged table editor: the union of the columns of the given tables, matched by name
        and in order of first appearance, with the types the members give each (`type` is `text`
        when they disagree), and a suggested label for each member (the part of its spreadsheet's
        title or file's name the others do not share; the table names when titles repeat). A
        missing table counts by the columns it last had. Pass each table as `member`, repeated:
        `?member=<id>&member=<id>`, two to 100 of them, each a table of the source that is not
        merged (`400 invalid_request` otherwise).

        **Required permissions:** `zeteo.sources.read`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`;
        `404 uploads_not_configured` while `UPLOADS_READER_URL` is unset.
      operationId: getMergedColumns
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - name: member
          in: query
          required: true
          description: A table of the source to merge; repeat the parameter for each (2 to 100)
          style: form
          explode: true
          schema:
            type: array
            minItems: 2
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: The union of the members' columns and their suggested labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergedColumnsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/tables/{tableId}/merged:
    put:
      tags:
        - Catalogue
      summary: Replace a merged table's definition
      description: |
        Replaces the members, labels, label column, name and included columns of a merged table.
        The merged table keeps its id and its grants; a column keeps its id and grants by the member
        column it reads (`from_name`), and one no longer included is marked missing. A member that
        is missing may stay a member of it (it contributes no rows); another table must be a live
        table that is not merged. A table that is not a merged table of the source is `404 not_found`.

        A merged table is a view of an upload source that stacks two or more of its other tables
        (its members; tables that are not merged themselves, whether from files or spreadsheets). A
        row of it is a row of one member, with `label_column` holding that member's `label`; the
        other columns are the members' columns matched by name (`from_name`), each included one
        under the name `name` and typed from its members (`text` where they disagree), a member
        without it giving null. It is a table like any other: it is granted, queried and joined, its
        `row_count` is the members' rows, and its view is made again whenever a member changes.
        The owner of the source gets an owner grant on a new one. A `zeteo.source.merged_table_saved`
        audit entry records the members and the number of columns (never any cell data).

        Checks, each `400 invalid_request` naming its field in `issues`: `name` and `label_column`
        are lowercase names; at least two members, each once, with a label of 1 to 100 characters
        different from the others'; every column's `from_name` given once, the included ones with
        names that differ from each other and from `label_column`, at least one included, and a
        `from_name` that some member has.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`; a deleted one is
        `409 source_archived`.
      operationId: putMergedTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergedTableRequest'
      responses:
        '200':
          description: The merged table after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: Bad request - `invalid_request`, with `issues`; a member that is not a table of the source (or is a merged table) is `members.N.table_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source or merged table), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived` or `name_taken` (a table of the source has the name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (the source's load lock could not be taken in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/tables/{tableId}/columns/{columnId}:
    patch:
      tags:
        - Catalogue
      summary: Retype, rename or describe an upload source's column
      description: |
        Changes a column's type (the table is reloaded from its values; values that do not fit are
        `422 cast_failed`, naming the column and the first rows, numbered as 1-based data rows of
        the table, header not counted, in the order of its last load), its name (`409 name_taken`
        for one the table has), or its description. The column keeps its id and grants. A
        `zeteo.source.updated` audit entry is written.

        A merged table's column takes its type from its members: retyping one is `400
        invalid_request`; rename or describe it here, and change what it reads with `PUT
        /v1/sources/{sourceId}/tables/{tableId}/merged`.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: updateColumn
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
        - name: columnId
          in: path
          required: true
          description: The column's id. A value that is not a UUID is `400 invalid_request`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUploadColumnRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source, table or column), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived`, `name_taken`, or `quota_exceeded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `cast_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/relations:
    get:
      tags:
        - Catalogue
      summary: List a source's relations
      description: |
        Lists discovered and declared relations in creation order, including ones a refresh marked
        missing (`missing_since`).

        **Upload-source owners:** the owner of an upload source is admitted here for its own tables
        and relations without `zeteo.sources.write`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
      operationId: listRelations
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of relations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRelationsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Catalogue
      summary: Declare a relation
      description: |
        Adds a relation the database does not enforce with a foreign key. Both tables must belong to
        this source; the column lists must have the same length, name present columns, and pair
        columns of the same normalised type that is not `other` or `json`. The name is unique on
        the from table, whether the other relation is discovered or declared. An audit entry
        `zeteo.relation.declared` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `404 not_found` (the source), `409 relation_name_taken`, `409 source_archived`,
        `422 invalid_relation`.
      operationId: declareRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareRelationRequest'
      responses:
        '201':
          description: The declared relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The relation is not valid - `invalid_relation`; the description says which check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/relations/{relationId}:
    patch:
      tags:
        - Catalogue
      summary: Rename a relation
      description: |
        Renames a discovered or a declared relation. The name follows the declared-name rules and
        must be free on the relation's from table, whether the other relation is discovered or
        declared. A discovered relation renamed this way keeps its name across refreshes; the others
        take the name the naming rules give them at every refresh. An audit entry
        `zeteo.relation.renamed` is written.

        **Upload-source owners:** the owner of an upload source is admitted here for its own tables
        and relations without `zeteo.sources.write`.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `400 invalid_request`, `404 not_found` (also a relation of another source),
        `409 relation_name_taken`, `409 source_archived`.
      operationId: updateRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/RelationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRelationRequest'
      responses:
        '200':
          description: The renamed relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Catalogue
      summary: Remove a declared relation
      description: |
        Removes a declared relation. A discovered relation comes from a foreign key and cannot be
        removed. An audit entry `zeteo.relation.removed` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `404 not_found` (also a relation of another source), `409 relation_discovered`,
        `409 source_archived`.
      operationId: deleteRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/RelationIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/measures:
    get:
      tags:
        - Measures
      summary: List a source's measures
      description: |
        The measures of the source as the caller may see them. Those who see every measure
        (`zeteo.sources.read`, or the owner of an upload source) get each in full, with whether the
        caller can use it (`usable`) and whether it is `broken`. Anyone else gets the ones that plan
        against their own visible catalogue, in full: a measure whose home table, columns or relations
        they are not granted is absent. A measure editor also sees the ones they cannot use, redacted
        (name, description, home table and `usable: false`, never the formula or filter). Editors and
        those who see every measure get `used_by`. `can_edit` and `can_manage_editors` say whether the
        caller may change the measures and their editors.

        A source the caller has nothing of is `404 not_found`.

        **Required permissions:** `zeteo.data.read`, `zeteo.sources.read` or `zeteo.measures.write` (`403 forbidden` without).
      operationId: listMeasures
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: The measures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMeasuresResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Measures
      summary: Create a measure
      description: |
        Saves a measure: a named, described calculation over a home table, such as total revenue or
        average order value, which a query then asks for by name (`{ "measure": "total_revenue" }`).
        The draft is checked twice. It is planned alone from its home table against the editor's own
        catalogue (so an editor cannot define a measure over columns they are not granted), first its
        formula, then with its `where`; and, with every measure that uses it, against the source's whole
        catalogue. A `zeteo.measure.created` audit entry is written.

        Everything is checked inside one transaction that holds a lock on the source's measures, so
        concurrent saves cannot form a loop.

        **Required permissions:** `zeteo.measures.write`, and being an editor of the source (listed
        as a user or through a group, or the owner of the upload source); `403 forbidden` otherwise,
        also for a source that does not exist when the caller cannot read sources.

        **Errors:** `400` with `error` the query error code of the first problem and `path`
        (`not_found_or_not_accessible` for a table or column the editor cannot see,
        `measure_not_aggregate` for a formula with a column outside an aggregate, `measure_cycle`,
        `measure_too_deep`, `too_complex`, `invalid_operator`, ...); `404 not_found` (source);
        `409 measure_name_taken`, `409 source_archived`.
      operationId: createMeasure
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeasureRequest'
            example:
              name: net_revenue
              description: Revenue of paid orders after discounts, before tax. Use for the money the business keeps; use total_revenue for the gross figure.
              table: orders
              formula:
                sum:
                  sub:
                    - total
                    - discount
              where:
                status:
                  eq: paid
      responses:
        '201':
          description: The measure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measure'
        '400':
          description: |
            Bad request - `invalid_request`, with `issues`; or the measure does not plan, with the
            query error code of the problem and the `path` at fault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidMeasureError'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/measures/preview:
    post:
      tags:
        - Measures
      summary: Preview a draft measure
      description: |
        Runs a draft measure, not saved, over its home table, so an editor can check the number
        before saving: its value alone as one row, or, with `bucket`, grouped by a date bucket of a
        column of the home table and ordered by period (the period column is `period`, or
        `period_start` for a measure named `period`). The draft is checked as on create, and then
        runs as a normal query as the caller, with the same limits, the same concurrency leases and
        a record in the run log with entry point `measure_preview`. A client that disconnects stops
        its query on the source.

        **Required permissions:** `zeteo.measures.write` and `zeteo.data.read` (`403 forbidden`
        without), and being an editor of the source.

        **Errors:** `400` as on create; `404 not_found`; `409 source_archived`; the query errors of
        `POST /v1/query` (`422`, `429`, `502`, `503`).
      operationId: previewMeasure
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewMeasureRequest'
            example:
              measure:
                name: total_revenue
                description: Gross revenue of paid orders.
                table: orders
                formula:
                  sum: total
                where:
                  status:
                    eq: paid
              bucket:
                unit: month
                column: created_at
      responses:
        '200':
          description: The rows, as `POST /v1/query` answers them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          description: |
            Bad request - `invalid_request`, with `issues`; or the measure does not plan, with the
            query error code of the problem and the `path` at fault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidMeasureError'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `source_archived`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The query cannot be run as written; the errors of `POST /v1/query`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '429':
          description: Too many queries - `too_many_queries` or `source_busy`; retry after `Retry-After`
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `query_failed` or `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/measures/{measureId}:
    get:
      tags:
        - Measures
      summary: Get a measure
      description: |
        One measure in full, to a caller who may see it in full: those who see every measure
        (`zeteo.sources.read`, or the owner of an upload source), and anyone it plans against the
        catalogue of. Anyone else gets the `404 not_found` a measure that does not exist gives.

        **Required permissions:** `zeteo.data.read`, `zeteo.sources.read` or `zeteo.measures.write` (`403 forbidden` without).
      operationId: getMeasure
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
