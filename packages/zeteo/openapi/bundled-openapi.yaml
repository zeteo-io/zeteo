  /v1/calendar:
    get:
      tags:
        - Calendar
      summary: Get the calendar
      description: |
        The one calendar of the install: working days, holidays, the month a fiscal year starts in
        and the time zone. Until an admin saves one, the defaults are Monday to Friday, no holidays,
        January and `UTC`, and `updated_at` is null.

        The calendar shapes queries: a business day is a working weekday that is not a holiday (the
        `businessDays*` operations); the fiscal buckets, relative units and `datePart` parts follow
        the fiscal year; and "now" for every relative date (in `where`, a measure's filter, the
        calendar functions and a dashboard's time range) is evaluated in the time zone, so
        `{ "unit": "day", "offset": -1, "startOf": true }` is the start of yesterday there. Buckets
        and `datePart` read a timestamp as its date in that zone too, so ranges and buckets agree.
        The calendar's values are folded into each plan as bound
        literals, so a change reaches dashboard results without any invalidation.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: getCalendar
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Calendar
      summary: Replace the calendar
      description: |
        Replaces the whole calendar (working days, holidays, fiscal year start month and time zone)
        and answers the calendar as it now stands. At most 5,000 holidays, each date once; the body
        may be up to 512 KB. A `zeteo.calendar.updated` audit entry is written.

        **Required permissions:** `zeteo.calendar.write` (`403 forbidden` without).
      operationId: replaceCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarInput'
            example:
              working_days:
                - 1
                - 2
                - 3
                - 4
                - 5
              holidays:
                - date: '2026-12-25'
                  name: Christmas Day
              fiscal_year_start_month: 7
              time_zone: America/Chicago
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/grants:
    get:
      tags:
        - Grants
      summary: List grants
      description: |
        Lists grants in creation order, optionally only those of one principal, table or source.
        Each grant's `principal_status` is looked up once per distinct principal.

        **Upload source owners:** the owner of an upload source is admitted here for grants on its own
        tables (and `source_id` filters to a source they own) without `zeteo.grants.*`; for anyone
        else's table, or a database source's, the answer is the same `403 forbidden` as ever. An
        owner's `group` grants must be to groups that are global or of their signed-in organization
        (`422 group_not_allowed`; saved-query shares answer `400 invalid_share` instead, a deliberate
        difference). The owner's own grant has `owner_grant: true` and cannot be removed or narrowed
        (`409 owner_grant_locked`).

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).
      operationId: listGrants
      parameters:
        - name: principal_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PrincipalType'
        - name: principal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: table_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: source_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGrantsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Grants
      summary: Create a grant
      description: |
        Grants a user or group the right to query a table: every column, or a list of columns of
        that table, and which rows: `row_access` is `unlimited_default` (the default: never widens
        rows when another grant limits them), `all` (every row, overriding other grants' limits) or
        `rule` (with a `row_rule`, and optionally a `row_rule_description`). An upload owner's own
        grant is always `unlimited_default`. The principal need not exist yet. A principal has one
        grant per table. An audit entry `zeteo.grant.created` is written, carrying the rule. See
        `docs/row-rules.md`.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `400 invalid_row_rule` (the rule is not valid: `path` points into the body,
        starting `row_rule`), `404 not_found` (the table), `409 source_archived`, `409 grant_exists`,
        `422 invalid_grant` (a column that is not on the table).
      operationId: createGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
      responses:
        '201':
          description: The grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The grant is not valid - `invalid_grant`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/grants/{grantId}:
    get:
      tags:
        - Grants
      summary: Get a grant
      description: |
        **Upload source owners:** the owner of an upload source is admitted here for grants on its own
        tables (and `source_id` filters to a source they own) without `zeteo.grants.*`; for anyone
        else's table, or a database source's, the answer is the same `403 forbidden` as ever. An
        owner's `group` grants must be to groups that are global or of their signed-in organization
        (`422 group_not_allowed`; saved-query shares answer `400 invalid_share` instead, a deliberate
        difference). The owner's own grant has `owner_grant: true` and cannot be removed or narrowed
        (`409 owner_grant_locked`).

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `404 not_found`.
      operationId: getGrant
      parameters:
        - $ref: '#/components/parameters/GrantIdParam'
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Grants
      summary: Replace a grant's columns and rows
      description: |
        Replaces the grant's columns and rows whole: every column, or exactly the listed ones, and
        `row_access` with its `row_rule` and `row_rule_description`. `row_access` is required, with
        no default, so a body of columns only is `400 invalid_request` and cannot drop a rule by
        accident. The principal and table of a grant never change; remove the grant and create
        another for that. An audit entry `zeteo.grant.updated` is written, carrying the rule.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `400 invalid_row_rule` (`path` into the body, starting `row_rule`), `404 not_found`, `409 source_archived`, `422 invalid_grant`.
      operationId: replaceGrant
      parameters:
        - $ref: '#/components/parameters/GrantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceGrantRequest'
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The grant is not valid - `invalid_grant`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Grants
      summary: Remove a grant
      description: |
        Removes the grant and its columns, also when its source is archived. An audit entry
        `zeteo.grant.removed` is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `404 not_found`.
      operationId: deleteGrant
      parameters:
        - $ref: '#/components/parameters/GrantIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/grants/effective:
    get:
      tags:
        - Grants
      summary: Show one user's effective access to one table
      description: |
        What the user gets of the table over every grant reaching them (their own and their groups'):
        the columns, the rows (`all`, `limited` or `none`), the combined rule in words naming every
        column, the grants it comes from, and warnings an admin should look at: an `all` grant
        overriding another grant's rule, a rule's identity key the user holds no value for, a rule
        that cannot be applied, and a merged table whose members carry rules the table itself does
        not. Groups scoped to an organization count only when `organization_id` is given. Asks tereo
        for the user's groups and is never cached.

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `400 invalid_request`, `404 not_found` (the table), `502 tereo_unreachable`.
      operationId: getEffectiveAccess
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: table_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: false
          description: Count this organization's groups as if the user were signed in to it; absent, global groups only
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveAccess'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`, tereo did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/identity-keys:
    get:
      tags:
        - Grants
      summary: List identity keys
      description: |
        Every identity key, by name, in one page (`next_cursor` is always null). A caller with
        `zeteo.grants.read` gets each key in full (`IdentityKey`, with its `value_count`); an upload
        source owner holding `zeteo.uploads.write` alone gets only `name`, `label` and `description`,
        enough to name a key in a rule on their own source's grants, never any value.

        **Required permissions:** `zeteo.grants.read` or `zeteo.uploads.write` (`403 forbidden` without).
      operationId: listIdentityKeys
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIdentityKeysResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Grants
      summary: Create an identity key
      description: |
        Creates a named key under which users hold identity values (`netsuite_employee_id`,
        `display_name`), for rules that match a column against the caller's own values. An audit
        entry `zeteo.identity_key.created` is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `400 invalid_request`, `409 conflict` (the name is taken).
      operationId: createIdentityKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityKeyRequest'
      responses:
        '201':
          description: The key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityKey'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/identity-keys/{keyId}:
    patch:
      tags:
        - Grants
      summary: Change an identity key's label or description
      description: |
        Changes the label, the description or both; `null` clears the description. The name never
        changes. An audit entry `zeteo.identity_key.updated` is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `400 invalid_request`, `404 not_found`.
      operationId: updateIdentityKey
      parameters:
        - $ref: '#/components/parameters/IdentityKeyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentityKeyRequest'
      responses:
        '200':
          description: The key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityKey'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Grants
      summary: Delete an identity key
      description: |
        Deletes the key and every value under it. Refused while a grant's rule names it
        (`409 identity_key_in_use`, with the `grant_ids`). An audit entry
        `zeteo.identity_key.removed` is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 identity_key_in_use`.
      operationId: deleteIdentityKey
      parameters:
        - $ref: '#/components/parameters/IdentityKeyIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/identity-keys/{keyId}/values:
    get:
      tags:
        - Grants
      summary: List the values under an identity key
      description: |
        Lists values in creation order, optionally only one user's.

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `400 invalid_request`, `404 not_found` (the key).
      operationId: listIdentityValues
      parameters:
        - $ref: '#/components/parameters/IdentityKeyIdParam'
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIdentityValuesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Grants
      summary: Add values under an identity key
      description: |
        Adds up to 1,000 (user, value) pairs in one call, all or none. A user may hold several values
        under a key; a value belongs to one user within its key. Matching is exact: nothing is
        trimmed or case-folded. An audit entry `zeteo.identity_value.added` is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `400 invalid_request`, `404 not_found` (the key), `409 identity_value_taken`
        (another user holds the value; `value` names it).
      operationId: addIdentityValues
      parameters:
        - $ref: '#/components/parameters/IdentityKeyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIdentityValuesRequest'
      responses:
        '201':
          description: The values added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddIdentityValuesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/identity-keys/{keyId}/values/{valueId}:
    delete:
      tags:
        - Grants
      summary: Remove an identity value
      description: |
        Removes one value. The user's rows that depended on it are hidden from the next query on
        (rules read values at plan time). An audit entry `zeteo.identity_value.removed` is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `404 not_found`.
      operationId: deleteIdentityValue
      parameters:
        - $ref: '#/components/parameters/IdentityKeyIdParam'
        - $ref: '#/components/parameters/IdentityValueIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/identity-keys/{keyId}/missing:
    get:
      tags:
        - Grants
      summary: List users who hold no value under an identity key
      description: |
        The users that a grant whose rule uses the key reaches (directly, or through a group's
        members, read from tereo) who hold no value under it, each with the grants that reach them.
        Their rule matches no rows until they are given one. Never cached.

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `404 not_found` (the key), `502 tereo_unreachable`.
      operationId: listMissingIdentityValues
      parameters:
        - $ref: '#/components/parameters/IdentityKeyIdParam'
      responses:
        '200':
          description: The users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingIdentityValuesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`, tereo did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/principal-limits:
    get:
      tags:
        - Grants
      summary: List users' and groups' concurrency limits
      description: |
        Lists the rows in creation order, optionally only those of one principal type or id. Each
        row's `principal_status` is looked up once per distinct principal.

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).
      operationId: listPrincipalLimits
      parameters:
        - name: principal_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PrincipalType'
        - name: principal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of limits rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPrincipalLimitsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Grants
      summary: Give a user or group its own concurrency limits
      description: |
        Gives one user (a service account included) or group its own limits on queries and exports
        at once, in place of `USER_QUERY_CONCURRENCY` and `USER_EXPORT_CONCURRENCY`. Each limit
        applies apart, as each run starts: the user's own row if it sets that limit, else the
        highest among their groups' rows, else the environment's default. The principal need not
        exist yet. A principal has at most one row. An audit entry `zeteo.principal_limit.created`
        is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `400 invalid_request` (neither limit, or one out of range), `409 conflict` (the
        principal already has a row).
      operationId: createPrincipalLimit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrincipalLimitRequest'
            example:
              principal_type: group
              principal_id: 0193f1c2-7a4e-7c3d-9b1a-2f6e8d0c4b5a
              query_concurrency: 10
      responses:
        '201':
          description: The row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLimit'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          description: Conflict - `conflict`, the principal already has limits; change them with `PATCH`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/principal-limits/{principalLimitId}:
    get:
      tags:
        - Grants
      summary: Get a user's or group's concurrency limits
      description: |
        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `404 not_found`.
      operationId: getPrincipalLimit
      parameters:
        - $ref: '#/components/parameters/PrincipalLimitIdParam'
      responses:
        '200':
          description: The row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLimit'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Grants
      summary: Change a user's or group's concurrency limits
      description: |
        Changes either limit or both; `null` clears one. A change that would leave neither set is
        refused: remove the row instead. The principal never changes. The change applies to the
        runs that start after it. An audit entry `zeteo.principal_limit.updated` is written, with
        the values before it under `previous`.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `400 invalid_request`, `404 not_found`.
      operationId: updatePrincipalLimit
      parameters:
        - $ref: '#/components/parameters/PrincipalLimitIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrincipalLimitRequest'
      responses:
        '200':
          description: The row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLimit'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Grants
      summary: Remove a user's or group's concurrency limits
      description: |
        Removes the row; the principal falls back to its groups' rows or the environment's
        defaults for the runs that start after it. An audit entry `zeteo.principal_limit.removed`
        is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `404 not_found` (also for the losers of concurrent removals of one row).
      operationId: deletePrincipalLimit
      parameters:
        - $ref: '#/components/parameters/PrincipalLimitIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/principals:
    get:
      tags:
        - Grants
      summary: Search tereo's users or groups by name
      description: |
        Finds users (human ones, by name or email) or groups (by name) whose text contains `q`, at
        most `limit`, for choosing who a grant or limit is for. Each caller may search 60 times a
        minute; over it the answer is `429 too_many_requests` with `Retry-After`.

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `400 invalid_request` (`q` not 2 to 100 characters, `limit` outside 1 to 25, an
        unknown `type` or query key), `429 too_many_requests`, `502 tereo_unreachable`.
      operationId: searchPrincipals
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PrincipalType'
        - name: q
          in: query
          required: true
          description: Text the name (or a user's email) contains, case-insensitively
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDirectoryPrincipalsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          description: Too many requests - `too_many_requests`; retry after `Retry-After` seconds
          headers:
            Retry-After:
              description: Seconds to wait before searching again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`, tereo did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/principals/lookup:
    post:
      tags:
        - Grants
      summary: Look up users and groups of tereo by id
      description: |
        Answers one principal per requested one, in the request's order; a repeated one is answered
        once. A user or group tereo does not have is `orphaned`, with no name. Not counted against
        the search limit for an admin (`zeteo.grants.read` or `zeteo.runs.read`).

        **Required permissions:** `zeteo.grants.read` or `zeteo.runs.read`, or
        `zeteo.uploads.write` with `zeteo.data.read` (`403 forbidden` without). A caller let in
        only by the latter, an upload source owner, is answered only for the principals holding a grant
        on an upload source they own; any other id comes back as one tereo does not know (`orphaned`).
        Their lookups count against the search limit (`429 too_many_requests`).

        **Errors:** `400 invalid_request` (not 1 to 100 principals, an id that is no UUID),
        `502 tereo_unreachable`.
      operationId: lookupPrincipals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupPrincipalsRequest'
            example:
              principals:
                - type: user
                  id: 0193f1c2-7a4e-7c3d-9b1a-2f6e8d0c4b5a
      responses:
        '200':
          description: The principals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDirectoryPrincipalsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`, tereo did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/principals/all:
    get:
      tags:
        - Grants
      summary: List every user and group
      description: |
        Every user (service accounts included) and every live group in tereo, by name (one without
        a name last), for an admin's "who" filters: at most 5000 users and 5000 groups, with
        `truncated` true when there were more. Read page by page from tereo on each call and never
        cached. Counts against the caller's 60 searches a minute, as `GET /v1/principals` does.

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `400 invalid_request` (any query parameter), `429 too_many_requests`,
        `502 tereo_unreachable`.
      operationId: listAllPrincipals
      responses:
        '200':
          description: The directory, by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllDirectoryPrincipalsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          description: Too many requests - `too_many_requests`; retry after `Retry-After` seconds
          headers:
            Retry-After:
              description: Seconds to wait before asking again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`, tereo did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/catalog:
    get:
      tags:
        - Queries
      summary: Discover what you can query
      description: |
        The sources, tables, columns and relations the caller may query, and the query language's
        JSON Schema. It shows exactly what the caller's grants (their own and their groups') allow
        and nothing more: no ids, no native types, no connection settings, and no hint of a table,
        column, relation or source they are not granted. A relation is listed only when every key
        column on both sides is granted.

        Without `source`, every source the caller has a grant on, ordered by slug. A `source` that
        is unknown, archived, or not granted answers an empty `sources`, as a caller with no grants
        gets. Names are written as a query would write them.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: getCatalog
      parameters:
        - name: source
          in: query
          required: false
          description: The slug of one source
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: The caller's visible catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/query:
    post:
      tags:
        - Queries
      summary: Run a query
      description: |
        Runs a query over the tables and columns the caller is granted, directly or through a
        group, and answers its rows. A table, column, relation or source the caller is not granted
        is refused exactly as one that does not exist: `422 not_found_or_not_accessible`, with the
        same message, path and suggestions, which are drawn only from names the caller can see.

        The body must be an object with a `source`; a source the caller cannot see is refused
        before the rest of the body is read. Every query past that check is recorded in the run
        log with a `zeteo.query.run` audit entry, refused and failed ones included; rows are sent
        only once their run is recorded. A client that disconnects stops its query on the source.

        Limits: 1,000 rows unless `limit` says otherwise, at most 50,000 or the source's row cap;
        10 MB of rows; the source's time limit; per user `USER_QUERY_CONCURRENCY` queries at once
        (default 5) unless the user or one of their groups has its own limit
        (`/v1/principal-limits`), and per source its `query_concurrency` (default 5). The response
        says when rows were left out. See `docs/querying.md`.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: runQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
            example:
              source: sales-db
              from: orders
              join:
                - customers
              select:
                - customers.region
                - bucket: month
                  column: created_at
                  as: month
                - sum: total
                  as: revenue
              where:
                status:
                  in:
                    - paid
                    - shipped
              groupBy:
                - customers.region
                - month
              having:
                revenue:
                  gt: 1000
              orderBy:
                - revenue: desc
              limit: 1000
      responses:
        '200':
          description: The rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          description: |
            Bad request - `invalid_request`, with `issues`: the body is not an object with a
            non-empty string `source`; a string or key anywhere in it holds NUL or ill-formed Unicode
            (a lone UTF-16 surrogate); or the source's language refuses it. None of these is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `uploads_not_configured`, an upload source (`upload`) queried while Uploads are turned off (`UPLOADS_READER_URL` unset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `source_archived`, the source was archived while the query ran, or `row_rule_unavailable`, a table it reads has a row rule of the caller's that cannot be applied right now (a column it reads is gone, or too many values), so ask an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: |
            The query cannot be run as written - `not_found_or_not_accessible` (at path `["source"]`
            for a source), `missing_in_source`, `column_not_queryable`, `invalid_operator`,
            `invalid_value`, `invalid_grouping`, `invalid_order`, `invalid_having`,
            `duplicate_output_name`, `join_parent_missing`, `too_many_joins` (at path `["join"]`: more joins than the source's
            `max_joins`); `too_many_parameters` (at path `[]`: the
            compiled query binds more values than the source's engine takes). The measure codes, at the
            measure's path: `measure_needs_single_rows` (a query that joins a to-many relation uses a
            measure), `measure_reads_to_many`, `measure_cycle`, `measure_too_deep`,
            `measure_not_aggregate` and `too_complex` (the expansion holds more than 500 operations). A plan
            that references a column outside the grants (a planner fault, logged) is
            `not_found_or_not_accessible` with a fixed message and path `[]`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '429':
          description: |
            Too many queries - `too_many_queries` (the caller already runs as many as their limit)
            or `source_busy` (the source already runs its `query_concurrency`); retry after
            `Retry-After`. The body's `retry_after` repeats it, and the message states the limit.
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: |
            Bad gateway - `query_failed` (the source could not run the query) or
            `source_unreachable`. The database's own error text is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Service unavailable - `temporarily_unavailable`: Redis, group membership or the source's
            pool briefly unavailable (the source busy). Retry, after `Retry-After` when given. Or
            `uploads_misconfigured`: an upload source while `UPLOADS_READER_URL` cannot be used
            (the operator's to fix; the detail is logged). Or `row_rule_unavailable`: a table it reads has a row rule of the caller's with `below`, and Tereo cannot give the caller's reporting lines now; retry shortly (never the caller's own rows only, never every row).
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway timeout - `query_timeout`, the query ran past the source's time limit and was stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/export:
    post:
      tags:
        - Queries
      summary: Export a query's result
      description: |
        Runs a query, with the same body as `POST /v1/query`, and streams its rows as NDJSON
        (`?format=ndjson`, the default) or CSV (`?format=csv`), up to the source's
        `export_row_cap`, from a source whose `export_enabled` is true. The stream is gzipped when
        `Accept-Encoding` accepts gzip.

        Everything that refuses a query refuses an export the same way, before any byte of the
        stream: a table, column, relation or source the caller is not granted is
        `422 not_found_or_not_accessible`, as one that does not exist. Once the status line is sent
        no error body can follow; a failure then cuts the connection without the stream's last
        chunk.

        **Ends.** NDJSON's first line is `{ columns, warnings, run_id }`, each row is a JSON array
        in the order of `columns`, and the last line is `{ "status": "complete" | "truncated",
        "rows": n }` (`truncated`: more rows existed than the cap). CSV is a header record and
        CRLF-terminated records, with the same status and count in the HTTP trailers
        `X-Zeteo-Export-Status` and `X-Zeteo-Export-Rows`. A stream with no last line (NDJSON) or
        no trailers (CSV) did not end: it was cut. Verify completeness with NDJSON: trailers are
        invisible to browsers and to HTTP/1.0 clients and may be dropped by proxies.

        **Order.** An export has no default order: without `orderBy` rows come in whatever order
        the source makes them, and a capped export is an arbitrary subset. `offset` above 0 needs
        an `orderBy` (`422 invalid_order` at path `["offset"]`).

        **CSV text.** A text, json or `other` cell starting with `=`, `+`, `-`, `@`, tab or CR is written
        with a leading `'`, so spreadsheets read it as text; CSV is therefore not byte-exact.
        NDJSON is.

        **Limits.** 10 minutes from the start to the last row, time waiting on the client
        included; per user `USER_EXPORT_CONCURRENCY` exports at once (default 1, or the user's
        own limit), per source its `export_concurrency`, counted apart from queries. No byte cap.

        **Record.** A refused export is recorded as a refused query is, with entry point `export`
        and a `zeteo.export.run` audit entry. One that starts is recorded as `running` with a
        `zeteo.export.started` entry before its head is sent, and closed with a `zeteo.export.run`
        entry when it ends. See `docs/export.md`.

        **Required permissions:** `zeteo.data.export` (`403 forbidden` without).
      operationId: exportQuery
      parameters:
        - name: format
          in: query
          required: false
          description: The stream's format. Any other query parameter is `400 invalid_request`.
          schema:
            type: string
            enum:
              - ndjson
              - csv
            default: ndjson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
            example:
              source: sales-db
              from: orders
              select:
                - id
                - status
                - total
                - created_at
              where:
                status:
                  eq: paid
              orderBy:
                - id: asc
      responses:
        '200':
          description: The stream
          headers:
            Content-Disposition:
              description: '`attachment; filename="zeteo-export-<run id>.<format>"`'
              schema:
                type: string
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
            X-Zeteo-Run-Id:
              description: The run's id in the run log
              schema:
                type: string
                format: uuid
            X-Zeteo-Rows-Limited:
              description: '`true` when a row rule of the caller''s limited the rows of a table the query reads; absent otherwise'
              schema:
                type: string
                enum:
                  - 'true'
            Vary:
              description: '`Accept-Encoding`'
              schema:
                type: string
            Content-Encoding:
              description: '`gzip` when the request accepts gzip (`gzip` or `*` with a q above 0); absent otherwise'
              schema:
                type: string
                enum:
                  - gzip
            Trailer:
              description: 'CSV only: `X-Zeteo-Export-Status, X-Zeteo-Export-Rows`, the trailers sent after the last record'
              schema:
                type: string
            X-Zeteo-Warnings:
              description: 'CSV only, when the query has warnings: their codes, comma separated (`join_multiplies_rows`). NDJSON carries them in its first line.'
              schema:
                type: string
            X-Zeteo-Export-Status:
              description: 'CSV only, an HTTP trailer: `complete` or `truncated`. Absent when the stream was cut.'
              schema:
                type: string
                enum:
                  - complete
                  - truncated
            X-Zeteo-Export-Rows:
              description: 'CSV only, an HTTP trailer: the rows sent'
              schema:
                type: integer
          content:
            application/x-ndjson:
              schema:
                type: string
                description: |
                  Lines of JSON, each ending in `\n`: first `{ "columns": [{ "name", "type" }],
                  "warnings": [...], "run_id": "<uuid>" }`, then one array per row with its values in
                  the wire forms of `POST /v1/query`, last `{ "status": "complete" | "truncated",
                  "rows": <count> }`.
              example: |
                {"columns":[{"name":"id","type":"number"},{"name":"status","type":"text"}],"warnings":[],"run_id":"0193f1c2-7a4e-7c3d-9b1a-2f6e8d0c4b5a"}
                [1,"paid"]
                [2,"paid"]
                {"status":"complete","rows":2}
            text/csv:
              schema:
                type: string
                description: |
                  RFC 4180, UTF-8, CRLF line ends: a header record of the column names, then one record
                  per row. A null is an empty field and an empty string `""`; numbers, booleans,
                  dates and timestamps are written as their wire forms; json as its JSON text. Text
                  and json starting with `=`, `+`, `-`, `@`, tab or CR get a leading `'`.
              example: "id,status\r\n1,paid\r\n2,paid\r\n"
        '400':
          description: |
            Bad request - `invalid_request`, with `issues`: an unknown `format` or query parameter;
            the body is not an object with a non-empty string `source`; a string or key in it holds
            NUL or ill-formed Unicode; or the source's language refuses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          description: |
            Forbidden - `forbidden` (the token lacks `zeteo.data.export`) or `export_not_enabled`
            (the source's exports are off, or its `export_row_cap` is 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `source_archived`, the source was archived as the export started, or `row_rule_unavailable`, a table it reads has a row rule of the caller's that cannot be applied right now (a column it reads is gone, or too many values), so ask an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: |
            The query cannot be run as written - the codes of `POST /v1/query`, and
            `invalid_order` at path `["offset"]` for an `offset` above 0 without an `orderBy`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '429':
          description: |
            Too many exports - `too_many_exports` (the caller's own export limit is reached) or
            `source_busy` (the source's `export_concurrency` is); retry after `Retry-After`
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: |
            Bad gateway - `query_failed` or `source_unreachable`, before the stream starts (its head). The
            database's own error text is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Service unavailable - `temporarily_unavailable`: Redis, group membership or the source's
            pool briefly unavailable, or the service is shutting down (an export refused for that
            is not recorded). Retry, after `Retry-After` when given. Or `uploads_misconfigured`:
            an upload source while `UPLOADS_READER_URL` cannot be used (the detail is logged). A
            upload source exported while Uploads are off is `404 uploads_not_configured`. Or
            `row_rule_unavailable`: a table it reads has a row rule of the caller's with `below`, and Tereo cannot give the caller's reporting lines now; retry shortly (never the caller's own rows only, never every row).
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway timeout - `query_timeout`, the export's time ran out before the stream started (its head)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/runs:
    get:
      tags:
        - Queries
      summary: List query runs
      description: |
        The run log, newest first: every query past the shape check, from any entry point, with
        its outcome. A run holds the query as sent, never its rows.

        **Required permissions:** `zeteo.runs.read` (`403 forbidden` without).
      operationId: listRuns
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: source_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: saved_query_id
          in: query
          required: false
          description: Only the runs of this saved query.
          schema:
            type: string
            format: uuid
        - name: outcome
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RunOutcome'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/me/runs:
    get:
      tags:
        - Queries
      summary: List the caller's own query runs
      description: |
        The caller's own runs, newest first, from any entry point. A run of a saved query carries
        `saved_query` while the caller owns it or it is shared with them. A saved query run that was
        refused (`saved_query_not_accessible`) shows with its query withheld (`{ "withheld": true }`)
        and `source_id: null`. So is a run of a saved query the caller cannot open (it is not theirs,
        not shared with them, and they hold no `zeteo.saved_queries.read`), such as a panel of someone
        else's dashboard run as the caller: the run is theirs, the query is not. A run from a
        dashboard has entry point `dashboard`. The response is not cached.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: listMyRuns
      parameters:
        - name: saved_query_id
          in: query
          required: false
          description: Only the caller's own runs of this saved query.
          schema:
            type: string
            format: uuid
        - name: outcome
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RunOutcome'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/me/principals:
    get:
      tags:
        - Saved queries
      summary: Search users or groups to share a saved query with
      description: |
        Finds users (human ones, by name or email) or groups (by name) whose text contains `q`, at
        most `limit`: groups that are global or of the caller's signed-in organization. The caller's
        own searches are limited as `GET /v1/principals`'s are (60 a minute). The response is not
        cached.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).

        **Errors:** `400 invalid_request` (`q` not 2 to 100 characters, `limit` outside 1 to 25, an
        unknown `type` or query key), `429 too_many_requests`, `502 tereo_unreachable`.
      operationId: searchMyPrincipals
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PrincipalType'
        - name: q
          in: query
          required: true
          description: Text the name (or a user's email) contains, case-insensitively
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDirectoryPrincipalsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          description: Too many requests - `too_many_requests`; retry after `Retry-After` seconds
          headers:
            Retry-After:
              description: Seconds to wait before searching again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`, tereo did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me/principals/all:
    get:
      tags:
        - Saved queries
      summary: List every user and group the caller may share with
      description: |
        Every human user, and every live group that is global or of the caller's signed-in
        organization, by name (one without a name last): at most 5000 users and 5000 groups, with
        `truncated` true when there were more. Read page by page from tereo on each call and never
        cached. Counts against the caller's 60 searches a minute, as `GET /v1/me/principals` does.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).

        **Errors:** `400 invalid_request` (any query parameter), `429 too_many_requests`,
        `502 tereo_unreachable`.
      operationId: listAllMyPrincipals
      responses:
        '200':
          description: The directory, by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllDirectoryPrincipalsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          description: Too many requests - `too_many_requests`; retry after `Retry-After` seconds
          headers:
            Retry-After:
              description: Seconds to wait before asking again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`, tereo did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/uploads:
    post:
      tags:
        - Uploads
      summary: Upload a CSV or xlsx file to staging
      description: |
        Sends one file as `multipart/form-data` in the field `file`. Zeteo parses it once into a
        staging area and returns a preview (tables, header row, inferred column types and samples) to
        confirm or correct when creating an upload source (`POST /v1/sources` with `type: upload`) or
        loading a table into one. A staging expires one hour
        after creation and belongs to the uploader. Nothing is stored in a source until a staging is
        used, or discarded with `DELETE /v1/uploads/{uploadId}`. A CSV is UTF-8 (with or without BOM) or UTF-16 LE/BE with a BOM; the delimiter is
        detected among `,` `;` tab and `|`. A refused upload is answered at once and the connection is
        closed.

        Uploads are bounded per user: one who already holds `UPLOAD_MAX_STAGINGS` (default 5)
        unexpired stagings is refused with `429 too_many_stagings` (`retry_after` is when the oldest
        expires), and one with `UPLOAD_MAX_IN_FLIGHT` (default 2) uploads in flight with `429
        too_many_uploads`; both before the body is read. An xlsx workbook, read whole into memory,
        waits for one of `UPLOAD_XLSX_CONCURRENCY` (default 2) reading slots of the process; one
        that waits over 30 seconds is `503 temporarily_unavailable`.

        **Required permissions:** `zeteo.uploads.write` and `zeteo.data.read`. Without a permission, `403 forbidden`. `404 uploads_not_configured` when `UPLOADS_READER_URL` is unset.
      operationId: createUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The staged upload and its preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large - `file_too_large`, over `UPLOAD_MAX_BYTES` (`max_bytes`), or an xlsx whose content inflates past twice that (`max_uncompressed_bytes` too); nothing is left behind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported - `unsupported_file_type` (only CSV and xlsx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable - `unsupported_encoding`, `invalid_character` (a NUL in a CSV cell; `row` names it), `row_too_long`, `too_many_rows`, `too_many_columns`, `malformed_csv`, `malformed_xlsx` or `empty_file`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - `too_many_stagings` or `too_many_uploads`, with `retry_after` and the `Retry-After` header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/uploads/links:
    post:
      tags:
        - Uploads
      summary: Stage a Google spreadsheet
      description: |
        Reads every tab of a Google spreadsheet into a staging, like `POST /v1/uploads` does a file,
        and returns the same preview plus the spreadsheet's id and title. Name the spreadsheet by
        `url` (the link from its address bar or Share dialog, or its bare id). The spreadsheet must
        be shared with the service account (`GET /v1/connections/google`) as a Viewer. A staging is
        used by `POST /v1/sources` with `type: upload`, or by `POST /v1/sources/{sourceId}/tables`
        for an upload source's new tabs. It expires one hour after creation and counts against
        `UPLOAD_MAX_STAGINGS` and the caller's upload slots like a file (`429 too_many_stagings`,
        `too_many_uploads`).

        With `source_id` (and `url`) the staging is for tables to add to that upload source, which
        may hold files, other spreadsheets and merged tables too: the caller must own the source or
        hold `zeteo.sources.write`; a source that is missing and one that is someone else's both
        answer `404 not_found`. The spreadsheet may already be the source's own (its claim is no
        conflict); one another unarchived source reads is `409 sheet_in_use` with or without
        `source_id`.

        **Required permissions:** `zeteo.uploads.write` and `zeteo.data.read` (`403 forbidden`
        without).

        **Errors:** `404 uploads_not_configured` or `google_not_configured`, `404 not_found`,
        `409 sheet_in_use` (an unarchived source already reads this spreadsheet; says nothing of
        whose), `409 not_an_upload_source` (a database source named by `source_id`),
        `409 source_archived`, `422 invalid_sheet_link`, `422 sheet_not_accessible` (not shared with
        the service account, or it does not exist), `422` codes a file's limits give
        (`too_many_rows`, `too_many_columns`, `empty_file`), `502 google_unavailable`,
        `502 google_sign_in_failed` (Google refused the stored key; an admin should check it).
      operationId: createUploadFromLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
      responses:
        '201':
          description: The staged spreadsheet and its preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SheetsUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, `uploads_not_configured` or `google_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `sheet_in_use`, `not_an_upload_source` or `source_archived`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `invalid_sheet_link`, `sheet_not_accessible`, or a limit of the spreadsheet (`too_many_rows`, `too_many_columns`, `empty_file`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - `too_many_stagings` or `too_many_uploads`, with `retry_after` and the `Retry-After` header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `google_unavailable` or `google_sign_in_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/connections/google:
    get:
      tags:
        - Connections
      summary: Read the Google connection
      description: |
        Returns who Zeteo signs in to Google as (the service account's email), never the key. An
        uploader reads it to learn which address to share a spreadsheet with.

        **Required permissions:** `zeteo.sources.read` or `zeteo.uploads.write` (`403 forbidden`
        without both).

        **Errors:** `404 google_not_configured` when no key has been set.
      operationId: getGoogleConnection
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleConnection'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `google_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Connections
      summary: Set the Google connection
      description: |
        Replaces the service-account key Zeteo reads Google Sheets with. The key is `service_account_key`,
        either the JSON object or the text of the downloaded key file. Before anything is stored,
        Google signs the key in; a key it refuses is `422 google_key_rejected` and nothing is
        stored. The key is stored encrypted and never returned. A `zeteo.connection.updated` audit
        entry carries the service account's email.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `400 invalid_request` (not a key, or text that is not JSON), `422
        google_key_rejected`, `502 google_unavailable`.
      operationId: putGoogleConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutGoogleConnectionRequest'
      responses:
        '200':
          description: The connection now in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleConnection'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `google_key_rejected`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `google_unavailable`, Google could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/uploads/{uploadId}:
    delete:
      tags:
        - Uploads
      summary: Discard a staged upload
      description: |
        Drops the staging's tables and deletes it, which frees its place under
        `UPLOAD_MAX_STAGINGS`. Only the user who uploaded it may; anyone else's, an expired
        one and an unknown id are all `404 staging_not_found`.

        **Required permissions:** `zeteo.uploads.write` and `zeteo.data.read`. Without a permission, `403 forbidden`. `404 uploads_not_configured` when `UPLOADS_READER_URL` is unset.
      operationId: deleteUpload
      parameters:
        - name: uploadId
          in: path
          required: true
          description: The staging's id (`staging_id`). A value that is not a UUID is `400 invalid_request`.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `staging_not_found`, or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-queries:
    get:
      tags:
        - Saved queries
      summary: List saved queries
      description: |
        Newest first. `scope=mine` (the default) lists the caller's own, `scope=shared` those shared
        with them or one of their groups, `scope=available` those offered to dashboards
        (`available_for_dashboards`) in the organization the caller is signed in to, other than the caller's
        own, and `scope=all` every saved query (a holder of `zeteo.saved_queries.read`; `403 forbidden`
        otherwise). `source_id`, `owner_id`,
        `shared_with_type` and `shared_with_id` apply to `scope=all` only (`400 invalid_request`
        otherwise); `source_id` also needs `zeteo.sources.read`; `shared_with_type` and
        `shared_with_id` go together. `q` matches names, case-insensitively.

        A saved query the caller cannot run is listed with `accessible: false` and without `query`
        (and without `source`, unless they hold `zeteo.sources.read`).

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: listSavedQueries
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - mine
              - shared
              - all
              - available
            default: mine
        - name: q
          in: query
          required: false
          description: Text to find, 1 to 100 characters
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: source_id
          in: query
          required: false
          description: '`scope=all` only; needs `zeteo.sources.read`'
          schema:
            type: string
            format: uuid
        - name: owner_id
          in: query
          required: false
          description: '`scope=all` only'
          schema:
            type: string
            format: uuid
        - name: shared_with_type
          in: query
          required: false
          description: '`scope=all` only; goes with `shared_with_id`'
          schema:
            type: string
            enum:
              - user
              - group
        - name: shared_with_id
          in: query
          required: false
          description: '`scope=all` only; goes with `shared_with_type`: the saved queries shared directly with this user or group'
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of saved queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSavedQueriesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Saved queries
      summary: Save a query
      description: |
        Saves a query for the caller. It is planned against the caller's own grants exactly as
        `POST /v1/query` plans it, so the same errors, with their detail, come back (`422`). The
        name is unique among the caller's saved queries, whatever the case. A `zeteo.saved_query.created`
        audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: createSavedQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavedQueryRequest'
      responses:
        '201':
          description: The saved query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          description: Conflict - `conflict` (the caller has a saved query of this name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The query cannot be planned as written - the codes of `POST /v1/query`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-queries/{savedQueryId}:
    get:
      tags:
        - Saved queries
      summary: Get a saved query
      description: |
        For its owner, a user it is shared with (directly or through a group), anyone in the
        organization it is available to when it is `available_for_dashboards`, and a holder of
        `zeteo.saved_queries.read`; anyone else gets `404 not_found`. `used_by` counts the dashboards
        and saved panels built on it, for its owner and a holder of `zeteo.saved_queries.read`.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: getSavedQuery
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      responses:
        '200':
          description: The saved query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Saved queries
      summary: Change a saved query
      description: |
        Its owner only (anyone else, `404 not_found`). A changed `query` is planned again against the
        owner's own grants (`422`) and moves the saved query to that query's source. The owner need
        not be able to run it to rename or describe it. `available_for_dashboards` offers it to
        dashboards in the organization the owner is signed in to, or withdraws it. A `zeteo.saved_query.updated` audit entry is
        written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: updateSavedQuery
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSavedQueryRequest'
      responses:
        '200':
          description: The saved query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict` (the caller has another saved query of this name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The query cannot be planned as written - the codes of `POST /v1/query`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Saved queries
      summary: Delete a saved query
      description: |
        Its owner, or a holder of `zeteo.saved_queries.write`; anyone else gets `404 not_found`. Its
        shares go with it; runs already recorded stay. A `zeteo.saved_query.deleted` audit entry is
        written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: deleteSavedQuery
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-queries/{savedQueryId}/copy:
    post:
      tags:
        - Saved queries
      summary: Copy a saved query
      description: |
        Makes the caller's own copy, with the same description and query, of a saved query they can
        see and run. One they can see but not run is `403 saved_query_not_accessible`, whatever the
        cause. A `zeteo.saved_query.copied` audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: copySavedQuery
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopySavedQueryRequest'
      responses:
        '201':
          description: The copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/SavedQueryNotAccessibleResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has a saved query of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-queries/{savedQueryId}/run:
    post:
      tags:
        - Saved queries
      summary: Run a saved query
      description: |
        Runs the stored query as `POST /v1/query` runs a query, planned against the caller's own
        grants, and records the run against the saved query (it shows in `GET /v1/me/runs` and
        `GET /v1/runs`). The body may give `limit` and `offset` in place of the stored ones; no
        body runs it as stored.

        A saved query the caller cannot run is refused with the one `403 saved_query_not_accessible`
        for every cause, with no detail about tables, columns or the planner, and is recorded as a
        refused run whose query is withheld. The errors of the query itself (`429`, `502`, `504` and
        the rest of `POST /v1/query`) are as there.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: runSavedQuery
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedQueryPaging'
      responses:
        '200':
          description: The rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/SavedQueryNotAccessibleResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `source_archived`, the source was archived while the query ran, or `row_rule_unavailable`, a table it reads has a row rule of the caller's that cannot be applied right now (a column it reads is gone, or too many values), so ask an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: |
            The stored query cannot be run with the given paging - for example `invalid_order`.
            Never a planner refusal about access: that is `403 saved_query_not_accessible`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '429':
          description: Too many queries - `too_many_queries` or `source_busy`; retry after `Retry-After`
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `query_failed` or `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Service unavailable - `temporarily_unavailable`: Redis, group membership or the source's
            pool briefly unavailable, or the database too busy. Retry, after `Retry-After` when given.
            Or `row_rule_unavailable`: a table it reads has a row rule of the caller's with `below`, and Tereo cannot give the caller's reporting lines now; retry shortly (never the caller's own rows only, never every row).
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway timeout - `query_timeout`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/saved-queries/{savedQueryId}/export:
    post:
      tags:
        - Saved queries
      summary: Export a saved query's result
      description: |
        Exports the stored query as `POST /v1/export` exports a query: the same NDJSON or CSV stream,
        the same caps, limits, trailers and run record (entry point `export`, recorded against the
        saved query). The body may give `limit` and `offset` in place of the stored ones; no body
        exports it as stored. `offset` above 0 needs an `orderBy` in the stored query.

        A saved query the caller cannot run is refused before the first byte with
        `403 saved_query_not_accessible`, also when the source's exports are off: never
        `export_not_enabled` to a caller without access.

        **Required permissions:** `zeteo.data.export` (`403 forbidden` without).
      operationId: exportSavedQuery
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
        - name: format
          in: query
          required: false
          description: The stream's format. Any other query parameter is `400 invalid_request`.
          schema:
            type: string
            enum:
              - ndjson
              - csv
            default: ndjson
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedQueryPaging'
      responses:
        '200':
          description: The stream, as `POST /v1/export`'s
          headers:
            Content-Disposition:
              description: '`attachment; filename="zeteo-export-<run id>.<format>"`'
              schema:
                type: string
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
            X-Zeteo-Run-Id:
              description: The run's id in the run log
              schema:
                type: string
                format: uuid
            X-Zeteo-Rows-Limited:
              description: '`true` when a row rule of the caller''s limited the rows of a table the query reads; absent otherwise'
              schema:
                type: string
                enum:
                  - 'true'
            Vary:
              description: '`Accept-Encoding`'
              schema:
                type: string
            Content-Encoding:
              description: '`gzip` when the request accepts gzip; absent otherwise'
              schema:
                type: string
                enum:
                  - gzip
            Trailer:
              description: 'CSV only: `X-Zeteo-Export-Status, X-Zeteo-Export-Rows`'
              schema:
                type: string
            X-Zeteo-Warnings:
              description: 'CSV only, when the query has warnings: their codes, comma separated'
              schema:
                type: string
            X-Zeteo-Export-Status:
              description: 'CSV only, an HTTP trailer: `complete` or `truncated`'
              schema:
                type: string
                enum:
                  - complete
                  - truncated
            X-Zeteo-Export-Rows:
              description: 'CSV only, an HTTP trailer: the rows sent'
              schema:
                type: integer
          content:
            application/x-ndjson:
              schema:
                type: string
                description: |
                  Lines of JSON, each ending in `\n`: first `{ "columns": [{ "name", "type" }],
                  "warnings": [...], "run_id": "<uuid>" }`, then one array per row, last
                  `{ "status": "complete" | "truncated", "rows": <count> }`. See `POST /v1/export`.
            text/csv:
              schema:
                type: string
                description: RFC 4180, UTF-8, CRLF line ends. See `POST /v1/export`.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          description: |
            Forbidden - `forbidden` (the token lacks `zeteo.data.export`), `saved_query_not_accessible`
            (the caller may not run the saved query, whatever the cause) or `export_not_enabled` (the
            caller may run it, but the source's exports are off or capped at no rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `source_archived`, the source was archived as the export started, or `row_rule_unavailable`, a table it reads has a row rule of the caller's that cannot be applied right now (a column it reads is gone, or too many values), so ask an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The stored query cannot be exported with the given paging - for example `invalid_order` at path `["offset"]`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '429':
          description: Too many exports - `too_many_exports` or `source_busy`; retry after `Retry-After`
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `query_failed` or `source_unreachable`, before the stream starts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Service unavailable - `temporarily_unavailable`: Redis, group membership or the source's
            pool briefly unavailable, or the database too busy. Retry, after `Retry-After` when given.
            Or `row_rule_unavailable`: a table it reads has a row rule of the caller's with `below`, and Tereo cannot give the caller's reporting lines now; retry shortly (never the caller's own rows only, never every row).
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway timeout - `query_timeout`, before the stream starts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/saved-queries/{savedQueryId}/shares:
    get:
      tags:
        - Saved queries
      summary: List who a saved query is shared with
      description: |
        For its owner, or a holder of `zeteo.saved_queries.read`. Anyone else gets `404 not_found`.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: listSavedQueryShares
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      responses:
        '200':
          description: The shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSharesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Saved queries
      summary: Replace who a saved query is shared with
      description: |
        Makes the shares exactly `principals` (at most 100, each once, not the owner): for its
        owner, or a holder of `zeteo.saved_queries.write` (a holder of `zeteo.saved_queries.read`
        alone gets `403 forbidden`; anyone else, `404 not_found`). A group being added must be global
        or of the caller's signed-in organization (`400 invalid_share`); a share already there is not
        checked again. A user is never limited by organization. Each user newly added who could not
        run the saved query is listed in `warnings`; sharing still happens. A
        `zeteo.saved_query.shared` audit entry is written when anything changed.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: replaceSavedQueryShares
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSharesRequest'
      responses:
        '200':
          description: The shares as they now stand, and the warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceSharesResponse'
        '400':
          description: |
            Bad request - `invalid_request`, with `issues`, or `invalid_share` (the owner among the
            principals, or a group of another organization or one tereo does not have)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the shares changed while saving; load them again and retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-queries/{savedQueryId}/transfer:
    post:
      tags:
        - Saved queries
      summary: Transfer a saved query to another user
      description: |
        Makes `user_id` the owner: for its owner, or a holder of `zeteo.saved_queries.write` (a
        holder of `zeteo.saved_queries.read` alone gets `403 forbidden`; anyone else, `404
        not_found`). With `keep_access` (the default) the previous owner keeps a direct share. The
        new owner may not already have a saved query of that name (`409 conflict`) and may not be a
        service account (`400 invalid_transfer`, as when the user already owns it or tereo has no
        such user). `warning` says the new owner could not run it. A `zeteo.saved_query.transferred`
        audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: transferSavedQuery
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSavedQueryRequest'
      responses:
        '200':
          description: The saved query as the caller now sees it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSavedQueryResponse'
        '400':
          description: |
            Bad request - `invalid_request`, with `issues`, or `invalid_transfer` (the user already
            owns it, tereo has no such user, or the user is a service account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the new owner has a saved query of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/saved-queries/{savedQueryId}/dashboards:
    get:
      tags:
        - Saved queries
      summary: List what a saved query is used by
      description: |
        The dashboards and saved panels built on the saved query, for an administrator to see what a
        change or a deletion would reach: each with its `type` (`dashboard` or `saved_panel`), id, name
        and owner. A dashboard is listed once however many of its panels use it. Nothing is hidden
        from the caller, so the route needs `zeteo.dashboards.read`; the saved query itself is `404
        not_found` when it does not exist.

        **Required permissions:** `zeteo.dashboards.read` (`403 forbidden` without).
      operationId: listSavedQueryDashboards
      parameters:
        - $ref: '#/components/parameters/SavedQueryIdParam'
      responses:
        '200':
          description: The dashboards and saved panels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSavedQueryUsesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards:
    get:
      tags:
        - Dashboards
      summary: List dashboards
      description: |
        Newest first, without panels. `scope=mine` (the default) lists the caller's own, `scope=shared`
        those shared with them or one of their groups, and `scope=all` every dashboard (a holder of
        `zeteo.dashboards.read`; `403 forbidden` otherwise). `owner_id` applies to `scope=all` only
        (`400 invalid_request` otherwise). `q` matches names, case-insensitively. `url` is present only
        when the admin UI is served.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: listDashboards
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - mine
              - shared
              - all
            default: mine
        - name: q
          in: query
          required: false
          description: Text to find, 1 to 100 characters
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: owner_id
          in: query
          required: false
          description: '`scope=all` only'
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of dashboards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDashboardsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Dashboards
      summary: Create a dashboard
      description: |
        Creates a dashboard owned by the caller, with up to 50 panels, each checked as `POST
        /v1/dashboards/{dashboardId}/panels` checks one and laid out on the grid of 12 columns. The name
        is unique among the caller's dashboards, whatever the case. A `zeteo.dashboard.created` audit
        entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: createDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardRequest'
      responses:
