    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:4201
    description: Local development server (each app deploys its own Zeteo; substitute its host)
security:
  - BearerAuth: []
tags:
  - name: Sources
    description: Databases registered with Zeteo
  - name: Uploads
    description: CSV and xlsx files staged for upload sources, which their owners manage and grant
  - name: Catalogue
    description: A source's tables, columns and relations, read from the source by a refresh
  - name: Grants
    description: Which users and groups may query which tables and columns, and how much at once
  - name: Queries
    description: Running and exporting queries over granted tables and columns, and the record of every run
  - name: Saved queries
    description: Queries saved by name, shared with users and groups, and run by whoever may
  - name: Dashboards
    description: Dashboards of panels over saved queries, saved panels that dashboards link, and running a dashboard
  - name: Platform
    description: Health and the signed-in caller
paths:
  /health:
    get:
      tags:
        - Platform
      summary: Health check
      description: |
        Whether Postgres and Redis answer. Public: it names no version and takes no token.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A dependency does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/me:
    get:
      tags:
        - Platform
      summary: Who is signed in, and which zeteo permissions they hold
      description: |
        Describes the caller for the admin UI. `permissions` lists the caller's permissions that start
        with `zeteo.`, sorted, exactly as held: a permission is not expanded along its ladder, so a
        holder of `zeteo.grants.write` is not shown `zeteo.grants.read`, and the UI applies the ladder
        itself (`write` includes `read`, `archive` includes `write`, `delete` includes `archive`,
        `admin` includes all on its base). A bare `admin` permission covers every zeteo permission
        and is listed too when held, verbatim. `name` and `email` come from tereo's directory and
        are `null` when it cannot be reached or does not know the user; the answer is still `200`.

        **Required permissions:** none beyond a valid token.
      operationId: getMe
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
  /v1/sources:
    get:
      tags:
        - Sources
      summary: List sources
      description: |
        Lists sources in creation order (`created_at`, then `id`), database and upload sources
        alike. Archived sources (and deleted upload sources) are left out unless
        `include_archived=true`. A source whose stored settings cannot be decrypted is listed with
        `settings: null`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes. With
        `owner_id=me`, a caller holding `zeteo.uploads.write` and `zeteo.data.read` instead,
        who sees only their own upload sources. `403 forbidden` otherwise.
      operationId: listSources
      parameters:
        - name: include_archived
          in: query
          required: false
          description: Also list archived sources
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          required: false
          description: Only sources of this type
          schema:
            $ref: '#/components/schemas/SourceType'
        - name: owner_id
          in: query
          required: false
          description: Only the upload sources of this owner; `me` for the caller
          schema:
            type: string
            pattern: ^(me|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
          examples:
            me:
              value: me
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Sources
      summary: Register a database or create an upload source
      description: |
        **A database** (`type` `postgres` or `azure-sql`): before anything is stored, Zeteo validates `settings` against the
        type's schema, checks the host against the deploy's network rules, connects with the login
        and inspects its rights. A login that holds rights a read-only login would not is refused
        with `422 writable_login` (the body lists the findings) unless `allow_writable_login`
        is true, in which case the source is stored with `writable_login_allowed: true` and the audit
        entry records the finding codes. Nothing is stored when any step fails. An audit entry
        `zeteo.source.created` is written with the slug, the type and the settings without
        `password` and `ca`. Needs `zeteo.sources.write`. Errors: `409 slug_taken`,
        `422 host_not_allowed`, `422 writable_login`, `502 source_unreachable`.

        **An upload source** (`type: upload`): loads the chosen tables of the caller's staging (see
        `POST /v1/uploads`) into a new upload source owned by the caller, who gets an owner grant (an
        ordinary `all_columns` user grant flagged `owner_grant`) on each table. Column types are the
        inferred ones unless corrected; forcing a type the values do not fit is `422 cast_failed`
        (naming the column and the first rows, 1-based rows of the file with its header counted).
        The new data counts against the owner's `UPLOAD_QUOTA_BYTES` (`409 quota_exceeded`,
        checked under a per-owner lock). Nothing is left on any failure, and the staging is used up
        on success. A `zeteo.source.created` audit entry (metadata `type: upload`) is written (never any cell data).
        Needs `zeteo.uploads.write` and `zeteo.data.read`. Errors: `404
        uploads_not_configured` (`UPLOADS_READER_URL` unset), `404 staging_not_found`
        (expired, missing or someone else's), `409 name_taken` (the slug is in use; a slug made from
        the name gets a suffix instead), `409 quota_exceeded`, `422 cast_failed`, `503
        upload_source_busy`.

        **Required permissions:** `zeteo.sources.write` or `zeteo.uploads.write` to reach the
        route, then as above for the body's `type` (`403 forbidden` without).
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateSourceRequest'
                - $ref: '#/components/schemas/CreateUploadSourceRequest'
      responses:
        '201':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `uploads_not_configured` or `staging_not_found` (an upload source)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `slug_taken` (a database), `name_taken` or `quota_exceeded` (an upload source)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Refused - `host_not_allowed` or `writable_login` (with `findings`) for a database, `cast_failed` for an upload source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`, the source could not be reached or refused the login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}:
    get:
      tags:
        - Sources
      summary: Get a source
      description: |
        Returns one source, archived or not. `settings` is redacted, and null when the stored
        settings cannot be decrypted.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
      operationId: getSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Sources
      summary: Change a source
      description: |
        Changes any of the create fields except `slug` and `type`. A request with neither
        `settings` nor `schemas` never contacts the source. With `settings`, the new object replaces
        the old one whole and goes through the same checks as a create (the login check included;
        send `allow_writable_login: true` again to keep an override); the source's open connections
        are closed so the next use connects with the new settings. After a change to `settings` or
        `schemas` is committed, the catalogue is refreshed; if that refresh fails, the change stands,
        `status` is `unreachable` and the answer is still `200`. An audit entry
        `zeteo.source.updated` lists the names of the fields changed and, when `settings` changed,
        the new settings without `password` and `ca`.

        On an upload source only `name`, `description` and the limit fields apply
        (`409 not_a_database_source` for `settings` or `schemas`). Its owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`) may rename it or change its description,
        which writes `zeteo.source.updated` (as does an admin's change of those alone); its limits
        need `zeteo.sources.write`.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner may send `name` and `description` alone; anyone else gets the same 403.

        **Errors:** `404 not_found`, `409 source_archived`, `409 not_a_database_source`,
        `422 host_not_allowed`, `422 writable_login`, `502 source_unreachable`.
      operationId: updateSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The destination or login was refused - `host_not_allowed` or `writable_login` (with `findings`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Sources
      summary: Delete an upload source
      description: |
        Archives the upload source and drops its stored data (waiting for queries reading it, up to
        the swap's lock wait: `503 upload_source_busy` past it). Catalogue rows stay, marked missing.
        Grants stay too, and the owner grants lose their `owner_grant` flag, so an admin with
        `zeteo.grants.write` may remove them. A `zeteo.source.deleted` audit entry is written.
        A database source is archived instead (`POST /v1/sources/{sourceId}/archive`).

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: deleteSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, or `source_archived` (already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/archive:
    post:
      tags:
        - Sources
      summary: Archive a source
      description: |
        Archives the source and closes its connections. Sources are never deleted, and an archived
        source takes no further change. An audit entry `zeteo.source.archived` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived` (already archived),
        `409 not_a_database_source` (an upload source is deleted, not archived:
        `DELETE /v1/sources/{sourceId}`).
      operationId: archiveSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/test:
    post:
      tags:
        - Sources
      summary: Test a source's login
      description: |
        Connects with the stored settings on a fresh connection, re-checks the host against the
        network rules and runs the login check. Returns the findings (empty for a read-only login);
        it changes nothing, whatever it finds.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived`, `409 not_a_database_source`
        (an upload source has no login to test), `422 host_not_allowed`,
        `502 source_unreachable`.
      operationId: testSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: The login check's findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSourceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          description: The host is not permitted - `host_not_allowed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/transfer:
    post:
      tags:
        - Sources
      summary: Transfer an upload source to another user
      description: |
        Makes `user_id` the owner, who is checked as a saved-query transfer target is (a known
        tereo user, not a service account, not the owner; `400 invalid_transfer`). The owner grants
        move to them (a grant they had becomes the owner grant), and the previous owner keeps an
        ordinary `all_columns` grant unless `keep_access` is false. The new owner's quota must fit
        the source (`409 quota_exceeded`). A `zeteo.source.transferred` audit entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: transferSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSourceRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Bad request - `invalid_request`, or `invalid_transfer`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived` (the upload source is deleted), or `quota_exceeded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/refresh:
    post:
      tags:
        - Catalogue
      summary: Refresh a source's catalogue
      description: |
        Reads the source's tables, views, columns and foreign keys and brings the catalogue up to
        date. New things are added; things no longer in the source get `missing_since` (and lose it
        if they return); a column whose type changed is updated in place. A refresh never deletes a
        row, changes an id or a description, or touches a declared relation. It sets the source's
        `status` to `active` and `last_refreshed_at`. If the source cannot be read the status
        becomes `unreachable`, the catalogue is left as it was and the answer is
        `502 source_unreachable`. An audit entry `zeteo.source.refreshed` carries the summary.
        See `docs/catalog.md`.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

        **Errors:** `404 not_found`, `409 source_archived`, `409 not_a_database_source`
        (an upload source's catalogue follows its uploads), `422 host_not_allowed`,
        `502 source_unreachable`.
      operationId: refreshSource
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      responses:
        '200':
          description: What the refresh changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSummary'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          description: The host is not permitted - `host_not_allowed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `source_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/tables:
    get:
      tags:
        - Catalogue
      summary: List a source's tables
      description: |
        Lists tables and views in `schema_name`, `name` order. Tables a refresh no longer finds
        (`missing_since` set) are left out unless `include_missing=true`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
      operationId: listTables
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - name: include_missing
          in: query
          required: false
          description: Also list tables a refresh no longer finds
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Catalogue
      summary: Add tables to an upload source
      description: |
        Loads the chosen tables of the caller's staging into the upload source, each with an owner
        grant to the source's owner (also when an admin adds it). A table name the source already
        has is `409 name_taken`; the new data counts against the owner's quota (`409
        quota_exceeded`). The staging is used up on success. A `zeteo.source.tables_added` audit
        entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: addTables
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTablesRequest'
      responses:
        '201':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found`, `staging_not_found` (expired, missing or someone else's), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived`, `name_taken` or `quota_exceeded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `cast_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/tables/{tableId}:
    get:
      tags:
        - Catalogue
      summary: Get a table
      description: |
        A table with its columns (in position order) and the relations that start at it, including
        declared ones and ones a refresh marked missing.

        **Upload-source owners:** the owner of an upload source is admitted here for its own tables
        and relations without `zeteo.sources.write`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `404 not_found` for an unknown table or one of another source.
      operationId: getTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      responses:
        '200':
          description: The table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Catalogue
      summary: Describe a table and its columns
      description: |
        Sets the table's description and the descriptions of named columns. A description is at
        most 2000 characters; `null` clears it. A refresh never changes a description. An audit
        entry `zeteo.source.updated` records the table and what changed.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `400 invalid_request` (a description too long, a column the table does not
        have, an empty body), `404 not_found`, `409 source_archived`.
      operationId: patchTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTableRequest'
      responses:
        '200':
          description: The table after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Catalogue
      summary: Load an upload source's table again
      description: |
        Replaces the table's data from a staged table. Columns are matched by normalized name:
        matched columns keep their id, grants and (unless the request sets one) type; new ones are
        added; absent ones get `missing_since` (one back again loses it). The swap is one
        transaction, so a reader sees the old data or the new, never an empty or partial table. A
        `zeteo.source.table_reuploaded` audit entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: reuploadTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReuploadTableRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source, or table in it), `staging_not_found` (expired, missing or someone else's), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived`, or `quota_exceeded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `cast_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Catalogue
      summary: Remove a table from an upload source
      description: |
        Drops the table's data; its catalogue row and its columns stay, marked missing, and grants
        keep their references. A `zeteo.source.table_removed` audit entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: deleteTable
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source, or table in it), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, or `source_archived`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/tables/{tableId}/columns/{columnId}:
    patch:
      tags:
        - Catalogue
      summary: Retype, rename or describe an upload source's column
      description: |
        Changes a column's type (the table is reloaded from its values; values that do not fit are
        `422 cast_failed`, naming the column and the first rows, numbered as 1-based data rows of
        the table, header not counted, in the order of its last load), its name (`409 name_taken`
        for one the table has), or its description. The column keeps its id and grants. A
        `zeteo.source.updated` audit entry is written.

        **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
        `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
        not, gets the same `403 forbidden`.

        **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
        source is `409 source_archived`; `404 uploads_not_configured` while
        `UPLOADS_READER_URL` is unset.
      operationId: updateColumn
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/TableIdParam'
        - name: columnId
          in: path
          required: true
          description: The column's id. A value that is not a UUID is `400 invalid_request`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUploadColumnRequest'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not found - `not_found` (no such source, table or column), or `uploads_not_configured`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - `not_an_upload_source`, `source_archived`, `name_taken`, or `quota_exceeded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: Unprocessable - `cast_failed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{sourceId}/relations:
    get:
      tags:
        - Catalogue
      summary: List a source's relations
      description: |
        Lists discovered and declared relations in creation order, including ones a refresh marked
        missing (`missing_since`).

        **Upload-source owners:** the owner of an upload source is admitted here for its own tables
        and relations without `zeteo.sources.write`.

        **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
      operationId: listRelations
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of relations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRelationsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Catalogue
      summary: Declare a relation
      description: |
        Adds a relation the database does not enforce with a foreign key. Both tables must belong to
        this source; the column lists must have the same length, name present columns, and pair
        columns of the same normalised type that is not `other` or `json`. The name is unique on
        the from table, whether the other relation is discovered or declared. An audit entry
        `zeteo.relation.declared` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `404 not_found` (the source), `409 relation_name_taken`, `409 source_archived`,
        `422 invalid_relation`.
      operationId: declareRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareRelationRequest'
      responses:
        '201':
          description: The declared relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The relation is not valid - `invalid_relation`; the description says which check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/sources/{sourceId}/relations/{relationId}:
    patch:
      tags:
        - Catalogue
      summary: Rename a relation
      description: |
        Renames a discovered or a declared relation. The name follows the declared-name rules and
        must be free on the relation's from table, whether the other relation is discovered or
        declared. A discovered relation renamed this way keeps its name across refreshes; the others
        take the name the naming rules give them at every refresh. An audit entry
        `zeteo.relation.renamed` is written.

        **Upload-source owners:** the owner of an upload source is admitted here for its own tables
        and relations without `zeteo.sources.write`.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `400 invalid_request`, `404 not_found` (also a relation of another source),
        `409 relation_name_taken`, `409 source_archived`.
      operationId: updateRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/RelationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRelationRequest'
      responses:
        '200':
          description: The renamed relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Catalogue
      summary: Remove a declared relation
      description: |
        Removes a declared relation. A discovered relation comes from a foreign key and cannot be
        removed. An audit entry `zeteo.relation.removed` is written.

        **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

        **Errors:** `404 not_found` (also a relation of another source), `409 relation_discovered`,
        `409 source_archived`.
      operationId: deleteRelation
      parameters:
        - $ref: '#/components/parameters/SourceIdParam'
        - $ref: '#/components/parameters/RelationIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/grants:
    get:
      tags:
        - Grants
      summary: List grants
      description: |
        Lists grants in creation order, optionally only those of one principal, table or source.
        Each grant's `principal_status` is looked up once per distinct principal.

        **Upload source owners:** the owner of an upload source is admitted here for grants on its own
        tables (and `source_id` filters to a source they own) without `zeteo.grants.*`; for anyone
        else's table, or a database source's, the answer is the same `403 forbidden` as ever. An
        owner's `group` grants must be to groups that are global or of their signed-in organization
        (`422 group_not_allowed`; saved-query shares answer `400 invalid_share` instead, a deliberate
        difference). The owner's own grant has `owner_grant: true` and cannot be removed or narrowed
        (`409 owner_grant_locked`).

        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).
      operationId: listGrants
      parameters:
        - name: principal_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PrincipalType'
        - name: principal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: table_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: source_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGrantsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      tags:
        - Grants
      summary: Create a grant
      description: |
        Grants a user or group the right to query a table: every column, or a list of columns of
        that table. The principal need not exist yet. A principal has one grant per table. An audit
        entry `zeteo.grant.created` is written.

        **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

        **Errors:** `404 not_found` (the table), `409 source_archived`, `409 grant_exists`,
        `422 invalid_grant` (a column that is not on the table).
      operationId: createGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
      responses:
        '201':
          description: The grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: The grant is not valid - `invalid_grant`
          content:
