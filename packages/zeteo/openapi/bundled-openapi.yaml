        '409':
          description: Conflict - `conflict`, the principal already has limits; change them with `PATCH`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/principal-limits/{principalLimitId}:
    get:
      tags:
        - Grants
      summary: Get a user's or group's concurrency limits
      description: |
        **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

        **Errors:** `404 not_found`.
      operationId: getPrincipalLimit
      parameters:
        - $ref: '#/components/parameters/PrincipalLimitIdParam'
