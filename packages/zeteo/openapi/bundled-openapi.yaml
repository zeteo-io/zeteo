openapi: 3.1.0
info:
  title: Zeteo API
  version: 0.1.0
  description: |
    Zeteo is a query service for apps built on tereo. An administrator registers databases as
    sources and grants tables and columns to users and groups, who query them through a
    validated JSON query language. This spec covers the HTTP API: sources and their catalogue,
    grants and concurrency limits, querying, exporting and the run log. Every path in this spec
    is the full path on the service: the API is versioned under `/v1`, and `GET /health` stays at
    the root.

    ## MCP

    With `MCP_ALLOWED_CLIENTS` set, the service also serves an MCP endpoint at `/mcp` (Streamable
    HTTP, with its OAuth protected-resource metadata under `/.well-known/`), where an AI signed in
    through tereo uses four read-only tools (`list_sources`, `list_tables`, `describe_table` and
    `query`) and the saved query tools (`list_saved_queries`, `get_saved_query`, `run_saved_query`,
    `create_saved_query`, `update_saved_query` and `delete_saved_query`). It is not an HTTP API of this spec; see `docs/mcp.md`.

    ## Authentication

    Requests carry a tereo access token as `Authorization: Bearer <token>`. Zeteo verifies it with
    tereo's SDK.

    ## Permissions

    Reading sources, tables and relations needs `zeteo.sources.read`; registering, changing,
    archiving, testing and refreshing a source, describing a table and declaring or removing a
    relation need `zeteo.sources.write`, which includes read. Without the permission the answer is
    `403 forbidden`, before the body is validated or any source is looked up.

    An upload source (`type: upload`, an upload source made from an uploaded CSV or xlsx while File
    Sources are on) belongs to the user who made it. Its owner, holding `zeteo.uploads.write`
    and `zeteo.data.read`, reads, renames, transfers and deletes it, changes its tables and columns
    and grants them through these same routes without `zeteo.sources.*`; to anyone else it answers
    as a source they may not see does. See `docs/uploads.md`.

    An upload source's tables each come from a file, a tab of a Google spreadsheet or a merge
    (the table's `origin`); one source may hold all three. Zeteo reads Google as one service
    account, set with `PUT /v1/connections/google`; a spreadsheet is shared with that account as a
    Viewer. The source's owner (holding `zeteo.uploads.write` and `zeteo.data.read`) stages a
    spreadsheet with `POST /v1/uploads/links` (naming `source_id` to add its tabs to a source
    that exists), creates the source or adds tables, changes its sync interval, runs Sync now
    (`POST /v1/sources/{sourceId}/refresh`) and merges tables
    (`POST /v1/sources/{sourceId}/merged-tables`) through the same routes as any upload source.

    ## Sources

    A source's `settings` depend on its `type` and are write-only in part: the response carries
    the settings the adapter marks safe (`password` and `ca` are never returned). See
    `docs/sources.md` for the settings of each type, the login check and its override, and the
    network rules.

    ## Catalogue

    A refresh reads a source's tables, columns and foreign keys into the catalogue. Ids of tables,
    columns and relations are stable across refreshes, which never delete a row, change a
    description or touch a declared relation: what disappears from the source is marked with
    `missing_since`. See `docs/catalog.md`.

    ## Measures

    A measure is a named, described calculation over one table of a source (`total_revenue`, an
    average order value), kept by the source's measure editors and used by name in any query
    (`{ "measure": "total_revenue" }`). Its formula is group-level, may use `case`, date arithmetic,
    the calendar functions and other measures of the same table, and may carry a filter that applies
    to every aggregate in it. A caller sees and can use a measure only if its table, every column it
    reads and every relation it joins are in their own visible catalogue; otherwise it is absent,
    and using it is `not_found_or_not_accessible`. Reading measures needs `zeteo.data.read`;
    `zeteo.sources.read` (and an upload source's owner) sees every measure of a source, with whether
    each is broken. Creating, changing and deleting them needs `zeteo.measures.write` and being an
    editor of the source: listed, as a user or through a group, by `PUT
    /v1/sources/{sourceId}/measure-editors` (`zeteo.sources.write`, or an upload source's owner), or
    the owner of the upload source. A change or delete that would break another measure is
    `409 measure_in_use`. `POST /v1/sources/{sourceId}/measures/preview` runs a draft before it is
    saved.

    A measure may be `fixed`: one value that ignores a query's filters and grouping, usable as a
    comparison value (`{ "measure": name }`) and anywhere in an expression. A non-fixed measure may
    name a `date_column` (a date or timestamp column of its home table or reached through to-one
    relations), which a metric query's `bucket` and `range` apply to.

    ## Metrics

    A metric is a named, described formula over measures of any tables of a source
    (`{ "div": [{ "measure": "spend" }, { "measure": "revenue" }] }`), asked for by name in a
    metric query (`{ "source": ..., "metrics": [...], "bucket": "month" }`, see `Query`). It shares
    the measures' editors, permissions, lock and name space (a name is unique across a source's
    measures and metrics). A caller sees a metric in full only when every measure it uses is
    theirs; an editor sees the rest redacted, anyone else not at all, and using one is
    `not_found_or_not_accessible`. A change or delete of a measure that would break a metric is
    `409 measure_in_use`. `POST /v1/sources/{sourceId}/metrics/preview` runs a draft.

    ## Calendar

    `GET /v1/calendar` (`zeteo.data.read`) and `PUT /v1/calendar` (`zeteo.calendar.write`) keep the
    one calendar of the install: working days, holidays, the month a fiscal year starts in and a
    time zone. It defines business days, fiscal buckets and parts, and the time zone "now" is
    evaluated in for every relative date.

    ## Grants

    A grant gives one user or group the right to query one table: every column (including ones
    added later) or a list of columns. Reading grants needs `zeteo.grants.read`; creating,
    replacing and removing them needs `zeteo.grants.write`, which includes read. The same
    permissions govern `/v1/principal-limits`, which gives a user or group its own limits on how
    many queries and exports it runs at once. `GET /v1/principals` searches tereo's users and groups by name (60 searches a minute per caller),
    `GET /v1/principals/all` lists them all (counted as a search), and `POST /v1/principals/lookup` names ones by id, for choosing and showing who a grant is for;
    both need `zeteo.grants.read`, and the lookup also takes `zeteo.runs.read`. See `docs/grants.md`.

    **Row rules.** A grant also says which rows it reaches: `row_access` is `unlimited_default`,
    `all` or `rule`, and a `rule` carries a `row_rule` in the query language's `where` syntax over
    the grant's own table, which may compare a column with the caller's own values under a named
    identity key (`/v1/identity-keys`: keys, the values users hold under them, and who holds none).
    Over all the grants that reach a caller on a table, any `all` grant gives every row, else the
    rules OR together, else every row. A rule is applied to every way of reading the table, and
    callers are told their rows are limited (`rows_limited`, `rows_limited_reason`).
    `GET /v1/grants/effective` shows an admin one user's combined access to one table. See
    `docs/row-rules.md`.

    ## Queries

    `GET /v1/catalog` lists what the caller may query, with the language's JSON Schema, and
    nothing about what they may not. `POST /v1/query` runs a query in the SQL query language over what the caller is granted
    (`zeteo.data.read`); what the caller is not granted fails exactly as what does not exist.
    Every query is recorded in the run log, which `GET /v1/runs` lists (`zeteo.runs.read`). See
    `docs/querying.md`.

    `POST /v1/export` (`zeteo.data.export`) runs the same query and streams its rows as NDJSON or
    CSV, up to the source's export cap, from sources whose exports are on. See `docs/export.md`.

    ## Saved queries

    A query can be saved under a name (`/v1/saved-queries`), shared with users and groups, copied,
    handed to another owner, run and exported. A saved query is planned against the caller's own
    grants each time it is run, so sharing one never widens anyone's access: a recipient who is
    not granted what it reads is told `403 saved_query_not_accessible`, one answer for every cause
    that carries nothing about the query, the source or the planner. One the caller may not see at
    all is `404 not_found`. `GET /v1/me/runs` lists the caller's own runs, and
    `GET /v1/me/principals` searches the users and groups they may share with (`/all` lists them
    all); these need only
    `zeteo.data.read`. `zeteo.saved_queries.read` lets an administrator see every saved query and its
    shares, and `zeteo.saved_queries.write` change shares, transfer and delete them.

    ## Dashboards

    A dashboard (`/v1/dashboards`) is a grid of panels over saved queries, with an optional time
    range, auto-refresh and theme. It is shared with users and groups, copied and handed to another
    owner as a saved query is. A panel is `own` (a saved query, a chart and an optional time column)
    or `linked` to a saved panel (`/v1/saved-panels`: a chart on a saved query, owned and shared on
    its own, so one change reaches every dashboard that links it). A saved query is offered to
    dashboards by its owner (`available_for_dashboards`); `GET /v1/saved-queries?scope=available`
    lists what a caller may build on. Sharing a dashboard never widens anyone's access: every panel
    is decided for its viewer against their own grants, and one they cannot run says only that
    (`state: not_accessible`), never why and never what it reads. `POST
    /v1/dashboards/{dashboardId}/run` streams the panels' results as NDJSON, a line per panel as it
    is ready. `GET /v1/dashboards`, `GET /v1/saved-panels` and everything on them need
    `zeteo.data.read`; `zeteo.dashboards.read` lets an administrator see every dashboard and saved
    panel, their shares and what uses a saved query, and `zeteo.dashboards.write` change shares,
    transfer and delete them.

    ## Pagination

    Lists take `limit` (default 50, at most 100) and an opaque `cursor`, and answer
    `{ data, next_cursor }`, where `next_cursor` is `null` on the last page.

    ## Errors

    An error is `{ "error": "<code>", "error_description": "<text>", ...details, "request_id": "<id>" }`,
    where `request_id` is the request's `X-Request-ID` (the server's log lines for the request
    carry it too). A validation failure is `400 invalid_request` with `issues`, a list of
    `{ path, message }`. The text of a database's own error never appears in a response.
