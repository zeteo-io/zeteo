          description: The dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has a dashboard of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards/{dashboardId}:
    get:
      tags:
        - Dashboards
      summary: Get a dashboard
      description: |
        For its owner, a user it is shared with (directly or through a group) and a holder of
        `zeteo.dashboards.read`; anyone else gets `404 not_found`. Each panel is decided for the viewer:
        one they cannot run carries its `state` and `message` and nothing of why, and one that is not
        `ok` carries no chart or saved query.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    patch:
      tags:
        - Dashboards
      summary: Change a dashboard
      description: |
        Its owner only (anyone else, `404 not_found`). Give at least one field. `panels` replaces the whole
        list: a panel with an `id` is kept (and changed as given), one without is added, and one not
        listed is removed (an `id` not on this dashboard, or named twice, is `400 invalid_panel`). New and
        changed settings are checked as `POST .../panels` checks them. A `zeteo.dashboard.updated` audit
        entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: updateDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardRequest'
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has another dashboard of this name, or the panels changed while saving; load the dashboard again and retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      tags:
        - Dashboards
      summary: Delete a dashboard
      description: |
        Its owner, or a holder of `zeteo.dashboards.write`; anyone else gets `404 not_found`. Its panels
        and shares go with it. A `zeteo.dashboard.deleted` audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: deleteDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards/{dashboardId}/copy:
    post:
      tags:
        - Dashboards
      summary: Copy a dashboard
      description: |
        Makes the caller's own copy of a dashboard they can see, with the same settings and panels (a
        linked panel stays linked). The copy is the caller's, whatever the owner of the original. The name
        is unique among the caller's dashboards, whatever the case. A `zeteo.dashboard.copied` audit
        entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: copyDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyDashboardRequest'
      responses:
        '201':
          description: The copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/InvalidPanelResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the caller has a dashboard of this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards/{dashboardId}/run:
    post:
      tags:
        - Dashboards
      summary: Run a dashboard
      description: |
        Runs the dashboard's panels as the caller and streams a line of NDJSON per panel as soon as it is
        ready, then `{ "done": true }`. Every panel is decided first: one that is not `ok` is answered at
        once with its `state` and `message` and never run (a `not_accessible` one is recorded as a
        refused run of its saved query). The `ok` panels run as entry point `dashboard`, against one
        moment (`now`, to the minute) for the dashboard's time range and any relative dates in the
        saved queries. Panels whose queries are the same (saved query, time column and range) run once
        and each gets its line; results may be served from a cache of `DASHBOARD_CACHE_TTL_SECONDS`
        (default 60), told by `cached_at`. At most the lower of the caller's query concurrency and
        `DASHBOARD_PARALLELISM` (default 4) panels run at a time. A run that fails at run time is a
        line with `error` (and a refusal is the same `not_accessible` line); it never ends the stream.

        The body is optional: `panels` runs only those panels, and `time_range` replaces the dashboard's
        own for this run (null for none). The stream is gzipped when `Accept-Encoding` accepts gzip.
        Everything before the first line is a plain error (`404 not_found` for a dashboard the caller
        may not see, `400 invalid_request`); once the status line is sent no error body can follow, and
        a failure cuts the connection without the stream's last chunk. A stream with no `done` line did
        not end.

        A line never carries a panel's chart or its saved query.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: runDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunDashboardRequest'
      responses:
        '200':
          description: The stream
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
            Vary:
              description: '`Accept-Encoding`'
              schema:
                type: string
            Content-Encoding:
              description: '`gzip` when the request accepts gzip; absent otherwise'
              schema:
                type: string
                enum:
                  - gzip
          content:
            application/x-ndjson:
              schema:
                type: string
                description: |
                  Lines of JSON, each ending in `\n`: one `PanelLine` per panel, in the order the panels
                  are ready (not the dashboard's order), then `{ "done": true }`.
              example: |
                {"panel_id":"0193f1c2-7a4e-7c3d-9b1a-2f6e8d0c4b5a","state":"ok","result":{"columns":[{"name":"revenue","type":"number"}],"rows":[["1200.50"]],"truncated":false}}
                {"panel_id":"0193f1c2-7a4e-7c3d-9b1a-2f6e8d0c4b5b","state":"not_accessible","message":"You need expanded permissions to run this saved query. Ask an admin to extend your access."}
                {"done":true}
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards/{dashboardId}/shares:
    get:
      tags:
        - Dashboards
      summary: List who a dashboard is shared with
      description: |
        For its owner, or a holder of `zeteo.dashboards.read`. Anyone else gets `404 not_found`.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: listDashboardShares
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      responses:
        '200':
          description: The shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSharesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    put:
      tags:
        - Dashboards
      summary: Replace who a dashboard is shared with
      description: |
        Makes the shares exactly `principals` (at most 100, each once, not the owner): for its owner, or a
        holder of `zeteo.dashboards.write` (a holder of `zeteo.dashboards.read` alone gets `403 forbidden`;
        anyone else, `404 not_found`). A group being added must be global or of the caller's signed-in
        organization (`400 invalid_share`). A user is never limited by organization. Recipients' access to
        what the dashboard is built on is not checked: each panel is decided as its viewer looks, so sharing
        never widens anyone's access. A `zeteo.dashboard.shared` audit entry is written when anything changed.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: replaceDashboardShares
      parameters:
        - $ref: '#/components/parameters/DashboardIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSharesRequest'
      responses:
        '200':
          description: The shares as they now stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSharesResponse'
        '400':
          description: Bad request - `invalid_request`, with `issues`, or `invalid_share` (the owner among the principals, or a group of another organization or one tereo does not have)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          description: Conflict - `conflict`, the shares changed while saving; load them again and retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
        '502':
          description: Bad gateway - `tereo_unreachable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
  /v1/dashboards/{dashboardId}/transfer:
    post:
      tags:
        - Dashboards
      summary: Transfer a dashboard to another user
      description: |
        Makes `user_id` the owner: for its owner, or a holder of `zeteo.dashboards.write` (a holder of
        `zeteo.dashboards.read` alone gets `403 forbidden`; anyone else, `404 not_found`). With
        `keep_access` (the default) the previous owner keeps a direct share. The new owner may not already
        have a dashboard of that name (`409 conflict`) and may not be a service account (`400
        invalid_transfer`, as when the user already owns it or tereo has no such user). A
        `zeteo.dashboard.transferred` audit entry is written.

        **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
      operationId: transferDashboard
