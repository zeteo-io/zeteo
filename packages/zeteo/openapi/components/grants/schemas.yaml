PrincipalType:
  type: string
  enum: [user, group]

PrincipalStatus:
  type: string
  enum: [active, orphaned, unknown]
  description: |
    Whether the principal still exists in tereo, looked up when the grant or limits row is shown.
    A user or group is `active`, or `orphaned` when tereo has no such user or group; an orphaned
    row is inert. An archived group is `active`, though its row reaches no one. A lookup that fails
    is shown as `unknown`.

Grant:
  type: object
  description: What one user or group may query of one table
  required: [id, principal_type, principal_id, principal_status, source, table, all_columns, columns, created_by, created_at, updated_at]
  properties:
    id: { type: string, format: uuid }
    principal_type: { $ref: '#/PrincipalType' }
    principal_id: { type: string, format: uuid, description: The user's or group's tereo id }
    principal_status: { $ref: '#/PrincipalStatus' }
    source:
      type: object
      required: [id, slug]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
    table:
      type: object
      required: [id, schema_name, name, missing]
      properties:
        id: { type: string, format: uuid }
        schema_name: { type: string }
        name: { type: string }
        missing: { type: boolean, description: The last refresh no longer found the table; the grant is kept }
    all_columns:
      type: boolean
      description: When true the grant covers every column of the table, including ones added later, and `columns` is empty
    columns:
      type: array
      description: When `all_columns` is false, the granted columns in table order; columns added to the table later are not included
      items:
        type: object
        required: [id, name, missing]
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
          missing: { type: boolean, description: The last refresh no longer found the column; the grant is kept }
    created_by: { type: string, format: uuid }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

ListGrantsResponse:
  type: object
  required: [data, next_cursor]
  properties:
    data:
      type: array
      items: { $ref: '#/Grant' }
    next_cursor: { type: [string, 'null'] }

GrantColumnIds:
  type: array
  minItems: 1
  maxItems: 500
  uniqueItems: true
  items: { type: string, format: uuid }
  description: Columns of the grant's table

CreateGrantRequest:
  description: A grant of every column, or of a list of columns
  oneOf:
    - type: object
      additionalProperties: false
      required: [principal_type, principal_id, table_id, all_columns]
      properties:
        principal_type: { $ref: '#/PrincipalType' }
        principal_id: { type: string, format: uuid }
        table_id: { type: string, format: uuid }
        all_columns: { type: boolean, const: true }
    - type: object
      additionalProperties: false
      required: [principal_type, principal_id, table_id, all_columns, column_ids]
      properties:
        principal_type: { $ref: '#/PrincipalType' }
        principal_id: { type: string, format: uuid }
        table_id: { type: string, format: uuid }
        all_columns: { type: boolean, const: false }
        column_ids: { $ref: '#/GrantColumnIds' }

ReplaceGrantRequest:
  description: The grant's new columns, replacing the old ones whole
  oneOf:
    - type: object
      additionalProperties: false
      required: [all_columns]
      properties:
        all_columns: { type: boolean, const: true }
    - type: object
      additionalProperties: false
      required: [all_columns, column_ids]
      properties:
        all_columns: { type: boolean, const: false }
        column_ids: { $ref: '#/GrantColumnIds' }

PrincipalLimit:
  type: object
  description: A user's or group's own concurrency limits, in place of the environment's defaults
  required: [id, principal_type, principal_id, principal_status, query_concurrency, export_concurrency, created_by, created_at, updated_at]
  properties:
    id: { type: string, format: uuid }
    principal_type: { $ref: '#/PrincipalType' }
    principal_id: { type: string, format: uuid, description: The user's or group's tereo id }
    principal_status: { $ref: '#/PrincipalStatus' }
    query_concurrency:
      type: [integer, 'null']
      minimum: 1
      maximum: 100
      description: Queries the principal may run at once; null when this row does not set it
    export_concurrency:
      type: [integer, 'null']
      minimum: 1
      maximum: 10
      description: Exports the principal may run at once; null when this row does not set it
    created_by: { type: string, format: uuid }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

ListPrincipalLimitsResponse:
  type: object
  required: [data, next_cursor]
  properties:
    data:
      type: array
      items: { $ref: '#/PrincipalLimit' }
    next_cursor: { type: [string, 'null'] }

CreatePrincipalLimitRequest:
  type: object
  description: At least one of the two limits
  additionalProperties: false
  required: [principal_type, principal_id]
  anyOf:
    - required: [query_concurrency]
    - required: [export_concurrency]
  properties:
    principal_type: { $ref: '#/PrincipalType' }
    principal_id: { type: string, format: uuid }
    query_concurrency: { type: integer, minimum: 1, maximum: 100 }
    export_concurrency: { type: integer, minimum: 1, maximum: 10 }

UpdatePrincipalLimitRequest:
  type: object
  description: Either limit or both; `null` clears one. A change that would leave neither set is `400 invalid_request`.
  additionalProperties: false
  minProperties: 1
  properties:
    query_concurrency: { type: [integer, 'null'], minimum: 1, maximum: 100 }
    export_concurrency: { type: [integer, 'null'], minimum: 1, maximum: 10 }
