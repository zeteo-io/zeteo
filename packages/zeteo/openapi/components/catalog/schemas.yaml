ColumnType:
  type: string
  enum: [text, number, boolean, date, timestamp, json, other]
  description: The normalised type; `native_type` keeps the database's own name

Table:
  type: object
  description: A table or view of a source
  required: [id, source_id, schema_name, name, kind, description, last_seen_at, missing_since, row_count, last_loaded_at, origin, sync_error]
  properties:
    id: { type: string, format: uuid, description: 'Stable across refreshes' }
    source_id: { type: string, format: uuid }
    schema_name: { type: string }
    name: { type: string }
    kind: { type: string, enum: [table, view] }
    description: { type: [string, 'null'], maxLength: 2000 }
    last_seen_at: { type: string, format: date-time }
    missing_since:
      type: [string, 'null']
      format: date-time
      description: Set when a refresh no longer finds the table (on an upload source, when it is removed or the source deleted); cleared when it returns
    row_count:
      type: [integer, 'null']
      minimum: 0
      description: An upload source's table, the rows loaded. A database source's, an estimate from the database's statistics at the last refresh (Postgres `pg_class.reltuples`, or the live-row count for a table never analyzed, a partitioned table the sum of its partitions'; SQL Server `sys.partitions`), not a count; null for a view, a table the database has no estimate for, or when the refresh could not read them
    last_loaded_at:
      type: [string, 'null']
      format: date-time
      description: An upload source's table, when it was last loaded (for a Sheets table, its last good sync; for a merged table, its last save); null for a database source's
    origin:
      oneOf:
        - { $ref: '#/TableOrigin' }
        - { type: 'null' }
      description: An upload source's table, where it comes from; null for a database source's
    sync_error:
      oneOf:
        - { $ref: '#/TableSyncError' }
        - { type: 'null' }
      description: A Google Sheets table's last failed sync; null when its last sync was good or it has none. Seen by the source's owner and by `zeteo.sources.read` only (a grantee's catalogue carries none)

TableOrigin:
  description: Where an upload source's table comes from
  oneOf:
    - type: object
      required: [kind, filename]
      properties:
        kind: { type: string, const: file }
        filename: { type: string, description: The uploaded file's name }
    - type: object
      required: [kind, spreadsheet_id, spreadsheet_title, url, tab_id]
      properties:
        kind: { type: string, const: google-sheets }
        spreadsheet_id: { type: string }
        spreadsheet_title: { type: string }
        url: { type: string, format: uri, description: Opens the tab in Google Sheets }
        tab_id: { type: integer, description: The tab's `sheetId` in its spreadsheet }
        tab_title: { type: string, description: The tab's title; absent on a table made before it was kept }
    - type: object
      description: A view that stacks two or more of the source's tables; its definition is `TableDetail.merged`
      required: [kind, members]
      properties:
        kind: { type: string, const: merged }
        members: { type: integer, minimum: 2, description: The number of member tables }

TableSyncError:
  type: object
  required: [code, message]
  properties:
    code: { type: string, description: 'An error code such as `sheet_not_accessible`, `google_unavailable`, `cast_failed` or `sync_failed`' }
    message: { type: string }

Column:
  type: object
  required: [id, name, type, native_type, nullable, position, is_primary_key, description, original_name, missing_since]
  properties:
    id: { type: string, format: uuid, description: 'Stable across refreshes' }
    name: { type: string }
    type: { $ref: '#/ColumnType' }
    native_type:
      type: string
      description: |
        The type as the database writes it. On Postgres an enum is marked `<name> (enum)` and a
        domain `<name> (domain over <base type>)`, the base marked `(enum)` too when it is one
        (`sales.price (domain over money)`); on Azure SQL the type as SQL Server writes it
        (`nvarchar(100)`, `decimal(12,2)`).
      examples: ['integer', 'character varying(20)', 'sales.order_status (enum)', 'sales.price (domain over money)']
    nullable: { type: boolean }
    position: { type: integer, minimum: 1 }
    is_primary_key: { type: boolean }
    description: { type: [string, 'null'], maxLength: 2000 }
    original_name:
      type: [string, 'null']
      description: An upload source's column, its header as written in the file (also its first description); null for a database source's
    missing_since: { type: [string, 'null'], format: date-time }

Relation:
  type: object
  description: A join from one table to another, in the direction `from` to `to`
  required: [id, name, from_table_id, from_columns, to_table_id, to_columns, to_many, origin, missing_since]
  properties:
    id: { type: string, format: uuid, description: 'Stable across refreshes' }
    name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: 'Unique on the from table. A discovered relation takes its name from the database''s identifiers, which may not follow this pattern.' }
    from_table_id: { type: string, format: uuid }
    from_columns: { type: array, minItems: 1, items: { type: string } }
    to_table_id: { type: string, format: uuid }
    to_columns:
      type: array
      minItems: 1
      description: Pairs with `from_columns` by position
      items: { type: string }
    to_many: { type: boolean }
    origin:
      type: string
      enum: [discovered, declared]
      description: '`discovered` relations come from foreign keys and a refresh keeps them current; `declared` ones are added by an administrator and a refresh never touches them'
    missing_since:
      type: [string, 'null']
      format: date-time
      description: Set when a refresh no longer finds the foreign key; always null for a declared relation

TableDetail:
  description: A table with its columns and the relations that start at it; a merged table also carries `merged`
  allOf:
    - $ref: '#/Table'
    - type: object
      required: [columns, relations]
      properties:
        columns:
          type: array
          items: { $ref: '#/Column' }
        relations:
          type: array
          items: { $ref: '#/Relation' }
        merged:
          $ref: '#/MergedDetail'

ListTablesResponse:
  type: object
  required: [data, next_cursor]
  properties:
    data:
      type: array
      items: { $ref: '#/Table' }
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page, `null` on the last

ListRelationsResponse:
  type: object
  required: [data, next_cursor]
  properties:
    data:
      type: array
      items: { $ref: '#/Relation' }
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page, `null` on the last

PatchTableRequest:
  type: object
  description: At least one field. What the body leaves out is not changed; `null` clears a description.
  additionalProperties: false
  minProperties: 1
  properties:
    description: { type: [string, 'null'], maxLength: 2000 }
    columns:
      type: array
      minItems: 1
      maxItems: 1000
      description: Column descriptions by column name; a name the table does not have is `400 invalid_request`
      items:
        type: object
        required: [name, description]
        additionalProperties: false
        properties:
          name: { type: string, minLength: 1, maxLength: 128 }
          description: { type: [string, 'null'], maxLength: 2000 }

DeclareRelationRequest:
  type: object
  required: [name, from_table_id, from_columns, to_table_id, to_columns, to_many]
  additionalProperties: false
  properties:
    name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
    from_table_id: { type: string, format: uuid }
    from_columns: { type: array, minItems: 1, maxItems: 32, items: { type: string, minLength: 1, maxLength: 128 } }
    to_table_id: { type: string, format: uuid }
    to_columns: { type: array, minItems: 1, maxItems: 32, items: { type: string, minLength: 1, maxLength: 128 } }
    to_many: { type: boolean }

RenameRelationRequest:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }

RefreshSummary:
  type: object
  description: What a refresh changed. `missing` counts things newly marked missing in this refresh.
  required: [tables, columns, relations]
  properties:
    tables:
      type: object
      required: [added, missing, restored]
      properties:
        added: { type: integer, minimum: 0 }
        missing: { type: integer, minimum: 0 }
        restored: { type: integer, minimum: 0 }
    columns:
      type: object
      required: [added, changed, missing, restored]
      properties:
        added: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0, description: 'Columns whose type, native type, nullability or primary-key flag changed' }
        missing: { type: integer, minimum: 0 }
        restored: { type: integer, minimum: 0 }
    relations:
      type: object
      required: [added, missing, restored]
      properties:
        added: { type: integer, minimum: 0 }
        missing: { type: integer, minimum: 0 }
        restored: { type: integer, minimum: 0 }

SyncSummary:
  type: object
  description: What a sync of an upload source's Google Sheets tables did, answered by `POST /v1/sources/{sourceId}/refresh`
  required: [synced_at, tables]
  properties:
    synced_at: { type: string, format: date-time }
    tables:
      type: array
      description: The tables synced, or marked missing, in this run, each on its own (a table that was already missing and stays missing is not listed)
      items:
        type: object
        required: [id, name, row_count, missing, error]
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
          row_count: { type: integer, minimum: 0, description: Rows loaded }
          missing: { type: boolean, description: The tab is no longer in the spreadsheet; the table keeps its last data }
          error:
            oneOf:
              - { $ref: '#/TableSyncError' }
              - { type: 'null' }
            description: Why this table did not sync (the others still did); null when it did

MergedTableRequest:
  type: object
  description: A merged table's definition, to create one or replace one's
  additionalProperties: false
  required: [name, label_column, members, columns]
  properties:
    name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: The merged table's name; a table of the source cannot have it already (`409 name_taken`) }
    label_column: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: 'The column that names the member each row comes from; it cannot be the name of an included column' }
    members:
      type: array
      minItems: 2
      maxItems: 100
      description: Tables of the source that are not merged tables themselves; on an edit, a member that is missing may stay
      items:
        type: object
        additionalProperties: false
        required: [table_id, label]
        properties:
          table_id: { type: string, format: uuid }
          label: { type: string, maxLength: 1000, description: 'Trimmed, then 1 to 100 characters, and different for each member' }
    columns:
      type: array
      minItems: 1
      maxItems: 1600
      description: Each column the members have, by its name in them (`from_name`), in the merged table's order; at least one included
      items:
        type: object
        additionalProperties: false
        required: [name, from_name, include]
        properties:
          name: { type: string, maxLength: 1000, description: 'The merged column''s name when included: lowercase letters, digits and `_`, starting with a letter; at most 63 bytes' }
          from_name: { type: string, minLength: 1, maxLength: 1000, description: 'A column''s name in the members, each given once' }
          include: { type: boolean }

MergedDetail:
  type: object
  description: A merged table's definition and state, on `TableDetail.merged`
  required: [label_column, members, columns, available, warnings]
  properties:
    label_column: { type: string }
    members:
      type: array
      items:
        type: object
        required: [table_id, name, label, missing]
        properties:
          table_id: { type: string, format: uuid }
          name: { type: string }
          label: { type: string }
          missing: { type: boolean, description: The member table is missing or removed; it contributes no rows }
    columns:
      type: array
      items:
        type: object
        required: [id, name, from_name, type, members, missing]
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
          from_name: { type: string, description: The members' column name it reads }
          type: { $ref: '../uploads/schemas.yaml#/UploadColumnType' }
          members: { type: array, items: { type: string, format: uuid }, description: 'The live members that have it, fitting or not' }
          missing: { type: boolean, description: No longer included }
    available:
      type: array
      description: The live members' columns that the merged table does not carry
      items:
        type: object
        required: [name, type, members]
        properties:
          name: { type: string }
          type: { $ref: '../uploads/schemas.yaml#/UploadColumnType' }
          members: { type: array, items: { type: string, format: uuid } }
    warnings:
      type: array
      description: Member columns whose type no longer fits the merged column's; their values read as null
      items:
        type: object
        required: [column_id, table_id]
        properties:
          column_id: { type: string, format: uuid }
          table_id: { type: string, format: uuid }

MergedColumnsResponse:
  type: object
  required: [columns, labels]
  properties:
    columns:
      type: array
      description: The union of the members' columns by name, in order of first appearance
      items:
        type: object
        required: [name, type, types, members]
        properties:
          name: { type: string }
          type: { $ref: '../uploads/schemas.yaml#/UploadColumnType' }
          types:
            type: array
            items: { $ref: '#/ColumnType' }
            description: The distinct types the members give it, sorted; `type` is `text` when there are several
          members: { type: array, items: { type: string, format: uuid }, description: The members that have it }
    labels:
      type: object
      additionalProperties: { type: string }
      description: A suggested label for each member, by its table id
