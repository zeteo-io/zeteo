CalendarDate:
  type: string
  pattern: '^\d{4}-\d{2}-\d{2}$'
  description: A calendar day, `YYYY-MM-DD`, that exists

Holiday:
  type: object
  additionalProperties: false
  required: [date, name]
  properties:
    date: { $ref: '#/CalendarDate' }
    name: { type: string, minLength: 1, maxLength: 200 }

CalendarInput:
  type: object
  additionalProperties: false
  required: [working_days, holidays, fiscal_year_start_month, time_zone]
  properties:
    working_days:
      type: array
      minItems: 1
      maxItems: 7
      uniqueItems: true
      description: Weekdays that work, 1 (Monday) to 7 (Sunday); at least one
      items: { type: integer, minimum: 1, maximum: 7 }
    holidays:
      type: array
      maxItems: 5000
      description: Unique by date. A holiday on a non-working day has no effect.
      items: { $ref: '#/Holiday' }
    fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12, description: The month a fiscal year starts in; 1 is January }
    time_zone: { type: string, description: 'An IANA time zone name, or `UTC`' }

Calendar:
  type: object
  description: |
    The one calendar of the install. Its defaults, until an admin saves one, are Monday to Friday,
    no holidays, a fiscal year starting in January and `UTC`, which behave as before the calendar
    existed.
  required: [working_days, holidays, fiscal_year_start_month, time_zone, updated_at]
  properties:
    working_days:
      type: array
      items: { type: integer, minimum: 1, maximum: 7 }
    holidays:
      type: array
      description: Sorted by date
      items: { $ref: '#/Holiday' }
    fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12 }
    time_zone: { type: string }
    updated_at: { type: [string, 'null'], format: date-time, description: Null until a calendar has been saved }
