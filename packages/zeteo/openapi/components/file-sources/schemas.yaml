FileColumnType:
  type: string
  enum: [text, number, boolean, date, timestamp]
  description: A file source column's type. `number` is numeric, `timestamp` is `timestamptz`. All columns are nullable.

FileColumnName:
  type: string
  pattern: '^[a-z][a-z0-9_]{0,62}$'
  description: Lowercase letters, digits and `_`, starting with a letter; at most 63 bytes

StagedColumn:
  type: object
  required: [index, name, original_name, type, samples]
  properties:
    index: { type: integer, minimum: 0, description: The column's 0-based position in the file }
    name: { type: string, description: 'The name it would get: duplicates are suffixed `_2`, `_3`, blank headers are `column_<n>`' }
    original_name: { type: string, description: The header as written in the file }
    type: { $ref: '#/FileColumnType' }
    samples:
      type: array
      description: Up to 10 values seen in the column, as text
      items: { type: string }

StagedTable:
  type: object
  description: One table found in an upload
  required: [key, name, kind, header_row, row_count, columns, warnings]
  properties:
    key: { type: string, description: 'Names the table within the staging: `csv`, `sheet:<name>` or `table:<name>`' }
    name: { type: string }
    kind: { type: string, enum: [csv, sheet, table] }
    header_row: { type: [integer, 'null'], description: The 0-based header row; null when the first row looks like data }
    row_count: { type: integer, minimum: 0, description: 'Data rows, the header not counted' }
    columns:
      type: array
      items: { $ref: '#/StagedColumn' }
    warnings:
      type: array
      items: { type: string }

UploadResponse:
  type: object
  required: [staging_id, expires_at, tables]
  properties:
    staging_id: { type: string, format: uuid }
    expires_at: { type: string, format: date-time, description: One hour after the upload }
    tables:
      type: array
      items: { $ref: '#/StagedTable' }

ColumnCorrection:
  type: object
  additionalProperties: false
  required: [index]
  properties:
    index: { type: integer, minimum: 0, maximum: 1600 }
    name: { $ref: '#/FileColumnName' }
    type: { $ref: '#/FileColumnType' }

TableCorrection:
  type: object
  additionalProperties: false
  required: [key]
  properties:
    key: { type: string, minLength: 1, maxLength: 1024, description: A staged table's `key` }
    name:
      allOf: [{ $ref: '#/FileColumnName' }]
      description: The table's name; it cannot contain `__load_`
    header_row: { type: [integer, 'null'], minimum: 0 }
    columns:
      type: array
      maxItems: 1600
      items: { $ref: '#/ColumnCorrection' }

CreateFileSourceRequest:
  type: object
  additionalProperties: false
  required: [staging_id, name, tables]
  properties:
    staging_id: { type: string, format: uuid }
    name: { type: string, minLength: 1, maxLength: 255 }
    slug: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$', description: Generated from the name when omitted }
    tables:
      type: array
      minItems: 1
      maxItems: 100
      description: The staged tables to load, with any corrections
      items: { $ref: '#/TableCorrection' }

AddTablesRequest:
  type: object
  additionalProperties: false
  required: [staging_id, tables]
  properties:
    staging_id: { type: string, format: uuid }
    tables:
      type: array
      minItems: 1
      maxItems: 100
      items: { $ref: '#/TableCorrection' }

ReuploadTableRequest:
  type: object
  additionalProperties: false
  required: [staging_id, key]
  properties:
    staging_id: { type: string, format: uuid }
    key: { type: string, minLength: 1, maxLength: 1024 }
    header_row: { type: [integer, 'null'], minimum: 0 }
    columns:
      type: array
      maxItems: 1600
      items: { $ref: '#/ColumnCorrection' }

UpdateFileSourceRequest:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: { type: string, minLength: 1, maxLength: 255 }

UpdateFileColumnRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    type: { $ref: '#/FileColumnType' }
    name: { $ref: '#/FileColumnName' }
    description: { type: [string, 'null'], maxLength: 2000 }

TransferFileSourceRequest:
  type: object
  additionalProperties: false
  required: [user_id]
  properties:
    user_id: { type: string, format: uuid, description: 'The new owner, a tereo user who is not a service account' }
    keep_access: { type: boolean, default: true, description: The previous owner keeps an ordinary all-columns grant; false drops it }

FileSourceColumn:
  type: object
  required: [id, name, original_name, type, description, missing]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    original_name: { type: [string, 'null'], description: The header as written in the file; also the initial description }
    type: { $ref: '#/FileColumnType' }
    description: { type: [string, 'null'] }
    missing: { type: boolean, description: The column was absent from the latest re-upload; its grants are kept }

FileSourceTable:
  type: object
  required: [id, name, description, row_count, last_synced_at, missing, columns]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    description: { type: [string, 'null'], description: 'Changed with `PATCH /v1/sources/{sourceId}/tables/{tableId}`' }
    row_count: { type: integer, minimum: 0 }
    last_synced_at: { type: [string, 'null'], format: date-time, description: When the table was last loaded }
    missing: { type: boolean, description: 'The table was removed, or its source deleted' }
    columns:
      type: array
      items: { $ref: '#/FileSourceColumn' }

FileSource:
  type: object
  description: A file source as its owner and admins see it. Never carries any cell of its data.
  required: [id, slug, name, type, owner_id, created_at, archived_at, stored_bytes, share_count, tables]
  properties:
    id: { type: string, format: uuid }
    slug: { type: string }
    name: { type: string }
    type: { type: string, enum: [upload] }
    owner_id: { type: string, format: uuid }
    created_at: { type: string, format: date-time }
    archived_at: { type: [string, 'null'], format: date-time }
    stored_bytes: { type: integer, minimum: 0, description: 'What the source stores, counted against the owner''s quota' }
    share_count: { type: integer, minimum: 0, description: 'How many people and groups its tables are shared with (distinct principals of its grants, the owner grants not counted)' }
    tables:
      type: array
      items: { $ref: '#/FileSourceTable' }

ListFileSourcesResponse:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items: { $ref: '#/FileSource' }
