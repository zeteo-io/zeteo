/v1/sources/{sourceId}/refresh:
  post:
    tags: [Catalogue]
    summary: Refresh a source's catalogue
    description: |
      Reads the source's tables, views, columns and foreign keys and brings the catalogue up to
      date. New things are added; things no longer in the source get `missing_since` (and lose it
      if they return); a column whose type changed is updated in place. A refresh never deletes a
      row, changes an id or a description, or touches a declared relation. It sets the source's
      `status` to `active` and `last_refreshed_at`. If the source cannot be read the status
      becomes `unreachable`, the catalogue is left as it was and the answer is
      `502 source_unreachable`. An audit entry `zeteo.source.refreshed` carries the summary.
      See `docs/catalog.md`.

      **An upload source** is synced instead (Sync now): each of its Google Sheets tables that is
      not removed is read again and reloaded on its own, and the answer is a `SyncSummary`, which
      carries an `error` for each table that did not sync (the others still did): its `code` is
      the cause, such as `sheet_not_accessible`, `google_unavailable`, `google_sign_in_failed`,
      `cast_failed`, `empty_file`, `quota_exceeded` or `sync_failed`. A table's failure is also
      recorded as its `sync_error`, and the source's `sync.failing` lists it. The request itself
      fails only when no sync can start: `409 nothing_to_sync` (the source has no Google Sheets
      table, live or missing), `429 sync_too_soon` (a second Sync now within a minute, with
      `Retry-After`; `nothing_to_sync` is answered before that window is taken) or
      `503 upload_source_busy` (the window is freed again).

      **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). An upload source's
      owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too.

      **Errors:** `404 not_found`, `404 uploads_not_configured` (an upload source), `409 source_archived`,
      `409 nothing_to_sync`, `429 sync_too_soon`, `503 upload_source_busy`; on a database source
      `422 host_not_allowed` and `502 source_unreachable`.
    operationId: refreshSource
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
    responses:
      '200':
        description: What the refresh changed (`RefreshSummary`), or for an upload source what the sync did (`SyncSummary`)
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../../components/catalog/schemas.yaml#/RefreshSummary'
                - $ref: '../../components/catalog/schemas.yaml#/SyncSummary'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
      '409':
        description: Conflict - `source_archived`; on an upload source `nothing_to_sync` (no Google Sheets table to sync)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '429':
        description: Too many requests - `sync_too_soon` (an upload source synced less than a minute ago), with `retry_after` and the `Retry-After` header
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '422':
        description: The host is not permitted - `host_not_allowed` (a database source)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '502':
        description: Bad gateway - `source_unreachable` (a database source)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
