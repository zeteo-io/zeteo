/v1/sources/{sourceId}/refresh:
  post:
    tags: [Catalogue]
    summary: Refresh a source's catalogue
    description: |
      Reads the source's tables, views, columns and foreign keys and brings the catalogue up to
      date. New things are added; things no longer in the source get `missing_since` (and lose it
      if they return); a column whose type changed is updated in place. A refresh never deletes a
      row, changes an id or a description, or touches a declared relation. It sets the source's
      `status` to `active` and `last_refreshed_at`. If the source cannot be read the status
      becomes `unreachable`, the catalogue is left as it was and the answer is
      `502 source_unreachable`. An audit entry `zeteo.source.refreshed` carries the summary.
      See `docs/catalog.md`.

      **A Google Sheets source** is synced instead (Sync now): every tab is read again and its
      table reloaded, and the answer is a `SyncSummary`. The source's owner may do this, and a
      second one within a minute is `429 sync_too_soon` (with `Retry-After`). A sync that fails
      is the error of its cause, and is recorded in the source's `sync.last_error`: besides the Google
      errors below, `422 cast_failed` (a value no longer casts to its column's type), `422 empty_file`
      (a tab has no rows), the upload limit errors (`422`) and `409 quota_exceeded`.

      **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). A Sheets source's
      owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too.

      **Errors:** `404 not_found`, `409 source_archived`, `409 not_a_database_source`
      (an upload source's catalogue follows its uploads), `422 host_not_allowed`,
      `502 source_unreachable`; on a Sheets source also `404 google_not_configured`,
      `422 sheet_not_accessible`, `429 sync_too_soon`, `502 google_unavailable`,
      `502 google_sign_in_failed`, `503 upload_source_busy`; and from a sync `422 cast_failed`, `422 empty_file`, the upload limit
      errors and `409 quota_exceeded`.
    operationId: refreshSource
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
    responses:
      '200':
        description: What the refresh changed (`RefreshSummary`), or for a Google Sheets source what the sync did (`SyncSummary`)
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../../components/catalog/schemas.yaml#/RefreshSummary'
                - $ref: '../../components/catalog/schemas.yaml#/SyncSummary'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
      '409':
        description: Conflict - `source_archived`, `not_a_database_source`; or on a Sheets source `quota_exceeded` (the sync would pass the owner's storage quota)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '429':
        description: Too many requests - `sync_too_soon` (a Sheets source synced less than a minute ago), with `retry_after` and the `Retry-After` header
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '422':
        description: The host is not permitted - `host_not_allowed`; or on a Sheets source `sheet_not_accessible`, `cast_failed`, `empty_file` or an upload limit error
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '502':
        description: Bad gateway - `source_unreachable`; `google_unavailable` or `google_sign_in_failed` (a Sheets source)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
