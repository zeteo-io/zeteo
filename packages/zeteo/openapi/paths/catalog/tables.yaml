/v1/sources/{sourceId}/tables:
  get:
    tags: [Catalogue]
    summary: List a source's tables
    description: |
      Lists tables and views in `schema_name`, `name` order. Tables a refresh no longer finds
      (`missing_since` set) are left out unless `include_missing=true`.

      **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.file_sources.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
    operationId: listTables
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
      - name: include_missing
        in: query
        required: false
        description: Also list tables a refresh no longer finds
        schema: { type: boolean, default: false }
      - $ref: '../../components/parameters.yaml#/LimitParam'
      - $ref: '../../components/parameters.yaml#/CursorParam'
    responses:
      '200':
        description: A page of tables
        content:
          application/json:
            schema:
              $ref: '../../components/catalog/schemas.yaml#/ListTablesResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  post:
    tags: [Catalogue]
    summary: Add tables to an upload source
    description: |
      Loads the chosen tables of the caller's staging into the upload source, each with an owner
      grant to the source's owner (also when an admin adds it). A table name the source already
      has is `409 name_taken`; the new data counts against the owner's quota (`409
      quota_exceeded`). The staging is used up on success. A `zeteo.file_source.updated` audit
      entry is written.

      **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
      `zeteo.file_sources.write` and `zeteo.data.read`); anyone else, whether the source exists or
      not, gets the same `403 forbidden`.

      **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
      source is `409 source_archived`; `404 file_sources_not_configured` while
      `FILE_SOURCES_READER_URL` is unset.
    operationId: addTables
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/file-sources/schemas.yaml#/AddTablesRequest'
    responses:
      '201':
        description: The source
        content:
          application/json:
            schema:
              $ref: '../../components/sources/schemas.yaml#/Source'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `not_found`, `staging_not_found` (expired, missing or someone else's), or `file_sources_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `not_an_upload_source`, `source_archived`, `name_taken` or `quota_exceeded`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: Unprocessable - `cast_failed`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503':
        description: Service unavailable - `file_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
