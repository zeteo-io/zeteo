/v1/sources/{sourceId}/tables/{tableId}/columns/{columnId}:
  patch:
    tags: [Catalogue]
    summary: Retype, rename or describe an upload source's column
    description: |
      Changes a column's type (the table is reloaded from its values; values that do not fit are
      `422 cast_failed`, naming the column and the first rows, numbered as 1-based data rows of
      the table, header not counted, in the order of its last load), its name (`409 name_taken`
      for one the table has), or its description. The column keeps its id and grants. A
      `zeteo.file_source.updated` audit entry is written.

      **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
      `zeteo.file_sources.write` and `zeteo.data.read`); anyone else, whether the source exists or
      not, gets the same `403 forbidden`.

      **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
      source is `409 source_archived`; `404 file_sources_not_configured` while
      `FILE_SOURCES_READER_URL` is unset.
    operationId: updateColumn
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
      - $ref: '../../components/parameters.yaml#/TableIdParam'
      - name: columnId
        in: path
        required: true
        description: The column's id. A value that is not a UUID is `400 invalid_request`.
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/file-sources/schemas.yaml#/UpdateFileColumnRequest'
    responses:
      '200':
        description: The source
        content:
          application/json:
            schema:
              $ref: '../../components/sources/schemas.yaml#/Source'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `not_found` (no such source, table or column), or `file_sources_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `not_an_upload_source`, `source_archived`, `name_taken`, or `quota_exceeded`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: Unprocessable - `cast_failed`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503':
        description: Service unavailable - `file_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
