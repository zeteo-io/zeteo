/v1/sources/{sourceId}/tables/{tableId}:
  get:
    tags: [Catalogue]
    summary: Get a table
    description: |
      A table with its columns (in position order) and the relations that start at it, including
      declared ones and ones a refresh marked missing. A merged table of an upload source also
      carries `merged`: its members, its columns and the columns it does not carry. An upload
      source's table carries its `origin` and, for its owner and `zeteo.sources.read`, the
      `sync_error` of a Google Sheets table that failed to sync.

      **Upload-source owners:** the owner of an upload source is admitted here for its own tables
      and relations without `zeteo.sources.write`.

      **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

      **Errors:** `404 not_found` for an unknown table or one of another source.
    operationId: getTable
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
      - $ref: '../../components/parameters.yaml#/TableIdParam'
    responses:
      '200':
        description: The table
        content:
          application/json:
            schema:
              $ref: '../../components/catalog/schemas.yaml#/TableDetail'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  patch:
    tags: [Catalogue]
    summary: Describe a table and its columns
    description: |
      Sets the table's description and the descriptions of named columns. A description is at
      most 2000 characters; `null` clears it. A refresh never changes a description. An audit
      entry `zeteo.source.updated` records the table and what changed.

      **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner (holding `zeteo.uploads.write` and `zeteo.data.read`) may too; anyone else gets the same 403.

      **Errors:** `400 invalid_request` (a description too long, a column the table does not
      have, an empty body), `404 not_found`, `409 source_archived`.
    operationId: patchTable
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
      - $ref: '../../components/parameters.yaml#/TableIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/catalog/schemas.yaml#/PatchTableRequest'
    responses:
      '200':
        description: The table after the change
        content:
          application/json:
            schema:
              $ref: '../../components/catalog/schemas.yaml#/TableDetail'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
      '409': { $ref: '../../components/responses.yaml#/ConflictResponse' }
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
  put:
    tags: [Catalogue]
    summary: Load an upload source's table again
    description: |
      Replaces the table's data from a staged table. Columns are matched by normalized name:
      matched columns keep their id, grants and (unless the request sets one) type; new ones are
      added; absent ones get `missing_since` (one back again loses it). The swap is one
      transaction, so a reader sees the old data or the new, never an empty or partial table. A
      `zeteo.source.table_reuploaded` audit entry is written.

      **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
      `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
      not, gets the same `403 forbidden`.

      **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
      source is `409 source_archived`; `404 uploads_not_configured` while
      `UPLOADS_READER_URL` is unset.

      **Only a file's table** is loaded again this way: a table that syncs from Google Sheets, a
      merged table, or a file's table given a staging of a spreadsheet is `409 not_a_file_upload`
      (a Sheets table follows its spreadsheet: use Sync now, `POST /v1/sources/{sourceId}/refresh`).
      A merged table is redefined with `PUT /v1/sources/{sourceId}/tables/{tableId}/merged`.
    operationId: reuploadTable
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
      - $ref: '../../components/parameters.yaml#/TableIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/uploads/schemas.yaml#/ReuploadTableRequest'
    responses:
      '200':
        description: The source
        content:
          application/json:
            schema:
              $ref: '../../components/sources/schemas.yaml#/Source'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `not_found` (no such source, or table in it), `staging_not_found` (expired, missing or someone else's), or `uploads_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `not_an_upload_source`, `source_archived`, `quota_exceeded`, or `not_a_file_upload` (the table is not a file's, or the staging is a spreadsheet's)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: Unprocessable - `cast_failed`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503':
        description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
  delete:
    tags: [Catalogue]
    summary: Remove a table from an upload source
    description: |
      Drops the table's data; its catalogue row and its columns stay, marked missing, and grants
      keep their references. A `zeteo.source.table_removed` audit entry is written.

      A Google Sheets table is removed the same way, also when a sync marked it missing (its tab
      was deleted): it is then marked removed, so a sync never brings it back, its tab can be added
      again as a new table, and the source's claim on the spreadsheet is released once no table
      uses it. A merged table is removed too (its view is dropped). A table that a live merged
      table of the source reads is `409 table_in_merged_table` (`merged_table` names it): edit or
      remove the merged table first.

      The table's measures are deleted with it, as are the metrics that use any of them; each is
      recorded as a `zeteo.measure.deleted` or `zeteo.metric.deleted` entry whose metadata names
      the table (`removed_with_table`), and the `table_removed` entry lists them
      (`measures_removed`, `metrics_removed`). A measure of another table that uses one of them (a
      fixed measure is usable from any table), directly or through others, would be left broken:
      the removal is then refused with `409 measure_in_use`, `dependents` naming those measures
      and the metrics using them, and nothing changes. Delete or change them first.

      **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
      `zeteo.uploads.write` and `zeteo.data.read`); anyone else, whether the source exists or
      not, gets the same `403 forbidden`.

      **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
      source is `409 source_archived`; `404 uploads_not_configured` while
      `UPLOADS_READER_URL` is unset.
    operationId: deleteTable
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
      - $ref: '../../components/parameters.yaml#/TableIdParam'
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `not_found` (no such source, or table in it), or `uploads_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `not_an_upload_source`, `source_archived`, `table_in_merged_table` (a live merged table reads it; `merged_table` names it), or `measure_in_use` (a measure of another table uses one of this table's; `dependents` names them)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503':
        description: Service unavailable - `upload_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
