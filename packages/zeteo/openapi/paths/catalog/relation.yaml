/v1/sources/{sourceId}/relations/{relationId}:
  delete:
    tags: [Catalogue]
    summary: Remove a declared relation
    description: |
      Removes a declared relation. A discovered relation comes from a foreign key and cannot be
      removed. An audit entry `zeteo.relation.removed` is written.

      **Required permissions:** `zeteo.sources.write` (`403 forbidden` without).

      **Errors:** `404 not_found` (also a relation of another source), `409 relation_discovered`,
      `409 source_archived`.
    operationId: deleteRelation
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
      - $ref: '../../components/parameters.yaml#/RelationIdParam'
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
      '409': { $ref: '../../components/responses.yaml#/ConflictResponse' }
