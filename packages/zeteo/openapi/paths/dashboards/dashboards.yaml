/v1/dashboards:
  get:
    tags: [Dashboards]
    summary: List dashboards
    description: |
      Newest first, without panels. `scope=mine` (the default) lists the caller's own, `scope=shared`
      those shared with them or one of their groups, and `scope=all` every dashboard (a holder of
      `zeteo.dashboards.read`; `403 forbidden` otherwise). `owner_id` applies to `scope=all` only
      (`400 invalid_request` otherwise). `q` matches names, case-insensitively. `url` is present only
      when the admin UI is served.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: listDashboards
    parameters:
      - { name: scope, in: query, required: false, schema: { type: string, enum: [mine, shared, all], default: mine } }
      - { name: q, in: query, required: false, description: 'Text to find, 1 to 100 characters', schema: { type: string, minLength: 1, maxLength: 100 } }
      - { name: owner_id, in: query, required: false, description: '`scope=all` only', schema: { type: string, format: uuid } }
      - $ref: '../../components/parameters.yaml#/LimitParam'
      - $ref: '../../components/parameters.yaml#/CursorParam'
    responses:
      '200':
        description: A page of dashboards
        content:
          application/json:
            schema:
              $ref: '../../components/dashboards/schemas.yaml#/ListDashboardsResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  post:
    tags: [Dashboards]
    summary: Create a dashboard
    description: |
      Creates a dashboard owned by the caller, with up to 50 panels, each checked as `POST
      /v1/dashboards/{dashboardId}/panels` checks one and laid out on the grid of 12 columns. The name
      is unique among the caller's dashboards, whatever the case. A `zeteo.dashboard.created` audit
      entry is written.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: createDashboard
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/dashboards/schemas.yaml#/CreateDashboardRequest'
    responses:
      '201':
        description: The dashboard
        content:
          application/json:
            schema:
              $ref: '../../components/dashboards/schemas.yaml#/Dashboard'
      '400': { $ref: '../../components/responses.yaml#/InvalidPanelResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409':
        description: Conflict - `conflict`, the caller has a dashboard of this name
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
