/v1/dashboards/{dashboardId}/copy:
  post:
    tags: [Dashboards]
    summary: Copy a dashboard
    description: |
      Makes the caller's own copy of a dashboard they can see, with the same settings and panels (a
      linked panel stays linked). The copy is the caller's, whatever the owner of the original. The name
      is unique among the caller's dashboards, whatever the case. A `zeteo.dashboard.copied` audit
      entry is written.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: copyDashboard
    parameters:
      - $ref: '../../components/parameters.yaml#/DashboardIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/dashboards/schemas.yaml#/CopyDashboardRequest'
    responses:
      '201':
        description: The copy
        content:
          application/json:
            schema:
              $ref: '../../components/dashboards/schemas.yaml#/Dashboard'
      '400': { $ref: '../../components/responses.yaml#/InvalidPanelResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409':
        description: Conflict - `conflict`, the caller has a dashboard of this name
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
