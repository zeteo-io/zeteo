/v1/dashboards/{dashboardId}/panels/{panelId}:
  patch:
    tags: [Dashboards]
    summary: Change a panel
    description: |
      A panel of the caller's own dashboard. Give at least one of `title`, the place (`x`, `y`, `w`,
      `h`) and, for an own panel, `saved_query_id`, `chart` and `time_column`; a linked panel has no
      settings of its own, so changing those is `400 invalid_panel` (change the saved panel, or detach
      the panel). A new saved query, chart or time column is checked as `POST .../panels` checks them
      (`400 invalid_panel` with `problems`; `403 saved_query_not_accessible` for a saved query the
      caller may not run); a title or place changes without asking whether the caller can run it. A
      `zeteo.dashboard.updated` audit entry is written.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: updateDashboardPanel
    parameters:
      - $ref: '../../components/parameters.yaml#/DashboardIdParam'
      - $ref: '../../components/parameters.yaml#/PanelIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/dashboards/schemas.yaml#/UpdatePanelRequest'
    responses:
      '200':
        description: The panel
        content:
          application/json:
            schema:
              $ref: '../../components/dashboards/schemas.yaml#/Panel'
      '400': { $ref: '../../components/responses.yaml#/InvalidPanelResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/SavedQueryNotAccessibleResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409': { $ref: '../../components/responses.yaml#/RowRuleConflictResponse', description: "Conflict - `conflict` (the panels changed while saving; load the dashboard again and retry), or `row_rule_unavailable` (a row rule of the caller's cannot be applied; see the shared response)" }
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/RowRuleUnavailableResponse' }
  delete:
    tags: [Dashboards]
    summary: Remove a panel
    description: |
      From the caller's own dashboard. A `zeteo.dashboard.updated` audit entry is written.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: removeDashboardPanel
    parameters:
      - $ref: '../../components/parameters.yaml#/DashboardIdParam'
      - $ref: '../../components/parameters.yaml#/PanelIdParam'
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
