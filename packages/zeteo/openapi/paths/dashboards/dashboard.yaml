/v1/dashboards/{dashboardId}:
  get:
    tags: [Dashboards]
    summary: Get a dashboard
    description: |
      For its owner, a user it is shared with (directly or through a group) and a holder of
      `zeteo.dashboards.read`; anyone else gets `404 not_found`. Each panel is decided for the viewer:
      one they cannot run carries its `state` and `message` and nothing of why, and one that is not
      `ok` carries no chart or saved query.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: getDashboard
    parameters:
      - $ref: '../../components/parameters.yaml#/DashboardIdParam'
    responses:
      '200':
        description: The dashboard
        content:
          application/json:
            schema:
              $ref: '../../components/dashboards/schemas.yaml#/Dashboard'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  patch:
    tags: [Dashboards]
    summary: Change a dashboard
    description: |
      Its owner only (anyone else, `404 not_found`). Give at least one field. `panels` replaces the whole
      list: a panel with an `id` is kept (and changed as given), one without is added, and one not
      listed is removed (an `id` not on this dashboard, or named twice, is `400 invalid_panel`). New and
      changed settings are checked as `POST .../panels` checks them. A `zeteo.dashboard.updated` audit
      entry is written.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: updateDashboard
    parameters:
      - $ref: '../../components/parameters.yaml#/DashboardIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/dashboards/schemas.yaml#/UpdateDashboardRequest'
    responses:
      '200':
        description: The dashboard
        content:
          application/json:
            schema:
              $ref: '../../components/dashboards/schemas.yaml#/Dashboard'
      '400': { $ref: '../../components/responses.yaml#/InvalidPanelResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409': { $ref: '../../components/responses.yaml#/RowRuleConflictResponse', description: "Conflict - `conflict` (the caller has another dashboard of this name, or the panels changed while saving; load the dashboard again and retry), or `row_rule_unavailable` (a row rule of the caller's cannot be applied; see the shared response)" }
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/RowRuleUnavailableResponse' }
  delete:
    tags: [Dashboards]
    summary: Delete a dashboard
    description: |
      Its owner, or a holder of `zeteo.dashboards.write`; anyone else gets `404 not_found`. Its panels
      and shares go with it. A `zeteo.dashboard.deleted` audit entry is written.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: deleteDashboard
    parameters:
      - $ref: '../../components/parameters.yaml#/DashboardIdParam'
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
