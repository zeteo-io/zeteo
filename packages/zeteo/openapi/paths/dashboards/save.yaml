/v1/dashboards/{dashboardId}/panels/{panelId}/save:
  post:
    tags: [Dashboards]
    summary: Save a panel as a saved panel
    description: |
      Makes a saved panel of the caller's own from an own panel of their own dashboard: the same saved
      query, chart and time column, checked again as they are for a new panel (`400 invalid_panel`).
      The dashboard's panel stays as it is; link it by adding a linked panel. A linked panel is already
      a saved panel (`400 invalid_panel`). The name is unique among the caller's saved panels, whatever
      the case. A `zeteo.saved_panel.created` audit entry is written.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: saveDashboardPanel
    parameters:
      - $ref: '../../components/parameters.yaml#/DashboardIdParam'
      - $ref: '../../components/parameters.yaml#/PanelIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/saved-panels/schemas.yaml#/SaveAsSavedPanelRequest'
    responses:
      '201':
        description: The saved panel
        content:
          application/json:
            schema:
              $ref: '../../components/saved-panels/schemas.yaml#/SavedPanel'
      '400': { $ref: '../../components/responses.yaml#/InvalidPanelResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/SavedQueryNotAccessibleResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409':
        description: Conflict - `conflict`, the caller has a saved panel of this name
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
