/v1/grants/{grantId}:
  get:
    tags: [Grants]
    summary: Get a grant
    description: |
      **Upload source owners:** the owner of an upload source is admitted here for grants on its own
      tables (and `source_id` filters to a source they own) without `zeteo.grants.*`; for anyone
      else's table, or a database source's, the answer is the same `403 forbidden` as ever. An
      owner's `group` grants must be to groups that are global or of their signed-in organization
      (`422 group_not_allowed`; saved-query shares answer `400 invalid_share` instead, a deliberate
      difference). The owner's own grant has `owner_grant: true` and cannot be removed or narrowed
      (`409 owner_grant_locked`). A row rule an owner writes may not use identity values
      (`400 invalid_row_rule`, with `path` to the reference); only a holder of
      `zeteo.grants.write` may.

      **Required permissions:** `zeteo.grants.read`, which `zeteo.grants.write` includes (`403 forbidden` without).

      **Errors:** `404 not_found`.
    operationId: getGrant
    parameters:
      - $ref: '../../components/parameters.yaml#/GrantIdParam'
    responses:
      '200':
        description: The grant
        content:
          application/json:
            schema:
              $ref: '../../components/grants/schemas.yaml#/Grant'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  put:
    tags: [Grants]
    summary: Replace a grant's columns and rows
    description: |
      Replaces the grant's columns and rows whole: every column, or exactly the listed ones, and
      `row_access` with its `row_rule` and `row_rule_description`. `row_access` is required, with
      no default, so a body of columns only is `400 invalid_request` and cannot drop a rule by
      accident. The principal and table of a grant never change; remove the grant and create
      another for that. An upload source's owner may not use identity values in the rule
      (`400 invalid_row_rule`). An audit entry `zeteo.grant.updated` is written, carrying the rule.

      **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

      **Errors:** `400 invalid_row_rule` (`path` into the body, starting `row_rule`), `404 not_found`, `409 source_archived`, `422 invalid_grant`.
    operationId: replaceGrant
    parameters:
      - $ref: '../../components/parameters.yaml#/GrantIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/grants/schemas.yaml#/ReplaceGrantRequest'
    responses:
      '200':
        description: The grant
        content:
          application/json:
            schema:
              $ref: '../../components/grants/schemas.yaml#/Grant'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409': { $ref: '../../components/responses.yaml#/ConflictResponse' }
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: The grant is not valid - `invalid_grant`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  delete:
    tags: [Grants]
    summary: Remove a grant
    description: |
      Removes the grant and its columns, also when its source is archived. An audit entry
      `zeteo.grant.removed` is written.

      **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

      **Errors:** `404 not_found`.
    operationId: deleteGrant
    parameters:
      - $ref: '../../components/parameters.yaml#/GrantIdParam'
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
