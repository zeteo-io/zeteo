/v1/identity-keys/{keyId}:
  patch:
    tags: [Grants]
    summary: Change an identity key's label or description
    description: |
      Changes the label, the description or both; `null` clears the description. The name never
      changes. An audit entry `zeteo.identity_key.updated` is written.

      **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

      **Errors:** `400 invalid_request`, `404 not_found`.
    operationId: updateIdentityKey
    parameters:
      - $ref: '../../components/parameters.yaml#/IdentityKeyIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/grants/schemas.yaml#/UpdateIdentityKeyRequest'
    responses:
      '200':
        description: The key
        content:
          application/json:
            schema:
              $ref: '../../components/grants/schemas.yaml#/IdentityKey'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  delete:
    tags: [Grants]
    summary: Delete an identity key
    description: |
      Deletes the key and every value under it. Refused while a grant's rule names it
      (`409 identity_key_in_use`, with the `grant_ids`). An audit entry
      `zeteo.identity_key.removed` is written.

      **Required permissions:** `zeteo.grants.write` (`403 forbidden` without).

      **Errors:** `404 not_found`, `409 identity_key_in_use`.
    operationId: deleteIdentityKey
    parameters:
      - $ref: '../../components/parameters.yaml#/IdentityKeyIdParam'
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409': { $ref: '../../components/responses.yaml#/ConflictResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
