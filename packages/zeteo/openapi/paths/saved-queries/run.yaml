/v1/saved-queries/{savedQueryId}/run:
  post:
    tags: [Saved queries]
    summary: Run a saved query
    description: |
      Runs the stored query as `POST /v1/query` runs a query, planned against the caller's own
      grants, and records the run against the saved query (it shows in `GET /v1/me/runs` and
      `GET /v1/runs`). The body may give `limit` and `offset` in place of the stored ones; no
      body runs it as stored.

      A saved query the caller cannot run is refused with the one `403 saved_query_not_accessible`
      for every cause, with no detail about tables, columns or the planner, and is recorded as a
      refused run whose query is withheld. The errors of the query itself (`429`, `502`, `504` and
      the rest of `POST /v1/query`) are as there.

      **Required permissions:** `zeteo.data.read` (`403 forbidden` without).
    operationId: runSavedQuery
    parameters:
      - $ref: '../../components/parameters.yaml#/SavedQueryIdParam'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../../components/saved-queries/schemas.yaml#/SavedQueryPaging'
    responses:
      '200':
        description: The rows
        content:
          application/json:
            schema:
              $ref: '../../components/queries/schemas.yaml#/QueryResult'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/SavedQueryNotAccessibleResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409':
        description: Conflict - `source_archived`, the source was archived while the query ran
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: |
          The stored query cannot be run with the given paging - for example `invalid_order`.
          Never a planner refusal about access: that is `403 saved_query_not_accessible`.
        content:
          application/json:
            schema:
              $ref: '../../components/queries/schemas.yaml#/QueryError'
      '429':
        description: Too many queries - `too_many_queries` or `source_busy`; retry after `Retry-After`
        headers:
          Retry-After:
            description: Seconds to wait before retrying
            schema: { type: integer }
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '502':
        description: Bad gateway - `query_failed` or `source_unreachable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
      '504':
        description: Gateway timeout - `query_timeout`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
