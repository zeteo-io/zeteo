/v1/saved-queries/{savedQueryId}/dashboards:
  get:
    tags: [Saved queries]
    summary: List what a saved query is used by
    description: |
      The dashboards and saved panels built on the saved query, for an administrator to see what a
      change or a deletion would reach: each with its `type` (`dashboard` or `saved_panel`), id, name
      and owner. A dashboard is listed once however many of its panels use it. Nothing is hidden
      from the caller, so the route needs `zeteo.dashboards.read`; the saved query itself is `404
      not_found` when it does not exist.

      **Required permissions:** `zeteo.dashboards.read` (`403 forbidden` without).
    operationId: listSavedQueryDashboards
    parameters:
      - $ref: '../../components/parameters.yaml#/SavedQueryIdParam'
    responses:
      '200':
        description: The dashboards and saved panels
        content:
          application/json:
            schema:
              $ref: '../../components/saved-queries/schemas.yaml#/ListSavedQueryUsesResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
