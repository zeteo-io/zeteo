/v1/me:
  get:
    tags: [Platform]
    summary: Who is signed in, and which zeteo permissions they hold
    description: |
      Describes the caller for the admin UI. `permissions` lists the caller's permissions that start
      with `zeteo.`, sorted, exactly as held: a permission is not expanded along its ladder, so a
      holder of `zeteo.grants.write` is not shown `zeteo.grants.read`, and the UI applies the ladder
      itself (`write` includes `read`, `archive` includes `write`, `delete` includes `archive`,
      `admin` includes all on its base). A bare `admin` permission covers every zeteo permission
      and is listed too when held, verbatim. `name` and `email` come from tereo's directory and
      are `null` when it cannot be reached or does not know the user; the answer is still `200`.

      **Required permissions:** none beyond a valid token.
    operationId: getMe
    responses:
      '200':
        description: The caller
        content:
          application/json:
            schema:
              $ref: '../../components/platform/schemas.yaml#/Me'
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
