/v1/uploads/links:
  post:
    tags: [Uploads]
    summary: Stage a Google spreadsheet
    description: |
      Reads every tab of a Google spreadsheet into a staging, like `POST /v1/uploads` does a file,
      and returns the same preview plus the spreadsheet's id and title. Name the spreadsheet by
      `url` (the link from its address bar or Share dialog, or its bare id) or, to add tabs to a
      Sheets source, by `source_id`. The spreadsheet must be shared with the service account
      (`GET /v1/connections/google`) as a Viewer. A staging is used by `POST /v1/sources` with
      `type: google-sheets`, or by `POST /v1/sources/{sourceId}/tables` for a source's new tabs. It
      expires one hour after creation and counts against `UPLOAD_MAX_STAGINGS` and the caller's
      upload slots like a file (`429 too_many_stagings`, `too_many_uploads`).

      With `source_id` the caller must own the source or hold `zeteo.sources.write`; a source that
      is missing and one that is someone else's both answer `404 not_found`.

      **Required permissions:** `zeteo.uploads.write` and `zeteo.data.read` (`403 forbidden`
      without).

      **Errors:** `404 uploads_not_configured` or `google_not_configured`, `404 not_found`,
      `409 sheet_in_use` (an unarchived source already reads this spreadsheet; says nothing of
      whose), `409 not_a_sheets_source`, `409 source_archived`, `422 invalid_sheet_link`, `422
      sheet_not_accessible` (not shared with the service account, or it does not exist), `422`
      codes a file's limits give (`too_many_rows`, `too_many_columns`, `empty_file`),
      `502 google_unavailable`, `502 google_sign_in_failed` (Google refused the stored key; an
      admin should check it).
    operationId: createUploadFromLink
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/uploads/schemas.yaml#/LinkRequest'
    responses:
      '201':
        description: The staged spreadsheet and its preview
        content:
          application/json:
            schema:
              $ref: '../../components/uploads/schemas.yaml#/SheetsUploadResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `not_found`, `uploads_not_configured` or `google_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `sheet_in_use`, `not_a_sheets_source` or `source_archived`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: Unprocessable - `invalid_sheet_link`, `sheet_not_accessible`, or a limit of the spreadsheet (`too_many_rows`, `too_many_columns`, `empty_file`)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '429':
        description: Too many requests - `too_many_stagings` or `too_many_uploads`, with `retry_after` and the `Retry-After` header
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '502':
        description: Bad gateway - `google_unavailable` or `google_sign_in_failed`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
