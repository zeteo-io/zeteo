/v1/file-sources/{sourceId}:
  parameters:
    - $ref: '../../components/parameters.yaml#/SourceIdParam'
  get:
    tags: [File sources]
    summary: Get a file source
    description: |
      **Required permissions:** `zeteo.data.read`, and `zeteo.file_sources.write` or `zeteo.sources.read` (`403 forbidden` without). Reading needs the owner (with `zeteo.file_sources.write`) or a holder of `zeteo.sources.read`; anyone else, and an id that is not a file source, gets `404 file_source_not_found`. `404 file_sources_not_configured` when `FILE_SOURCES_READER_URL` is unset.
    operationId: getFileSource
    responses:
      '200':
        description: The file source
        content:
          application/json:
            schema:
              $ref: '../../components/file-sources/schemas.yaml#/FileSource'
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `file_source_not_found`, or `file_sources_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  patch:
    tags: [File sources]
    summary: Rename a file source
    description: |
      Changes the name. Its slug, tables and data stay. (To change limits on a file source, use
      `PATCH /v1/sources/{sourceId}`, which accepts only limit fields for one.) A
      `zeteo.file_source.updated` audit entry is written.

      **Required permissions:** `zeteo.data.read`, and `zeteo.file_sources.write` or `zeteo.sources.read` to reach the route (`403 forbidden` without). Only the owner (with `zeteo.file_sources.write`) or a holder of `zeteo.sources.write` may change it; anyone else, and an id that is not a file source, gets `404 file_source_not_found`. An archived (deleted) file source is `409 source_archived`. `404 file_sources_not_configured` when `FILE_SOURCES_READER_URL` is unset.
    operationId: updateFileSource
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/file-sources/schemas.yaml#/UpdateFileSourceRequest'
    responses:
      '200':
        description: The file source
        content:
          application/json:
            schema:
              $ref: '../../components/file-sources/schemas.yaml#/FileSource'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `file_source_not_found`, or `file_sources_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `source_archived` (the file source is deleted)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  delete:
    tags: [File sources]
    summary: Delete a file source
    description: |
      Archives the source and drops its stored data. Catalogue rows stay, marked missing. Grants
      stay too, and the owner grants lose their `owner_grant` flag, so an admin with
      `zeteo.grants.write` may remove them. A `zeteo.file_source.deleted` audit entry is written.

      **Required permissions:** `zeteo.data.read`, and `zeteo.file_sources.write` or `zeteo.sources.read` to reach the route (`403 forbidden` without). Only the owner (with `zeteo.file_sources.write`) or a holder of `zeteo.sources.write` may change it; anyone else, and an id that is not a file source, gets `404 file_source_not_found`. An archived (deleted) file source is `409 source_archived`. `404 file_sources_not_configured` when `FILE_SOURCES_READER_URL` is unset.
    operationId: deleteFileSource
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `file_source_not_found`, or `file_sources_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `source_archived` (the file source is deleted)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503':
        description: Service unavailable - `file_source_busy` (another load of this source is running; retry), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
