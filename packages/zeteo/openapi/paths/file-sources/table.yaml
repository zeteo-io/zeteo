/v1/file-sources/{sourceId}/tables/{tableId}:
  parameters:
    - $ref: '../../components/parameters.yaml#/SourceIdParam'
    - $ref: '../../components/parameters.yaml#/TableIdParam'
  put:
    tags: [File sources]
    summary: Re-upload a table's data
    description: |
      Replaces the table's data from a staged table. Columns are matched by normalized name:
      matched columns keep their id and grants, new ones are added, absent ones get
      `missing_since`. The swap is one transaction, so a reader sees the old data or the new,
      never an empty or partial table. A `zeteo.file_source.reuploaded` audit entry is written.

      **Required permissions:** `zeteo.data.read`, and `zeteo.file_sources.write` or `zeteo.sources.read` to reach the route (`403 forbidden` without). Only the owner (with `zeteo.file_sources.write`) or a holder of `zeteo.sources.write` may change it; anyone else, and an id that is not a file source, gets `404 file_source_not_found`. An archived (deleted) file source is `409 source_archived`. `404 file_sources_not_configured` when `FILE_SOURCES_READER_URL` is unset.
    operationId: reuploadFileSourceTable
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/file-sources/schemas.yaml#/ReuploadTableRequest'
    responses:
      '200':
        description: The file source
        content:
          application/json:
            schema:
              $ref: '../../components/file-sources/schemas.yaml#/FileSource'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `file_source_not_found`, `staging_not_found` (expired, missing or someone else's), or `file_sources_not_configured`, or `not_found` (no such table in the source)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '409':
        description: Conflict - `source_archived` (the file source is deleted), `quota_exceeded`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '422':
        description: Unprocessable - `cast_failed`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '503':
        description: Service unavailable - `file_source_busy` (another load of this source is running; retry), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
  delete:
    tags: [File sources]
    summary: Remove a table from a file source
    description: |
      Drops the table's data; its catalogue row stays, marked missing.

      **Required permissions:** `zeteo.data.read`, and `zeteo.file_sources.write` or `zeteo.sources.read` to reach the route (`403 forbidden` without). Only the owner (with `zeteo.file_sources.write`) or a holder of `zeteo.sources.write` may change it; anyone else, and an id that is not a file source, gets `404 file_source_not_found`. An archived (deleted) file source is `409 source_archived`. `404 file_sources_not_configured` when `FILE_SOURCES_READER_URL` is unset.
    operationId: deleteFileSourceTable
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `file_source_not_found`, or `file_sources_not_configured`, or `not_found` (no such table in the source)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `source_archived` (the file source is deleted)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503':
        description: Service unavailable - `file_source_busy` (another load of this source is running; retry), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
