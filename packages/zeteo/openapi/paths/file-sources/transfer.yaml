/v1/file-sources/{sourceId}/transfer:
  parameters:
    - $ref: '../../components/parameters.yaml#/SourceIdParam'
  post:
    tags: [File sources]
    summary: Transfer a file source to another user
    description: |
      Makes `user_id` the owner, who is checked as a saved-query transfer target is (a known
      tereo user, not a service account; `400 invalid_transfer`). The previous owner keeps an
      ordinary `all_columns` grant unless `keep_access` is false. The new owner's quota must fit
      the source (`409 quota_exceeded`). A `zeteo.file_source.transferred` audit entry is written.

      **Required permissions:** `zeteo.file_sources.write` and `zeteo.data.read`. Without a permission, `403 forbidden`. The owner, or a holder of `zeteo.sources.write`.
    operationId: transferFileSource
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/file-sources/schemas.yaml#/TransferFileSourceRequest'
    responses:
      '200':
        description: The file source
        content:
          application/json:
            schema:
              $ref: '../../components/file-sources/schemas.yaml#/FileSource'
      '400':
        description: Bad request - `invalid_request`, or `invalid_transfer`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '409':
        description: Conflict - `quota_exceeded`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '502':
        description: Bad gateway - `tereo_unreachable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '503':
        description: Service unavailable - `file_source_busy` (another load of this source is running; retry), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
