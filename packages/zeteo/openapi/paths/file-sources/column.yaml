/v1/file-sources/{sourceId}/tables/{tableId}/columns/{columnId}:
  parameters:
    - $ref: '../../components/parameters.yaml#/SourceIdParam'
    - $ref: '../../components/parameters.yaml#/TableIdParam'
    - name: columnId
      in: path
      required: true
      schema: { type: string, format: uuid }
  patch:
    tags: [File sources]
    summary: Retype, rename or describe a column
    description: |
      Changes a column's type (the data is cast; values that do not fit are `422 cast_failed`,
      naming the column and the first rows), its name, or its description.

      **Required permissions:** `zeteo.data.read`, and `zeteo.file_sources.write` or `zeteo.sources.read` to reach the route (`403 forbidden` without). Only the owner (with `zeteo.file_sources.write`) or a holder of `zeteo.sources.write` may change it; anyone else, and an id that is not a file source, gets `404 file_source_not_found`. An archived (deleted) file source is `409 source_archived`. `404 file_sources_not_configured` when `FILE_SOURCES_READER_URL` is unset.
    operationId: updateFileSourceColumn
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/file-sources/schemas.yaml#/UpdateFileColumnRequest'
    responses:
      '200':
        description: The file source
        content:
          application/json:
            schema:
              $ref: '../../components/file-sources/schemas.yaml#/FileSource'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `file_source_not_found`, or `file_sources_not_configured`, or `not_found` (no such table or column)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '409':
        description: Conflict - `source_archived` (the file source is deleted), `name_taken`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '422':
        description: Unprocessable - `cast_failed`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '503':
        description: Service unavailable - `file_source_busy` (another load of this source is running; retry), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
