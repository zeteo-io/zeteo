/v1/sources/{sourceId}:
  get:
    tags: [Sources]
    summary: Get a source
    description: |
      Returns one source, archived or not. `settings` is redacted, and null when the stored
      settings cannot be decrypted.

      **Required permissions:** `zeteo.sources.read`, which `zeteo.sources.write` includes (`403 forbidden` without). On an upload source its owner (holding `zeteo.file_sources.write` and `zeteo.data.read`) may too; anyone else gets the same 403.
    operationId: getSource
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
    responses:
      '200':
        description: The source
        content:
          application/json:
            schema:
              $ref: '../../components/sources/schemas.yaml#/Source'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  patch:
    tags: [Sources]
    summary: Change a source
    description: |
      Changes any of the create fields except `slug` and `type`. A request with neither
      `settings` nor `schemas` never contacts the source. With `settings`, the new object replaces
      the old one whole and goes through the same checks as a create (the login check included;
      send `allow_writable_login: true` again to keep an override); the source's open connections
      are closed so the next use connects with the new settings. After a change to `settings` or
      `schemas` is committed, the catalogue is refreshed; if that refresh fails, the change stands,
      `status` is `unreachable` and the answer is still `200`. An audit entry
      `zeteo.source.updated` lists the names of the fields changed and, when `settings` changed,
      the new settings without `password` and `ca`.

      On an upload source only `name` and the limit fields apply (`409 not_a_database_source`
      for `settings` or `schemas`). Its owner (holding `zeteo.file_sources.write` and
      `zeteo.data.read`) may rename it, which writes `zeteo.file_source.updated` (as does an
      admin's rename alone); its limits need `zeteo.sources.write`.

      **Required permissions:** `zeteo.sources.write` (`403 forbidden` without). On an upload source its owner may send `name` alone; anyone else gets the same 403.

      **Errors:** `404 not_found`, `409 source_archived`, `409 not_a_database_source`,
      `422 host_not_allowed`, `422 writable_login`, `502 source_unreachable`.
    operationId: updateSource
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/sources/schemas.yaml#/UpdateSourceRequest'
    responses:
      '200':
        description: The source
        content:
          application/json:
            schema:
              $ref: '../../components/sources/schemas.yaml#/Source'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409': { $ref: '../../components/responses.yaml#/ConflictResponse' }
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: The destination or login was refused - `host_not_allowed` or `writable_login` (with `findings`)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '502':
        description: Bad gateway - `source_unreachable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
  delete:
    tags: [Sources]
    summary: Delete an upload source
    description: |
      Archives the upload source and drops its stored data (waiting for queries reading it, up to
      the swap's lock wait: `503 file_source_busy` past it). Catalogue rows stay, marked missing.
      Grants stay too, and the owner grants lose their `owner_grant` flag, so an admin with
      `zeteo.grants.write` may remove them. A `zeteo.file_source.deleted` audit entry is written.
      A database source is archived instead (`POST /v1/sources/{sourceId}/archive`).

      **Required permissions:** `zeteo.sources.write`, or the source's owner (holding
      `zeteo.file_sources.write` and `zeteo.data.read`); anyone else, whether the source exists or
      not, gets the same `403 forbidden`.

      **Upload sources only:** a database source is `409 not_an_upload_source`. A deleted upload
      source is `409 source_archived`; `404 file_sources_not_configured` while
      `FILE_SOURCES_READER_URL` is unset.
    operationId: deleteSource
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
    responses:
      '204': { $ref: '../../components/responses.yaml#/NoContentResponse' }
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404':
        description: Not found - `not_found`, or `file_sources_not_configured`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '409':
        description: Conflict - `not_an_upload_source`, or `source_archived` (already deleted)
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503':
        description: Service unavailable - `file_source_busy` (an upload source's load could not finish in time; retry after `Retry-After`), or `service_unavailable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
