/v1/sources/{sourceId}/metrics/preview:
  post:
    tags: [Metrics]
    summary: Preview a draft metric
    description: |
      Runs a draft metric, not saved, as a metric query asking for it alone, so an editor can check
      the number before saving: one row, or, with `bucket`, one per period ordered by `period`,
      and within `range` when given (each measure's own date column; `measure_has_no_date` for a
      measure without one). The draft is checked as on create, then runs as a normal query as the
      caller, with the same limits, the same concurrency leases and a record in the run log with
      entry point `measure_preview`. A client that disconnects stops its query on the source.

      **Required permissions:** `zeteo.measures.write` and `zeteo.data.read` (`403 forbidden`
      without), and being an editor of the source.

      **Errors:** `400` as on create; `404 not_found`; `409 source_archived`; the query errors of
      `POST /v1/query` (`422`, `429`, `502`, `503`).
    operationId: previewMetric
    parameters:
      - $ref: '../../components/parameters.yaml#/SourceIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/measures/schemas.yaml#/PreviewMetricRequest'
          example:
            metric:
              name: cost_per_dollar
              description: Ad spend per dollar of revenue.
              formula: { div: [{ measure: spend }, { measure: revenue }] }
            bucket: month
            range: { gte: { relative: { unit: year, offset: 0, startOf: true } } }
    responses:
      '200':
        description: The rows, as `POST /v1/query` answers them
        content:
          application/json:
            schema:
              $ref: '../../components/queries/schemas.yaml#/QueryResult'
      '400':
        description: |
          Bad request - `invalid_request`, with `issues`; or the formula does not plan, with the
          query error code of the problem and the `path` at fault
        content:
          application/json:
            schema:
              $ref: '../../components/measures/schemas.yaml#/InvalidMeasureError'
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409':
        description: Conflict - `source_archived`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '413': { $ref: '../../components/responses.yaml#/PayloadTooLargeResponse' }
      '422':
        description: The query cannot be run as written; the errors of `POST /v1/query`
        content:
          application/json:
            schema:
              $ref: '../../components/queries/schemas.yaml#/QueryError'
      '429':
        description: Too many queries - `too_many_queries` or `source_busy`; retry after `Retry-After`
        headers:
          Retry-After:
            description: Seconds to wait before retrying
            schema: { type: integer }
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '502':
        description: Bad gateway - `query_failed` or `source_unreachable`
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/Error'
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
