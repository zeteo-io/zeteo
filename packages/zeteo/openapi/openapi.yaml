    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:4201
    description: Local development server (each app deploys its own Zeteo; substitute its host)
security:
  - BearerAuth: []
tags:
  - name: Sources
    description: Databases registered with Zeteo
  - name: Catalogue
    description: A source's tables, columns and relations, read from the source by a refresh
  - name: Platform
    description: Health
x-tagGroups:
  - name: Sources
    tags: [Sources, Catalogue]
  - name: Platform
    tags: [Platform]
paths:
  /health:
    $ref: './paths/platform/health.yaml#/~1health'
  /v1/sources:
    $ref: './paths/sources/sources.yaml#/~1v1~1sources'
  /v1/sources/{sourceId}:
    $ref: './paths/sources/source.yaml#/~1v1~1sources~1{sourceId}'
  /v1/sources/{sourceId}/archive:
    $ref: './paths/sources/archive.yaml#/~1v1~1sources~1{sourceId}~1archive'
  /v1/sources/{sourceId}/test:
    $ref: './paths/sources/test.yaml#/~1v1~1sources~1{sourceId}~1test'
  /v1/sources/{sourceId}/refresh:
    $ref: './paths/catalog/refresh.yaml#/~1v1~1sources~1{sourceId}~1refresh'
  /v1/sources/{sourceId}/tables:
    $ref: './paths/catalog/tables.yaml#/~1v1~1sources~1{sourceId}~1tables'
  /v1/sources/{sourceId}/tables/{tableId}:
    $ref: './paths/catalog/table.yaml#/~1v1~1sources~1{sourceId}~1tables~1{tableId}'
  /v1/sources/{sourceId}/relations:
    $ref: './paths/catalog/relations.yaml#/~1v1~1sources~1{sourceId}~1relations'
  /v1/sources/{sourceId}/relations/{relationId}:
    $ref: './paths/catalog/relation.yaml#/~1v1~1sources~1{sourceId}~1relations~1{relationId}'
