servers:
  - url: http://localhost:4201
    description: Local development server (each app deploys its own Zeteo; substitute its host)
security:
  - BearerAuth: []
tags:
  - name: Sources
    description: Databases registered with Zeteo
  - name: Platform
    description: Health
x-tagGroups:
  - name: Sources
    tags: [Sources]
  - name: Platform
    tags: [Platform]
paths:
  /health:
    $ref: './paths/platform/health.yaml#/~1health'
  /v1/sources:
    $ref: './paths/sources/sources.yaml#/~1v1~1sources'
  /v1/sources/{sourceId}:
    $ref: './paths/sources/source.yaml#/~1v1~1sources~1{sourceId}'
  /v1/sources/{sourceId}/archive:
    $ref: './paths/sources/archive.yaml#/~1v1~1sources~1{sourceId}~1archive'
  /v1/sources/{sourceId}/test:
    $ref: './paths/sources/test.yaml#/~1v1~1sources~1{sourceId}~1test'
components:
  securitySchemes:
    BearerAuth:
      $ref: './components/security.yaml#/BearerAuth'
  parameters:
    CursorParam:
      $ref: './components/parameters.yaml#/CursorParam'
    LimitParam:
      $ref: './components/parameters.yaml#/LimitParam'
  responses:
    BadRequestResponse:
      $ref: './components/responses.yaml#/BadRequestResponse'
    UnauthorizedResponse:
      $ref: './components/responses.yaml#/UnauthorizedResponse'
    ForbiddenResponse:
      $ref: './components/responses.yaml#/ForbiddenResponse'
    NotFoundResponse:
      $ref: './components/responses.yaml#/NotFoundResponse'
    ConflictResponse:
      $ref: './components/responses.yaml#/ConflictResponse'
    PayloadTooLargeResponse:
      $ref: './components/responses.yaml#/PayloadTooLargeResponse'
    ServerErrorResponse:
      $ref: './components/responses.yaml#/ServerErrorResponse'
    ServiceUnavailableResponse:
      $ref: './components/responses.yaml#/ServiceUnavailableResponse'
    NoContentResponse:
      $ref: './components/responses.yaml#/NoContentResponse'
  schemas:
    Error:
      $ref: './components/responses.yaml#/Error'
    HealthStatus:
      $ref: './components/platform/schemas.yaml#/HealthStatus'
    SourceType:
      $ref: './components/sources/schemas.yaml#/SourceType'
    PostgresSettings:
      $ref: './components/sources/schemas.yaml#/PostgresSettings'
    LoginFinding:
      $ref: './components/sources/schemas.yaml#/LoginFinding'
    Source:
      $ref: './components/sources/schemas.yaml#/Source'
    ListSourcesResponse:
      $ref: './components/sources/schemas.yaml#/ListSourcesResponse'
    CreateSourceRequest:
      $ref: './components/sources/schemas.yaml#/CreateSourceRequest'
    UpdateSourceRequest:
      $ref: './components/sources/schemas.yaml#/UpdateSourceRequest'
    TestSourceResponse:
      $ref: './components/sources/schemas.yaml#/TestSourceResponse'
