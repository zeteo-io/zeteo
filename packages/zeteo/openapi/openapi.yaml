  /v1/grants:
    $ref: './paths/grants/grants.yaml#/~1v1~1grants'
  /v1/grants/{grantId}:
    $ref: './paths/grants/grant.yaml#/~1v1~1grants~1{grantId}'
  /v1/principal-limits:
    $ref: './paths/grants/principal-limits.yaml#/~1v1~1principal-limits'
  /v1/principal-limits/{principalLimitId}:
    $ref: './paths/grants/principal-limit.yaml#/~1v1~1principal-limits~1{principalLimitId}'
  /v1/principals:
    $ref: './paths/principals/principals.yaml#/~1v1~1principals'
  /v1/principals/lookup:
    $ref: './paths/principals/lookup.yaml#/~1v1~1principals~1lookup'
  /v1/catalog:
    $ref: './paths/queries/catalog.yaml#/~1v1~1catalog'
  /v1/query:
    $ref: './paths/queries/query.yaml#/~1v1~1query'
  /v1/export:
    $ref: './paths/queries/export.yaml#/~1v1~1export'
  /v1/runs:
    $ref: './paths/queries/runs.yaml#/~1v1~1runs'
