servers:
  - url: http://localhost:4201
    description: Local development server (each app deploys its own Zeteo; substitute its host)
security:
  - BearerAuth: []
tags:
  - name: Sources
    description: Databases registered with Zeteo
  - name: Catalogue
    description: A source's tables, columns and relations, read from the source by a refresh
  - name: Grants
    description: Which users and groups may query which tables and columns, and how much at once
  - name: Queries
    description: Running and exporting queries over granted tables and columns, and the record of every run
  - name: Platform
    description: Health and the signed-in caller
x-tagGroups:
  - name: Sources
    tags: [Sources, Catalogue]
  - name: Access
    tags: [Grants]
  - name: Querying
    tags: [Queries]
  - name: Platform
    tags: [Platform]
