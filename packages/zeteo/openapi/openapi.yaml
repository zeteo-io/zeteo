servers:
  - url: http://localhost:4201
    description: Local development server (each app deploys its own Zeteo; substitute its host)
security:
  - BearerAuth: []
tags:
  - name: Sources
    description: Databases registered with Zeteo
  - name: Uploads
    description: CSV and xlsx files staged for upload sources, which their owners manage and grant
  - name: Connections
    description: The connection to Google that Google Sheets sources read through
  - name: Catalogue
    description: A source's tables, columns and relations, read from the source by a refresh
  - name: Grants
    description: Which users and groups may query which tables and columns, and how much at once
  - name: Queries
    description: Running and exporting queries over granted tables and columns, and the record of every run
  - name: Saved queries
    description: Queries saved by name, shared with users and groups, and run by whoever may
  - name: Dashboards
    description: Dashboards of panels over saved queries, saved panels that dashboards link, and running a dashboard
  - name: Platform
    description: Health and the signed-in caller
x-tagGroups:
  - name: Sources
    tags: [Sources, Uploads, Connections, Catalogue]
  - name: Access
    tags: [Grants]
  - name: Querying
    tags: [Queries, Saved queries, Dashboards]
  - name: Platform
    tags: [Platform]
