name: Publish

on:
  pull_request:
    types: [closed]
    branches: [master]
  # For the first release, or to retry one that failed.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# The job releases the version zeteo's manifest names unless that version's tag
# already exists, so a rerun skips what already went out.
jobs:
  image:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'automated-version-bump'))
    runs-on: ubuntu-latest
    permissions:
      # Tags each published version.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check for an unreleased version
        id: version
        run: |
          version=$(node -p "require('./packages/zeteo/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/zeteo@$version" >/dev/null; then
            echo "zeteo@$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.version.outputs.release == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.release == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.version.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The source label links the package to this repository, so it takes the
      # repository's access settings.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.version.outputs.release == 'true'
        id: meta
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=zeteo
            org.opencontainers.image.description=Zeteo: governed queries over your data sources, by REST and MCP, on Tereo

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.version.outputs.release == 'true'
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          cache-from: type=gha
          # The cache only speeds up builds: a failed export must not fail the
          # job and skip the tag.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "zeteo@$VERSION"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin "zeteo@$VERSION"
